<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Curate — Raveen Fernando</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ── Password screen ── */
    #pw-screen {
      position: fixed; inset: 0; z-index: 900;
      background: var(--color-bg);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; padding: 2rem; text-align: center;
    }
    #pw-screen.hidden { display: none; }

    /* ── Header ── */
    #curate-header {
      padding: 2rem 1.5rem 1rem;
      border-bottom: 1px solid var(--color-border);
    }
    #curate-header h1 {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      margin: 0 0 0.25rem;
    }
    #curate-header p {
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin: 0;
    }

    /* ── Progress bar ── */
    #progress-bar-wrap {
      padding: 1rem 1.5rem 0;
    }
    #progress-label {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.4rem;
    }
    #progress-track {
      height: 3px;
      background: var(--color-border);
      border-radius: 2px;
      overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      background: var(--color-gold);
      border-radius: 2px;
      transition: width 0.3s ease;
      width: 0%;
    }

    /* ── Photo grid ── */
    #photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px;
      padding: 1.5rem;
    }

    /* ── Photo card ── */
    .curate-card {
      position: relative;
      border-radius: 3px;
      overflow: hidden;
      background: var(--color-surface);
    }
    .curate-card .photo-wrap {
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
    }
    .curate-card img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.3s;
      -webkit-user-drag: none;
      user-select: none;
    }
    .curate-card img.loaded { opacity: 1; }
    .curate-card .photo-wrap {
      -webkit-tap-highlight-color: transparent;
    }

    /* voted overlay tint */
    .curate-card.voted-keep .photo-wrap::after {
      content: '';
      position: absolute; inset: 0;
      background: rgba(34,197,94,0.15);
      pointer-events: none;
    }
    .curate-card.voted-cut .photo-wrap::after {
      content: '';
      position: absolute; inset: 0;
      background: rgba(239,68,68,0.15);
      pointer-events: none;
    }

    /* ── Vote buttons ── */
    .vote-buttons {
      display: flex;
      gap: 4px;
      padding: 6px;
    }
    .vote-btn {
      flex: 1;
      padding: 0.45rem 0;
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid var(--color-border);
      background: var(--color-bg);
      color: var(--color-muted);
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.15s;
    }
    .vote-btn:hover { color: var(--color-text); border-color: var(--color-text); }

    .vote-btn.keep.active {
      background: #22c55e;
      border-color: #22c55e;
      color: white;
    }
    .vote-btn.cut.active {
      background: #ef4444;
      border-color: #ef4444;
      color: white;
    }

    /* ── Submit bar ── */
    #submit-bar {
      position: sticky; bottom: 0; z-index: 50;
      background: var(--color-bg);
      border-top: 1px solid var(--color-border);
      padding: 1rem 1.5rem;
      display: flex; align-items: center; gap: 1rem;
      flex-wrap: wrap;
    }
    #submit-info {
      flex: 1;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      color: var(--color-muted);
    }
    #submit-btn {
      background: var(--color-text);
      color: var(--color-bg);
      border: none;
      padding: 0.65rem 1.75rem;
      font-family: var(--font-sans);
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      transition: opacity 0.2s;
    }
    #submit-btn:hover { opacity: 0.8; }
    #submit-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Thank you screen ── */
    #thanks-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      text-align: center;
      padding: 2rem;
    }
    #thanks-screen.visible { display: flex; }
    #thanks-screen h2 {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }
    #thanks-screen p {
      color: var(--color-muted);
      font-size: 0.85rem;
      letter-spacing: 0.06em;
    }

    /* ── Lightbox (override global style.css fade/position rules) ── */
    #lightbox {
      position: fixed; inset: 0; z-index: 800;
      background: rgba(0,0,0,0.92);
      display: none; align-items: center; justify-content: center;
      cursor: zoom-out;
      opacity: 1 !important;
      transition: none !important;
      pointer-events: none;
    }
    #lightbox.open {
      display: flex;
      pointer-events: auto;
    }
    #lightbox-inner {
      position: relative;
      display: flex; flex-direction: column; align-items: center;
      max-width: 96vw; max-height: 96vh;
      cursor: default;
    }
    #lightbox-stage {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      width: 92vw; height: calc(90vh - 100px);
      pointer-events: none;
    }
    #lightbox-stage .lightbox-layer {
      position: absolute;
      max-width: 92vw; max-height: calc(90vh - 100px);
      object-fit: contain;
      border-radius: 2px;
      cursor: default;
      opacity: 0;
      visibility: hidden;
      z-index: 1;
      transition: none;
      pointer-events: none;
      -webkit-user-drag: none;
      user-select: none;
    }
    #lightbox-stage .lightbox-layer.active {
      opacity: 1;
      visibility: visible;
      z-index: 2;
      pointer-events: auto;
    }
    #lightbox-spinner {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 32px; height: 32px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      pointer-events: none;
      z-index: 3;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #lightbox-close {
      position: absolute; top: 1.25rem; right: 1.5rem;
      z-index: 10;
      color: rgba(255,255,255,0.7); font-size: 1.75rem;
      cursor: pointer; line-height: 1; background: none; border: none;
      transition: color 0.15s;
    }
    #lightbox .lightbox-nav { z-index: 10; }
    #lightbox-close:hover { color: white; }
    #lightbox-counter {
      position: static;
      transform: none;
      color: rgba(255,255,255,0.6);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin: 0.75rem 0 0.5rem;
    }
    #lightbox-vote {
      display: flex; gap: 8px; width: 280px;
    }
    #lightbox-vote .vote-btn {
      flex: 1;
      padding: 0.55rem 0;
      font-size: 0.75rem;
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.7);
    }
    #lightbox-vote .vote-btn:hover {
      color: white; border-color: rgba(255,255,255,0.5);
    }
    #lightbox-vote .vote-btn.keep.active {
      background: #22c55e; border-color: #22c55e; color: white;
    }
    #lightbox-vote .vote-btn.cut.active {
      background: #ef4444; border-color: #ef4444; color: white;
    }
    #lightbox-shortcuts {
      position: absolute; bottom: 1.25rem; left: 1.5rem;
      display: flex; flex-direction: column; gap: 0.35rem;
      font-size: 0.68rem; letter-spacing: 0.04em;
      color: rgba(255,255,255,0.45);
      pointer-events: none; user-select: none;
    }
    #lightbox-shortcuts kbd {
      display: inline-block; min-width: 1.35rem;
      padding: 0.1rem 0.35rem; margin-right: 0.15rem;
      font-family: var(--font-sans); font-size: 0.65rem;
      text-align: center; line-height: 1.4;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 3px; color: rgba(255,255,255,0.65);
    }
    @media (max-width: 640px) {
      #photo-grid {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 6px;
        padding: 1rem;
      }
      #lightbox-shortcuts { display: none; }
    }
    .curate-card .photo-wrap { cursor: zoom-in; }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 6rem; left: 50%; transform: translateX(-50%);
      background: var(--color-text); color: var(--color-bg);
      padding: 0.65rem 1.25rem;
      font-size: 0.78rem; letter-spacing: 0.06em;
      border-radius: 2px; z-index: 500;
      opacity: 0; transition: opacity 0.3s;
      pointer-events: none; white-space: nowrap;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

  <!-- ── Password Screen ── -->
  <div id="pw-screen">
    <p style="font-size:0.72rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--color-muted);margin-bottom:0.75rem">Photo Curation</p>
    <p style="font-family:var(--font-serif);font-size:2rem;font-weight:300;letter-spacing:0.08em;margin-bottom:0.5rem" id="pw-album-name">–</p>
    <p style="font-size:0.78rem;color:var(--color-muted);margin-bottom:2rem;max-width:320px">Help pick the best photos by voting Keep or Cut on each one.</p>
    <form id="pw-form" novalidate style="width:100%;max-width:320px">
      <input id="pw-input" type="password" placeholder="Album password"
        autocomplete="current-password"
        style="width:100%;background:var(--color-surface);border:1px solid var(--color-border);color:var(--color-text);padding:0.75rem 1rem;margin-bottom:0.5rem;font-family:var(--font-sans);font-size:0.9rem;letter-spacing:0.1em;text-align:center;outline:none;transition:border-color 0.2s;border-radius:2px"
        onfocus="this.style.borderColor='var(--color-text)'"
        onblur="this.style.borderColor='var(--color-border)'"
      />
      <p id="pw-error" style="color:#f87171;font-size:0.8rem;min-height:1.2rem;margin-bottom:0.5rem;text-align:center"></p>
      <button type="submit" style="width:100%;background:var(--color-text);color:var(--color-bg);border:none;padding:0.75rem;font-family:var(--font-sans);font-size:0.8rem;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;transition:opacity 0.2s;border-radius:2px">
        Enter
      </button>
    </form>
  </div>

  <!-- ── Main Curate UI ── -->
  <div id="curate-ui" style="display:none">

    <div id="curate-header">
      <a id="curate-back" href="#" style="display:none;font-size:0.68rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-muted);text-decoration:none;margin-bottom:0.75rem">← Back to albums</a>
      <h1 id="album-title">–</h1>
      <p id="album-desc"></p>
    </div>

    <div id="progress-bar-wrap">
      <div id="progress-label">0 of 0 voted</div>
      <div id="progress-track"><div id="progress-fill"></div></div>
    </div>

    <div id="photo-grid"></div>

    <div id="thanks-screen">
      <h2>Thank you!</h2>
      <p>Your votes have been submitted.</p>
    </div>

    <div id="submit-bar">
      <span id="submit-info">Vote on each photo, then submit.</span>
      <button id="submit-btn" disabled onclick="submitVotes()">Submit Votes</button>
    </div>

  </div>

  <!-- ── Lightbox ── -->
  <div id="lightbox" onclick="closeLightbox()">
    <button id="lightbox-close" type="button" onclick="event.stopPropagation(); closeLightbox()">✕</button>

    <button class="lightbox-nav" id="lightbox-prev" type="button" aria-label="Previous photo"
      onclick="event.stopPropagation(); lightboxNav(-1)">‹</button>

    <div id="lightbox-inner" onclick="event.stopPropagation()">
      <div id="lightbox-stage">
        <div id="lightbox-spinner"></div>
        <img id="lightbox-img-a" class="lightbox-layer" alt="" draggable="false" />
        <img id="lightbox-img-b" class="lightbox-layer" alt="" draggable="false" />
      </div>
      <p id="lightbox-counter"></p>
      <div id="lightbox-vote">
        <button type="button" class="vote-btn keep" id="lb-keep">✓ Keep</button>
        <button type="button" class="vote-btn cut" id="lb-cut">✕ Cut</button>
      </div>
    </div>

    <button class="lightbox-nav" id="lightbox-next" type="button" aria-label="Next photo"
      onclick="event.stopPropagation(); lightboxNav(1)">›</button>

    <div id="lightbox-shortcuts" aria-hidden="true">
      <span><kbd>←</kbd><kbd>→</kbd> Navigate</span>
      <span><kbd>K</kbd> Keep &nbsp; <kbd>C</kbd> Cut</span>
      <span><kbd>Esc</kbd> Close</span>
    </div>
  </div>

  <div id="toast"></div>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL  = 'https://dgajyvjxvobmnqxticvh.supabase.co';
    const SUPABASE_KEY  = 'sb_publishable_pwy5JTpQQG9VjrSmbBG4_Q_WWY8_NFa';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ── Parse URL params ────────────────────────────────────────────────────
    const params  = new URLSearchParams(location.search);
    const albumId = params.get('album');
    const urlPw   = params.get('pw'); // optional auto-unlock

    if (!albumId) {
      document.getElementById('pw-screen').innerHTML = '<p style="color:var(--color-muted);font-size:0.9rem">No album specified.</p>';
    }

    const album = (ALBUMS || []).find(a => a.id === albumId);
    if (!album) {
      document.getElementById('pw-screen').innerHTML = '<p style="color:var(--color-muted);font-size:0.9rem">Album not found.</p>';
    }

    document.getElementById('pw-album-name').textContent = album ? album.title : '';

    // ── Session ID (unique per browser, per album) ───────────────────────
    const SESSION_KEY = `curate_session_${albumId}`;
    let sessionId = localStorage.getItem(SESSION_KEY);
    if (!sessionId) {
      sessionId = crypto.randomUUID();
      localStorage.setItem(SESSION_KEY, sessionId);
    }

    // votes map: photoUrl → 'keep' | 'cut'
    const votes = {};
    let photoList = [];
    let lightboxIndex = 0;
    let activeLayer = 0;
    const lightboxLayers = [
      document.getElementById('lightbox-img-a'),
      document.getElementById('lightbox-img-b'),
    ];
    const cardRegistry = new Map(); // url → { card, keepBtn, cutBtn }

    // ── Auth ────────────────────────────────────────────────────────────────
    async function tryUnlock(password) {
      if (!album.protected) return true;
      const hash = await hashPassword(password);
      return hash === album.passwordHash;
    }

    async function init() {
      // Auto-unlock from URL param
      if (urlPw) {
        const ok = await tryUnlock(urlPw);
        if (ok) { showCurate(); return; }
      }
      // No password required
      if (!album.protected) { showCurate(); return; }
      // Show password form
    }

    document.getElementById('pw-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('pw-input').value.trim();
      const ok = await tryUnlock(pw);
      if (ok) {
        showCurate();
      } else {
        const err = document.getElementById('pw-error');
        err.textContent = 'Incorrect password.';
        setTimeout(() => { err.textContent = ''; }, 3000);
      }
    });

    // ── SHA-256 (from main.js — inlined here since we skip main.js) ────────
    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    }

    // ── R2 grid URL helper ───────────────────────────────────────────────────
    function gridUrl(fullUrl) {
      const m = fullUrl.match(/^(https:\/\/pub-[a-f0-9]+\.r2\.dev\/)(.+)$/);
      return m ? `${m[1]}grid/${m[2]}` : fullUrl;
    }

    const ImagePreload = {
      _cache: new Map(),
      load(url) {
        if (!url || this._cache.has(url)) return this._cache.get(url);
        const p = new Promise((resolve, reject) => {
          const img = new Image();
          img.decoding = 'async';
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = url;
        });
        this._cache.set(url, p);
        return p;
      },
      preloadAdjacent(urls, index, radius = 3) {
        for (let o = -radius; o <= radius; o++) {
          const i = index + o;
          if (i >= 0 && i < urls.length) {
            const u = urls[i];
            this.load(u).catch(() => {});
            this.load(gridUrl(u)).catch(() => {});
          }
        }
      },
      async apply(imgEl, src) {
        await this.load(src);
        imgEl.src = src;
        if (!imgEl.complete) {
          await new Promise((resolve, reject) => {
            imgEl.onload = () => resolve();
            imgEl.onerror = reject;
          });
        }
        try { await imgEl.decode(); } catch (_) {}
      },
    };

    // ── Render curation grid ────────────────────────────────────────────────
    function showCurate() {
      document.getElementById('pw-screen').classList.add('hidden');
      document.getElementById('curate-ui').style.display = 'block';

      document.getElementById('album-title').textContent = album.title;
      document.getElementById('album-desc').textContent  = album.description || '';

      if (album.parentId) {
        const parent = (ALBUMS || []).find(a => a.id === album.parentId);
        const back = document.getElementById('curate-back');
        back.style.display = 'inline-block';
        back.href = `curate-group.html?group=${album.parentId}`;
        back.textContent = parent ? `← Back to ${parent.title}` : '← Back to albums';
      }

      photoList = (album.photos || []).filter(u => !u.endsWith('.svg'));
      renderGrid(photoList);
      updateProgress(photoList.length);
    }

    function renderGrid(photos) {
      const grid = document.getElementById('photo-grid');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          const img = entry.target.querySelector('img');
          if (img && img.dataset.src) {
            const full = img.dataset.full;
            img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
            img.addEventListener('error', () => { img.src = full; }, { once: true });
            img.src = img.dataset.src;
            delete img.dataset.src;
          }
          observer.unobserve(entry.target);
        });
      }, { rootMargin: '200px' });

      photos.forEach(url => {
        const card = document.createElement('div');
        card.className = 'curate-card';
        card.dataset.url = url;

        const wrap = document.createElement('div');
        wrap.className = 'photo-wrap';

        const img = document.createElement('img');
        img.alt = '';
        img.draggable = false;
        img.decoding = 'async';
        img.dataset.full = url;
        img.dataset.src = gridUrl(url);

        const btns = document.createElement('div');
        btns.className = 'vote-buttons';

        // Open full-res on photo click (prevent blue selection/drag overlay)
        wrap.addEventListener('mousedown', (e) => e.preventDefault());
        wrap.addEventListener('click', () => openLightbox(url));

        const keepBtn = document.createElement('button');
        keepBtn.className = 'vote-btn keep';
        keepBtn.textContent = '✓ Keep';
        keepBtn.onclick = (e) => { e.stopPropagation(); castVote(url, 'keep'); };

        const cutBtn = document.createElement('button');
        cutBtn.className = 'vote-btn cut';
        cutBtn.textContent = '✕ Cut';
        cutBtn.onclick = (e) => { e.stopPropagation(); castVote(url, 'cut'); };

        wrap.appendChild(img);
        card.appendChild(wrap);
        btns.appendChild(keepBtn);
        btns.appendChild(cutBtn);
        card.appendChild(btns);
        grid.appendChild(card);
        cardRegistry.set(url, { card, keepBtn, cutBtn });
        observer.observe(card);
      });
    }

    function applyVoteUI(url, vote) {
      const entry = cardRegistry.get(url);
      if (!entry) return;
      const { card, keepBtn, cutBtn } = entry;
      card.classList.remove('voted-keep', 'voted-cut');
      keepBtn.classList.remove('active');
      cutBtn.classList.remove('active');
      if (vote === 'keep') {
        card.classList.add('voted-keep');
        keepBtn.classList.add('active');
      } else if (vote === 'cut') {
        card.classList.add('voted-cut');
        cutBtn.classList.add('active');
      }
    }

    function syncLightboxVoteButtons() {
      const url = photoList[lightboxIndex];
      const vote = votes[url];
      document.getElementById('lb-keep').classList.toggle('active', vote === 'keep');
      document.getElementById('lb-cut').classList.toggle('active', vote === 'cut');
    }

    function castVote(url, vote) {
      if (votes[url] === vote) {
        delete votes[url];
        applyVoteUI(url, null);
      } else {
        votes[url] = vote;
        applyVoteUI(url, vote);
      }
      if (document.getElementById('lightbox').classList.contains('open')) {
        syncLightboxVoteButtons();
      }
      updateProgress(photoList.length);
    }

    function updateProgress(total) {
      const voted  = Object.keys(votes).length;
      const pct    = total > 0 ? (voted / total) * 100 : 0;
      document.getElementById('progress-label').textContent = `${voted} of ${total} voted`;
      document.getElementById('progress-fill').style.width = `${pct}%`;
      document.getElementById('submit-info').textContent =
        voted === 0 ? 'Vote on each photo, then submit.' :
        voted < total ? `${total - voted} photo${total - voted !== 1 ? 's' : ''} left to vote on.` :
        'All photos voted — ready to submit!';
      document.getElementById('submit-btn').disabled = voted === 0;
    }

    // ── Submit to Supabase ──────────────────────────────────────────────────
    async function submitVotes() {
      const btn = document.getElementById('submit-btn');
      btn.textContent = 'Submitting…';
      btn.disabled = true;

      const rows = Object.entries(votes).map(([photo_url, vote]) => ({
        album_id:   albumId,
        photo_url,
        vote,
        session_id: sessionId,
      }));

      const { error } = await sb.from('votes').upsert(rows, {
        onConflict: 'session_id,photo_url',
      });

      if (error) {
        console.error(error);
        showToast('Something went wrong. Please try again.');
        btn.textContent = 'Submit Votes';
        btn.disabled = false;
        return;
      }

      // Show thank you
      document.getElementById('photo-grid').style.display = 'none';
      document.getElementById('progress-bar-wrap').style.display = 'none';
      document.getElementById('submit-bar').style.display = 'none';
      document.getElementById('thanks-screen').classList.add('visible');
    }

    async function showLightboxPhoto(fullResUrl, index) {
      const spinner = document.getElementById('lightbox-spinner');
      const grid = gridUrl(fullResUrl);
      const nextLayer = 1 - activeLayer;
      const nextImg = lightboxLayers[nextLayer];
      const currentImg = lightboxLayers[activeLayer];
      let isFull = false;

      spinner.style.display = 'block';

      try {
        try {
          await ImagePreload.load(fullResUrl);
          await ImagePreload.apply(nextImg, fullResUrl);
          isFull = true;
        } catch {
          await ImagePreload.apply(nextImg, grid);
        }

        if (!document.getElementById('lightbox').classList.contains('open') || lightboxIndex !== index) return;

        nextImg.classList.add('active');
        currentImg.classList.remove('active');
        activeLayer = nextLayer;

        if (!isFull) {
          ImagePreload.load(fullResUrl).then(async () => {
            if (!document.getElementById('lightbox').classList.contains('open') || lightboxIndex !== index) return;
            await ImagePreload.apply(lightboxLayers[activeLayer], fullResUrl);
          }).catch(() => {});
        }
      } finally {
        if (lightboxIndex === index) spinner.style.display = 'none';
      }
    }

    function openLightbox(url) {
      lightboxIndex = photoList.indexOf(url);
      if (lightboxIndex < 0) return;
      document.activeElement?.blur();
      window.getSelection()?.removeAllRanges();
      document.getElementById('lightbox').classList.add('open');
      loadLightboxPhoto();
    }

    function loadLightboxPhoto() {
      const url = photoList[lightboxIndex];

      document.getElementById('lightbox-counter').textContent =
        `${lightboxIndex + 1} / ${photoList.length}`;
      document.getElementById('lightbox-prev').style.visibility =
        lightboxIndex === 0 ? 'hidden' : 'visible';
      document.getElementById('lightbox-next').style.visibility =
        lightboxIndex === photoList.length - 1 ? 'hidden' : 'visible';
      syncLightboxVoteButtons();

      showLightboxPhoto(url, lightboxIndex);
      ImagePreload.preloadAdjacent(photoList, lightboxIndex);
    }

    function lightboxNav(dir) {
      const next = lightboxIndex + dir;
      if (next < 0 || next >= photoList.length) return;
      lightboxIndex = next;
      loadLightboxPhoto();
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      lightboxLayers.forEach(layer => {
        layer.classList.remove('active');
        layer.src = '';
      });
      activeLayer = 0;
      document.getElementById('lightbox-spinner').style.display = 'none';
    }

    document.getElementById('lb-keep').addEventListener('click', (e) => {
      e.stopPropagation();
      castVote(photoList[lightboxIndex], 'keep');
    });
    document.getElementById('lb-cut').addEventListener('click', (e) => {
      e.stopPropagation();
      castVote(photoList[lightboxIndex], 'cut');
    });

    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('lightbox').classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') lightboxNav(-1);
      if (e.key === 'ArrowRight') lightboxNav(1);
      if (e.key === 'k' || e.key === 'K') castVote(photoList[lightboxIndex], 'keep');
      if (e.key === 'c' || e.key === 'C') castVote(photoList[lightboxIndex], 'cut');
    });

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    init();
  </script>
</body>
</html>
