  <!-- ── Page Header ── -->
  <header class="page-header page-header--catalog fade-in">
    <h1 class="page-title">Family Gallery</h1>
  </header>

  <!-- ── Album Grid ── -->

  <style>
    .album-card { display: block; text-decoration: none; }
  </style>

  <script src="/js/config.js"></script>
  <script src="/js/albums/clients.js"></script>
  <script src="/js/albums/family-2025.js"></script>
  <script src="/js/albums/family-2026.js"></script>
  <script src="/js/albums/california-2025.js"></script>
  <script src="/js/albums/misc-2026.js"></script>
  <script src="/js/albums/italy-2026.js"></script>
  <script src="/js/albums.js"></script>
  <script src="/js/routes.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.getElementById('footer-copyright').textContent =
      `© ${new Date().getFullYear()} ${SITE_CONFIG.photographerName}`;

    const main = document.getElementById('family-main');

    // ── Auth gate ──
    const canSeeFamily = TierAuth.canAccess('family');
    if (!canSeeFamily) {
      window.location.replace('/unlock/?next=/family/');
    }

    // ── Worker token helpers for private cover images ──
    const workerBase = (typeof WORKER_BASE_URL !== 'undefined') ? WORKER_BASE_URL : '';

    async function getToken(audience) {
      const cacheKey = `worker_token_${audience}`;
      try {
        const cached = JSON.parse(sessionStorage.getItem(cacheKey) || 'null');
        // Invalidate if workerBase changed (e.g. stale localhost token)
        if (cached && cached.workerBase && cached.workerBase !== workerBase) {
          sessionStorage.removeItem(cacheKey);
        } else if (cached && cached.expiresAt > Date.now() + 5 * 60 * 1000) {
          return cached.token;
        }
      } catch {}
      const hash = TierAuth.getHash(audience);
      if (!hash || !workerBase) return null;
      try {
        const resp = await fetch(`${workerBase}/unlock`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ hash }),
        });
        if (!resp.ok) return null;
        const data = await resp.json();
        sessionStorage.setItem(cacheKey, JSON.stringify({ token: data.token, expiresAt: data.expiresAt, workerBase }));
        return data.token;
      } catch { return null; }
    }

    // Wide catalog covers use the ~2048px view/ tier so they stay sharp on
    // high-DPI screens; grid/ (900px) would upscale.
    function toWorkerCoverUrl(coverUrl, token, tier = 'view/') {
      if (!token || !coverUrl || !workerBase) return coverUrl;
      const key = coverUrl.replace(/^https?:\/\/[^/]+\//, '').replace(/^\/+/, '');
      return `${workerBase}/image?key=${encodeURIComponent(tier + key)}&token=${encodeURIComponent(token)}`;
    }

    // ── Album card renderer ──
    // token is pre-fetched so img.src is set correctly from the start (no lazy rewrite).
    function renderAlbumCard(album, token) {
      const isGroup = album.type === 'group';
      const card = document.createElement('a');
      card.href = albumPageUrl(album);
      card.className = 'album-card fade-in';
      const posStyle = album.coverPosition ? ` style="object-position:${album.coverPosition}"` : '';
      const dateline = albumDateline(album, { withDesc: !isGroup });
      const desc = albumCardDesc(album);
      // Use the raw config coverImage (not albumCoverUrl, which applies gridUrl and
      // would add grid/ prefix — toWorkerCoverUrl adds its tier exactly once itself).
      const rawCover = album.coverImage || albumCoverUrl(album);
      const coverSrc = toWorkerCoverUrl(rawCover, token) || albumCoverUrlWide(album);
      card.innerHTML = `
        <img class="album-card-img"
             src="${coverSrc}"
             alt="${album.title}"
             loading="eager"${posStyle} />
        <div class="album-card-overlay">
          ${dateline ? `<p class="album-card-dateline">${dateline}</p>` : ''}
          <h2 class="album-card-title">${album.title}</h2>
          ${desc ? `<p class="album-card-desc${isEmptyAlbum(album) ? ' album-card-desc--tbd' : ''}">${desc}</p>` : ''}
        </div>
      `;
      // Fade in once loaded
      const img = card.querySelector('img');
      img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
      img.addEventListener('error', () => {
        img.src = toWorkerCoverUrl(rawCover, token, 'grid/') || albumCoverUrl(album);
      }, { once: true });
      if (img.complete) img.classList.add('loaded');
      return card;
    }

    // ── Render family albums (year-grouped) ──
    function renderFamilyAlbums(token) {
      const albums = ALBUMS.filter(a => a.audience === 'family' && !a.parentId);
      if (albums.length === 0) return;

      const byYear = new Map();
      albums.forEach(album => {
        const year = albumYear(album) || 'Other';
        if (!byYear.has(year)) byYear.set(year, []);
        byYear.get(year).push(album);
      });

      [...byYear.keys()].sort().reverse().forEach((year, idx) => {
        const yearHead = document.createElement('h2');
        yearHead.className = idx === 0
          ? 'gallery-year-heading gallery-year-heading--first'
          : 'gallery-year-heading';
        yearHead.textContent = year;
        main.appendChild(yearHead);

        const grid = document.createElement('div');
        const count = byYear.get(year).length;
        grid.className = 'album-grid gallery-album-grid fade-in';
        if (count > 0 && count < 3) grid.classList.add(`gallery-album-grid--count-${count}`);
        byYear.get(year).sort((a, b) => compareAlbumsByDate(b, a)).forEach(album => {
          grid.appendChild(renderAlbumCard(album, token));
        });
        main.appendChild(grid);
      });
    }

    // ── Fetch token, then render ──
    (async () => {
      const token = await getToken('family');
      renderFamilyAlbums(token);
      observeFadeInElements(main);
    })();
  </script>
</body>
</html>
