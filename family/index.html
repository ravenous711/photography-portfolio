<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Family Albums — Raveen Fernando</title>
  <meta name="description" content="Private family photo albums." />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/base.css" />
</head>
<body class="overflow-x-hidden">

  <!-- ── Navigation ── -->
  <nav id="main-nav" class="nav-scrolled">
    <a href="/" class="nav-logo">RF<span>.</span></a>
    <ul class="nav-links">
      <li><a href="/"        data-nav-link data-nav="home">Home</a></li>
      <li><a href="/gallery/" data-nav-link data-nav="gallery">Gallery</a></li>
      <li id="nav-family-gallery-item"><a href="/familyalbums/" data-nav-link data-nav="family">Family Albums</a></li>
      <li id="nav-signout-item" style="display:none"><a href="#" onclick="signOut();return false;" data-nav="signout">Sign out</a></li>
    </ul>
    <button id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </nav>

  <div id="mobile-menu" role="dialog" aria-label="Navigation menu">
    <a href="/">Home</a>
    <a href="/gallery/">Gallery</a>
    <a href="/familyalbums/">Family Albums</a>
    <a href="#" id="mobile-signout-link" onclick="signOut();return false;" style="display:none">Sign out</a>
  </div>

  <!-- ── Page Header ── -->
  <header class="page-header page-header--compact fade-in">
    <p class="page-subtitle">Portfolio</p>
    <div class="gold-rule"></div>
    <h1 class="page-title">Family Albums</h1>
  </header>

  <!-- ── Album Grid ── -->
  <main class="gallery-main px-6 md:px-12 pb-24 max-w-7xl mx-auto" id="family-main">
    <!-- Populated by JS -->
  </main>

  <!-- ── Footer ── -->
  <footer>
    <p id="footer-copyright"></p>
    <p class="mt-1">
      <a href="/">Home</a>
    </p>
  </footer>

  <style>
    .album-card { display: block; text-decoration: none; }
    .family-group-heading {
      font-family: var(--font-serif);
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-text-muted, #888);
      margin: 3rem 0 1.25rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .family-group-heading:first-child { margin-top: 0; }
  </style>

  <script src="/js/config.js"></script>
  <script src="/js/routes.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.getElementById('footer-copyright').textContent =
      `© ${new Date().getFullYear()} ${SITE_CONFIG.photographerName}`;

    const main = document.getElementById('family-main');

    // ── Auth gate ──
    // Redirect to unlock if no family tier is active
    const canSeeAngerAli  = TierAuth.canAccess('family:anger-ali');
    const canSeeFernando  = TierAuth.canAccess('family:fernando');
    const canSeeAll       = TierAuth.canAccess('family'); // master key

    if (!canSeeAngerAli && !canSeeFernando && !canSeeAll) {
      window.location.replace('/unlock/?next=/family/');
    }

    // ── Worker token helpers for private cover images ──
    const workerBase = (typeof WORKER_BASE_URL !== 'undefined') ? WORKER_BASE_URL : '';

    async function getToken(audience) {
      const cacheKey = `worker_token_${audience}`;
      try {
        const cached = JSON.parse(sessionStorage.getItem(cacheKey) || 'null');
        // Invalidate if workerBase changed (e.g. stale localhost token)
        if (cached && cached.workerBase && cached.workerBase !== workerBase) {
          sessionStorage.removeItem(cacheKey);
        } else if (cached && cached.expiresAt > Date.now() + 5 * 60 * 1000) {
          return cached.token;
        }
      } catch {}
      const hash = TierAuth.getHash(audience);
      if (!hash || !workerBase) return null;
      try {
        const resp = await fetch(`${workerBase}/unlock`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ hash }),
        });
        if (!resp.ok) return null;
        const data = await resp.json();
        sessionStorage.setItem(cacheKey, JSON.stringify({ token: data.token, expiresAt: data.expiresAt, workerBase }));
        return data.token;
      } catch { return null; }
    }

    function toWorkerCoverUrl(coverUrl, token) {
      if (!token || !coverUrl || !workerBase) return coverUrl;
      const key = coverUrl.replace(/^https?:\/\/[^/]+\//, '').replace(/^\/+/, '');
      return `${workerBase}/image?key=${encodeURIComponent('grid/' + key)}&token=${encodeURIComponent(token)}`;
    }

    // ── Album card renderer ──
    // token is pre-fetched so img.src is set correctly from the start (no lazy rewrite).
    function renderAlbumCard(album, token) {
      const isGroup = album.type === 'group';
      const card = document.createElement('a');
      card.href = albumPageUrl(album);
      card.className = 'album-card fade-in';
      const posStyle = album.coverPosition ? ` style="object-position:${album.coverPosition}"` : '';
      const dateline = albumDateline(album, { withDesc: !isGroup });
      const desc = albumCardDesc(album);
      // Use the raw config coverImage (not albumCoverUrl, which applies gridUrl and
      // would add grid/ prefix — toWorkerCoverUrl adds it exactly once itself).
      const rawCover = album.coverImage || albumCoverUrl(album);
      const coverSrc = toWorkerCoverUrl(rawCover, token) || albumCoverUrl(album);
      card.innerHTML = `
        <img class="album-card-img"
             src="${coverSrc}"
             alt="${album.title}"
             loading="eager"${posStyle} />
        <div class="album-card-overlay">
          ${dateline ? `<p class="album-card-dateline">${dateline}</p>` : ''}
          <h2 class="album-card-title">${album.title}</h2>
          ${desc ? `<p class="album-card-desc${isEmptyAlbum(album) ? ' album-card-desc--tbd' : ''}">${desc}</p>` : ''}
        </div>
      `;
      // Fade in once loaded
      const img = card.querySelector('img');
      img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
      if (img.complete) img.classList.add('loaded');
      return card;
    }

    // ── Render a family group section (year-grouped) ──
    function renderFamilySection(groupLabel, audienceFilter, tokens) {
      const albums = ALBUMS.filter(a => a.audience === audienceFilter && !a.parentId);
      if (albums.length === 0) return;

      const groupHead = document.createElement('h2');
      groupHead.className = 'family-group-heading';
      groupHead.textContent = groupLabel;
      main.appendChild(groupHead);

      const byYear = new Map();
      albums.forEach(album => {
        const year = albumYear(album) || 'Other';
        if (!byYear.has(year)) byYear.set(year, []);
        byYear.get(year).push(album);
      });

      [...byYear.keys()].sort().forEach((year, idx) => {
        const yearHead = document.createElement('h2');
        yearHead.className = idx === 0
          ? 'gallery-year-heading gallery-year-heading--first'
          : 'gallery-year-heading';
        yearHead.textContent = year;
        main.appendChild(yearHead);

        const grid = document.createElement('div');
        const count = byYear.get(year).length;
        grid.className = 'album-grid gallery-album-grid fade-in';
        if (count > 0 && count < 3) grid.classList.add(`gallery-album-grid--count-${count}`);
        byYear.get(year).forEach(album => {
          grid.appendChild(renderAlbumCard(album, tokens[audienceFilter]));
        });
        main.appendChild(grid);
      });
    }

    // ── Fetch tokens for all visible tiers, then render ──
    (async () => {
      const tiers = [];
      if (canSeeAll || canSeeAngerAli) tiers.push('family:anger-ali');
      if (canSeeAll || canSeeFernando)  tiers.push('family:fernando');
      if (canSeeAll) { tiers.push('family:anger-ali'); tiers.push('family:fernando'); }

      const uniqueTiers = [...new Set(tiers)];
      const tokens = Object.fromEntries(
        await Promise.all(uniqueTiers.map(async t => [t, await getToken(t)]))
      );

      if (canSeeAll || canSeeAngerAli) {
        renderFamilySection('Anger-Ali Family', 'family:anger-ali', tokens);
      }
      if (canSeeAll || canSeeFernando) {
        renderFamilySection('Fernando Family', 'family:fernando', tokens);
      }
    })();
  </script>
</body>
</html>
