<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Family Gallery — Raveen Fernando</title>
  <meta name="description" content="Private family photo albums." />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/base.css" />
</head>
<body class="overflow-x-hidden">

  <!-- ── Navigation ── -->
  <nav id="main-nav" class="nav-scrolled">
    <a href="/" class="nav-logo">RF<span>.</span></a>
    <ul class="nav-links">
      <li><a href="/"        data-nav-link data-nav="home">Home</a></li>
      <li><a href="/gallery/" data-nav-link data-nav="gallery">Gallery</a></li>
      <li><a href="/about/"   data-nav-link data-nav="about">About</a></li>
      <li id="nav-all-albums-item" style="display:none"><a href="/fullalbums/" id="nav-all-albums-link" data-nav-link data-nav="fullalbums">All albums</a></li>
      <li id="nav-family-gallery-item"><a href="/family/" data-nav-link data-nav="family">Family Gallery</a></li>
    </ul>
    <button id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </nav>

  <div id="mobile-menu" role="dialog" aria-label="Navigation menu">
    <a href="/">Home</a>
    <a href="/gallery/">Gallery</a>
    <a href="/about/">About</a>
    <a href="/fullalbums/" id="mobile-all-albums-link" style="display:none">All albums</a>
    <a href="/family/">Family Gallery</a>
  </div>

  <!-- ── Page Header ── -->
  <header class="page-header page-header--compact fade-in">
    <p class="page-subtitle">Portfolio</p>
    <div class="gold-rule"></div>
    <h1 class="page-title">Family Gallery</h1>
  </header>

  <!-- ── Album Grid ── -->
  <main class="gallery-main px-6 md:px-12 pb-24 max-w-7xl mx-auto" id="family-main">
    <!-- Populated by JS -->
  </main>

  <!-- ── Footer ── -->
  <footer>
    <p id="footer-copyright"></p>
    <p class="mt-1">
      <a href="/">Home</a>
    </p>
  </footer>

  <style>
    .album-card { display: block; text-decoration: none; }
    .family-group-heading {
      font-family: var(--font-serif);
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-text-muted, #888);
      margin: 3rem 0 1.25rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .family-group-heading:first-child { margin-top: 0; }
  </style>

  <script src="/js/config.js"></script>
  <script src="/js/routes.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.getElementById('footer-copyright').textContent =
      `© ${new Date().getFullYear()} ${SITE_CONFIG.photographerName}`;

    const main = document.getElementById('family-main');

    // ── Auth gate ──
    // Redirect to unlock if no family tier is active
    const canSeeAngerAli  = TierAuth.canAccess('family:anger-ali');
    const canSeeFernando  = TierAuth.canAccess('family:fernando');
    const canSeeAll       = TierAuth.canAccess('family'); // master key

    if (!canSeeAngerAli && !canSeeFernando && !canSeeAll) {
      window.location.replace('/unlock/?next=/family/');
    }

    // Show "All albums" in nav for friends-tier viewers
    const canSeeFriends = TierAuth.canAccess('friends');
    if (canSeeFriends) {
      const shareKey = Routes.getShareKey();
      const hubUrl = Routes.fullAlbumUrl(null, shareKey);
      const allItem   = document.getElementById('nav-all-albums-item');
      const allLink   = document.getElementById('nav-all-albums-link');
      const mobileAll = document.getElementById('mobile-all-albums-link');
      if (allItem)   allItem.style.display = '';
      if (allLink)   allLink.href = hubUrl;
      if (mobileAll) { mobileAll.style.display = ''; mobileAll.href = hubUrl; }
    }

    // ── Album card renderer (mirrors gallery/index.html) ──
    function renderAlbumCard(album) {
      const isGroup = album.type === 'group';
      const card = document.createElement('a');
      card.href = albumPageUrl(album);
      card.className = 'album-card fade-in';
      const posStyle = album.coverPosition ? ` style="object-position:${album.coverPosition}"` : '';
      const dateline = albumDateline(album, { withDesc: !isGroup });
      const desc = albumCardDesc(album);
      card.innerHTML = `
        <img class="album-card-img"
             src="${albumCoverUrl(album)}"
             alt="${album.title}"
             loading="lazy"${posStyle} />
        <div class="album-card-overlay">
          ${isGroup ? `
            <div class="album-card-lock" style="background:rgba(201,169,110,0.15);border-color:rgba(201,169,110,0.3)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c9a96e" stroke-width="1.5">
                <rect x="2" y="6" width="8" height="6" rx="1"/><rect x="14" y="6" width="8" height="6" rx="1"/>
                <rect x="2" y="15" width="8" height="6" rx="1"/><rect x="14" y="15" width="8" height="6" rx="1"/>
              </svg>
            </div>` : ''}
          ${dateline ? `<p class="album-card-dateline">${dateline}</p>` : ''}
          <h2 class="album-card-title">${album.title}</h2>
          ${desc ? `<p class="album-card-desc${isEmptyAlbum(album) ? ' album-card-desc--tbd' : ''}">${desc}</p>` : ''}
        </div>
      `;
      return card;
    }

    // ── Render a family group section (year-grouped) ──
    function renderFamilySection(groupLabel, audienceFilter) {
      const albums = ALBUMS.filter(a => a.audience === audienceFilter && !a.parentId);
      if (albums.length === 0) return;

      // Group heading
      const groupHead = document.createElement('h2');
      groupHead.className = 'family-group-heading';
      groupHead.textContent = groupLabel;
      main.appendChild(groupHead);

      // Bucket by year
      const byYear = new Map();
      albums.forEach(album => {
        const year = albumYear(album) || 'Other';
        if (!byYear.has(year)) byYear.set(year, []);
        byYear.get(year).push(album);
      });

      [...byYear.keys()].sort().forEach((year, idx) => {
        const yearHead = document.createElement('h2');
        yearHead.className = idx === 0
          ? 'gallery-year-heading gallery-year-heading--first'
          : 'gallery-year-heading';
        yearHead.textContent = year;
        main.appendChild(yearHead);

        const grid = document.createElement('div');
        const count = byYear.get(year).length;
        grid.className = 'album-grid gallery-album-grid fade-in';
        if (count > 0 && count < 3) grid.classList.add(`gallery-album-grid--count-${count}`);
        byYear.get(year).forEach(album => grid.appendChild(renderAlbumCard(album)));
        main.appendChild(grid);
      });
    }

    // ── Render whichever sections this viewer can access ──
    if (canSeeAll || canSeeAngerAli) {
      renderFamilySection('Anger-Ali Family', 'family:anger-ali');
    }
    if (canSeeAll || canSeeFernando) {
      renderFamilySection('Fernando Family', 'family:fernando');
    }
  </script>
</body>
</html>
