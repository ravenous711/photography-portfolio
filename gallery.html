<!DOCTYPE html>
<html lang="en">
<head>
  <script>if(sessionStorage.getItem("site_unlocked")!=="true"){window.location.replace("login.html?return="+encodeURIComponent(window.location.href));}</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Gallery — Raveen Fernando</title>
  <meta name="description" content="Browse photo albums — landscapes, street, travel, and private family collections." />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <script>tailwind.config = { theme: { extend: { colors: { gold: '#c9a96e' } } } }</script>
</head>
<body class="overflow-x-hidden">

  <!-- ── Navigation ── -->
  <nav id="main-nav" class="nav-scrolled">
    <a href="index.html" class="nav-logo">RF<span>.</span></a>
    <ul class="nav-links">
      <li><a href="index.html"   data-nav-link>Home</a></li>
      <li><a href="gallery.html" data-nav-link>Gallery</a></li>
    </ul>
    <button id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </nav>

  <div id="mobile-menu" role="dialog" aria-label="Navigation menu">
    <a href="index.html">Home</a>
    <a href="gallery.html">Gallery</a>
  </div>

  <!-- ── Page Header ── -->
  <header class="page-header fade-in">
    <p class="page-subtitle">Portfolio</p>
    <div class="gold-rule"></div>
    <h1 class="page-title">Gallery</h1>
    <p class="mt-4 text-sm" style="color:var(--color-muted);max-width:420px;margin-left:auto;margin-right:auto">
      Select an album to explore. Some albums are private and require a password.
    </p>
  </header>

  <!-- ── Filter tabs ── -->
  <div class="flex justify-center gap-2 px-6 pb-10 fade-in">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="public">Public</button>
    <button class="filter-btn" data-filter="private">Private</button>
  </div>

  <!-- ── Album Grid ── -->
  <main class="px-6 md:px-12 pb-24 max-w-7xl mx-auto">
    <div class="album-grid fade-in fade-in-delay-1" id="album-grid">
      <!-- Populated by JS -->
    </div>
  </main>

  <!-- ── Footer ── -->
  <footer>
    <p id="footer-copyright"></p>
    <p class="mt-1">
      <a href="index.html">Home</a>
    </p>
  </footer>

  <style>
    /* Filter tabs */
    .filter-btn {
      padding: 0.45rem 1.25rem;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: transparent;
      border: 1px solid var(--color-border);
      color: var(--color-muted);
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .filter-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--color-text); }
    .filter-btn.active { border-color: var(--color-gold); color: var(--color-gold); }

    .album-card { display: block; text-decoration: none; }
    .album-card.hidden-card { display: none; }
  </style>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script>SiteAuth.guard();</script>
  <script>
    // Footer
    document.getElementById('footer-copyright').textContent =
      `© ${new Date().getFullYear()} ${SITE_CONFIG.photographerName}`;

    // ── Render album grid ──
    const grid = document.getElementById('album-grid');

    // Only show top-level, non-hidden albums
    const topLevel = ALBUMS.filter(a => !a.parentId && !a.hidden);

    topLevel.forEach(album => {
      const isGroup = album.type === 'group';
      const href = isGroup ? `album-group.html?id=${album.id}` : `album.html?id=${album.id}`;

      const card = document.createElement('a');
      card.href = href;
      card.className = 'album-card fade-in';
      card.dataset.type = album.protected ? 'private' : 'public';
      const posStyle = album.coverPosition ? ` style="object-position:${album.coverPosition}"` : '';
      const dateline = albumDateline(album);
      card.innerHTML = `
        <img class="album-card-img"
             src="${album.coverImage}"
             alt="${album.title}"
             loading="lazy"${posStyle} />
        <div class="album-card-overlay">
          ${album.protected ? `
            <div class="album-card-lock">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </div>` : ''}
          ${isGroup ? `
            <div class="album-card-lock" style="background:rgba(201,169,110,0.15);border-color:rgba(201,169,110,0.3)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c9a96e" stroke-width="1.5">
                <rect x="2" y="6" width="8" height="6" rx="1"/><rect x="14" y="6" width="8" height="6" rx="1"/>
                <rect x="2" y="15" width="8" height="6" rx="1"/><rect x="14" y="15" width="8" height="6" rx="1"/>
              </svg>
            </div>` : ''}
          ${dateline ? `<p class="album-card-dateline">${dateline}</p>` : ''}
          <h2 class="album-card-title">${album.title}</h2>
          <p class="album-card-desc">${album.description}</p>
        </div>
      `;
      grid.appendChild(card);
    });

    // ── Filter buttons ──
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;
        document.querySelectorAll('.album-card').forEach(card => {
          const show = filter === 'all' || card.dataset.type === filter;
          card.classList.toggle('hidden-card', !show);
        });
      });
    });
  </script>
</body>
</html>
