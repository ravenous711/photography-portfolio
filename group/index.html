<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Album — Raveen Fernando</title>

  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/base.css" />
</head>
<body class="overflow-x-hidden gallery-catalog group-catalog">

  <!-- ── Navigation ── -->
  <nav id="main-nav" class="nav-scrolled">
    <a href="/" class="nav-logo" aria-label="Raveen Fernando">RF<span class="nav-logo-dot">.</span></a>
    <ul class="nav-links">
      <li><a href="/personal-work/" data-nav-link data-nav="gallery">Personal</a></li>
      <li><a href="/professional-work/" data-nav-link data-nav="professional">People</a></li>
      <li id="nav-about-item"><a href="/about/" data-nav-link data-nav="about">About</a></li>
      <li id="nav-unlock-item" class="nav-dropdown">
        <button type="button" id="nav-unlock-trigger" class="nav-dropdown-trigger" data-nav-link data-nav="unlock" aria-expanded="false" aria-haspopup="true" aria-controls="nav-private-menu">Private Access</button>
        <div id="nav-private-menu" class="nav-dropdown-menu" role="menu" hidden></div>
      </li>
    </ul>
    <button id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </nav>

  <div id="mobile-menu" role="dialog" aria-label="Navigation menu">
    <div class="mobile-menu-sheet">
    <a href="/personal-work/">Personal</a>
    <a href="/professional-work/" id="mobile-professional-work-link">People</a>
    <a href="/about/" id="mobile-about-link">About</a>
    <div id="mobile-private-access" class="mobile-private-access">
      <button type="button" id="mobile-private-trigger" aria-expanded="false" aria-controls="mobile-private-menu">Private Access</button>
      <div id="mobile-private-menu" class="mobile-private-menu" hidden></div>
    </div>
    </div>
  </div>

  <!-- ── Page Header ── -->
  <header class="page-header page-header--catalog group-catalog-header fade-in">
    <a href="/personal-work/" class="back-link" id="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M19 12H5M5 12l7 7M5 12l7-7"/>
      </svg>
      <span id="back-link-label">Personal</span>
    </a>
    <p class="group-page-dateline" id="group-dateline"></p>
    <h1 class="page-title" id="group-title">–</h1>
    <nav id="group-sibling-nav" class="album-sibling-nav" aria-label="Albums in this trip" hidden></nav>
  </header>

  <!-- ── Password Modal (shown for protected groups) ── -->
  <div id="password-modal" style="display:none;position:fixed;inset:0;z-index:500;background:rgba(10,10,10,0.97);align-items:center;justify-content:center;flex-direction:column;padding:2rem;text-align:center">
    <svg style="width:2.5rem;height:2.5rem;margin-bottom:1.5rem;opacity:0.4" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    <h2 class="font-serif text-3xl font-light mb-2" id="modal-group-title">Private Album</h2>
    <p class="text-sm mb-8" style="color:rgba(240,237,232,0.45)">Enter the password to view this collection.</p>
    <form id="password-form" novalidate style="width:100%;max-width:320px">
      <input id="password-input" type="password" placeholder="Password"
        autocomplete="current-password"
        style="width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);color:white;padding:0.75rem 1rem;margin-bottom:0.5rem;font-family:inherit;font-size:0.9rem;letter-spacing:0.1em;text-align:center;outline:none;transition:border-color 0.2s"
        onfocus="this.style.borderColor='rgba(255,255,255,0.3)'"
        onblur="this.style.borderColor='rgba(255,255,255,0.12)'" />
      <p id="password-error" style="color:#f87171;font-size:0.8rem;min-height:1.2rem;margin-bottom:0.5rem"></p>
      <button type="submit" style="width:100%;background:white;color:black;border:none;padding:0.75rem;font-family:inherit;font-size:0.8rem;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;transition:opacity 0.2s" onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">
        Unlock
      </button>
    </form>
    <a href="/personal-work/" style="margin-top:2rem;font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:rgba(240,237,232,0.3);text-decoration:none;transition:color 0.2s" onmouseover="this.style.color='rgba(240,237,232,0.6)'" onmouseout="this.style.color='rgba(240,237,232,0.3)'">Back to Personal</a>
  </div>

  <main class="group-catalog-main">
    <div class="film-library-toolbar" id="film-library-toolbar" hidden>
      <h2 class="group-chapters-heading group-highlights-heading" id="group-highlights-heading" hidden>Highlights</h2>
      <a class="favorites-more film-view-switch" id="film-view-switch" href="#" hidden></a>
      <label class="film-frame-toggle" id="film-frame-toggle" hidden>
        <span class="film-frame-toggle-label" aria-hidden="true">Square</span>
        <input type="checkbox" id="film-frame-input" role="switch" aria-label="Original aspect ratio">
        <span class="film-frame-switch" aria-hidden="true"></span>
        <span class="film-frame-toggle-label" aria-hidden="true">Original</span>
      </label>
    </div>

    <!-- Highlights mode: trailer above the city albums -->
    <section class="group-highlights fade-in" id="group-highlights" hidden>
      <div id="group-highlights-grid" aria-label="Favorite photographs"></div>
    </section>

    <section class="film-library fade-in" id="film-library" hidden aria-label="Life on Film, newest first">
      <p class="film-library-month" id="film-library-month" aria-live="polite"></p>
      <div class="film-library-grid" id="film-library-grid"></div>
    </section>

    <!-- Chapters index: album cards (header copy removed — title above is enough) -->
    <div class="fade-in fade-in-delay-1" id="chapters" hidden>
      <!-- Populated by JS -->
    </div>
    <section class="group-film-rolls fade-in fade-in-delay-2" id="film-roll-section" hidden>
      <h2 class="group-film-rolls-title">Film rolls</h2>
      <p class="group-film-rolls-desc" id="film-roll-desc" hidden></p>
      <nav class="group-film-rolls-list" id="film-roll-links" aria-label="Film rolls"></nav>
    </section>
  </main>

  <!-- ── Footer ── -->
  <footer>
    <p id="footer-copyright"></p>
  </footer>

  <style>
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--color-text); }
    .album-card { display: block; text-decoration: none; }
    .group-highlights {
      margin: 0 0 clamp(1.75rem, 4vw, 2.75rem);
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60%  { transform: translateX(-8px); }
      40%, 80%  { transform: translateX(8px); }
    }
  </style>

  <script src="/js/config.js"></script>
  <script src="/js/albums/clients.js"></script>
  <script src="/js/albums/family-2025.js"></script>
  <script src="/js/albums/family-2026.js"></script>
  <script src="/js/albums/california-2025.js"></script>
  <script src="/js/albums/misc-2026.js"></script>
  <script src="/js/albums/italy-2026.js"></script>
  <script src="/js/albums/morgan-alden-2026.js"></script>
  <script src="/js/albums.js"></script>
  <script src="/js/portfolio-preview.js"></script>
  <script src="/js/routes.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/justified-layout.js"></script>
  <script src="/js/photo-viewer.js"></script>
  <script>
    document.getElementById('footer-copyright').textContent =
      `© ${new Date().getFullYear()} ${SITE_CONFIG.photographerName}`;

    (function initGroupPage() {
      if (Routes.redirectOldGroupPaths()) return;

      const pathInfo = Routes.parseGalleryGroupPath();
      if (!pathInfo) {
        // Legacy ?id= on /gallery/ or bare group path helpers
        Routes.canonicalize('gallery', ['id']);
      }

      const groupId = pathInfo?.groupId || Routes.parseGalleryGroupId(['id']);
      const isChaptersIndex = !!pathInfo?.isChaptersIndex;
      const group = ALBUMS.find(a => a.id === groupId && a.type === 'group');

      if (!group) {
        window.location.replace(Routes.gallery);
        return;
      }

      // Chapters path must match this group's configured path (or default albums)
      if (isChaptersIndex) {
        const expected = group.chaptersPath || 'albums';
        if (pathInfo.chaptersSlug !== expected) {
          // Legacy Italy /cities/ → /albums/
          window.location.replace(Routes.groupChapters(group));
          return;
        }
      }

      document.title = `${group.title} — ${SITE_CONFIG.photographerName}`;
      document.getElementById('modal-group-title').textContent = group.title;

      const groupAudience = group.audience || 'public';
      if (groupAudience !== 'public' && groupAudience !== 'friends') {
        if (!TierAuth.canAccess(groupAudience)) {
          window.location.replace(`/unlock/?next=${encodeURIComponent(window.location.pathname)}`);
          return;
        }
      }

      if (group.protected && !AlbumAuth.isUnlocked(group.id)) {
        showPasswordModal();
      } else {
        showGroup();
      }

      function showPasswordModal() {
      const modal = document.getElementById('password-modal');
      modal.style.display = 'flex';

      const form  = document.getElementById('password-form');
      const input = document.getElementById('password-input');
      const error = document.getElementById('password-error');
      input.focus();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        error.textContent = '';
        const btn = form.querySelector('button[type="submit"]');
        btn.textContent = 'Checking…';
        btn.disabled = true;

        const hash = await hashPassword(input.value.trim());
        if (hash === group.passwordHash) {
          AlbumAuth.unlock(group.id);
          modal.style.display = 'none';
          showGroup();
        } else {
          error.textContent = 'Incorrect password.';
          input.value = '';
          input.focus();
          btn.textContent = 'Unlock';
          btn.disabled = false;
          input.style.animation = 'shake 0.4s ease';
          input.addEventListener('animationend', () => { input.style.animation = ''; }, { once: true });
        }
      });
    }

    function resolveSubAlbums(ids) {
      return (ids || [])
        .map(id => ALBUMS.find(a => a.id === id))
        .filter(a => a && (!a.hidden || group.includeHiddenSubAlbums));
    }

    function groupDateline() {
      if (group.dateline === false) return '';
      if (group.dateline) return group.dateline;
      return group.date || '';
    }

    function filmLibraryPhotos() {
      const sectionIds = (group.subAlbumSections || []).flatMap(sec => sec.albums || []);
      const fromTrips = new Set(
        (group.subAlbumSections || []).find(sec => sec.title === 'From trips')?.albums || []
      );
      const rolls = resolveSubAlbums(sectionIds.length ? sectionIds : group.subAlbums)
        .map((album, order) => ({ album, order, trip: fromTrips.has(album.id) ? 0 : 1 }))
        .sort((a, b) =>
          albumSortKey(b.album) - albumSortKey(a.album)
          || a.trip - b.trip
          || a.order - b.order
        )
        .map(({ album }) => album);
      return rolls.flatMap(album =>
        (album.photos || []).filter(Boolean).map(url => ({ url, month: albumDateline(album) || '' }))
      );
    }

    function showFilmLibrary() {
      document.getElementById('group-dateline').hidden = true;
      document.getElementById('group-title').textContent = group.title;
      const backLink = document.getElementById('back-link');
      backLink.href = Routes.personalWork;
      document.getElementById('back-link-label').textContent = 'Personal';

      const switchLink = document.getElementById('film-view-switch');
      const frameToggle = document.getElementById('film-frame-toggle');
      document.getElementById('film-library-toolbar').hidden = false;
      switchLink.hidden = false;

      if (isChaptersIndex) {
        switchLink.href = Routes.group(group.id);
        switchLink.textContent = 'See all';
        frameToggle.hidden = true;
        return false;
      }

      switchLink.href = Routes.groupChapters(group);
      switchLink.textContent = 'Organize by film rolls';
      frameToggle.hidden = false;

      const frames = filmLibraryPhotos();
      const photos = frames.map(frame => frame.url);
      const section = document.getElementById('film-library');
      const grid = document.getElementById('film-library-grid');
      const tag = document.getElementById('film-library-month');
      section.hidden = false;

      const openAt = (index) => PhotoViewer.open({
        photos,
        index,
        alt: group.title,
        preferParentId: group.id,
        linkOutsideParentOnly: true,
        syncUrl: true,
      });

      frames.forEach((frame, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'film-library-frame';
        button.dataset.month = frame.month;
        button.setAttribute('aria-label', `Open photograph ${index + 1}, ${frame.month}`);
        const img = document.createElement('img');
        img.alt = '';
        img.decoding = 'async';
        img.loading = index < 15 ? 'eager' : 'lazy';
        img.src = gridUrl(frame.url);
        button.appendChild(img);
        button.addEventListener('click', () => openAt(index));
        grid.appendChild(button);
      });

      const frameInput = document.getElementById('film-frame-input');
      const layoutFilmFrames = () => {
        const full = frameInput.checked;
        grid.classList.toggle('is-full-frame', full);
        if (!full) {
          grid.style.height = '';
          [...grid.children].forEach(button => {
            button.style.left = '';
            button.style.top = '';
            button.style.width = '';
            button.style.height = '';
          });
          return;
        }
        const width = grid.clientWidth;
        if (!width || typeof justifiedLayout !== 'function') return;
        const ratios = [...grid.children].map(button => {
          const img = button.querySelector('img');
          if (img.naturalWidth && img.naturalHeight) return img.naturalWidth / img.naturalHeight;
          return 3 / 2;
        });
        const layout = justifiedLayout(ratios, {
          containerWidth: width,
          targetRowHeight: window.innerWidth <= 640 ? 160 : 280,
          boxSpacing: 4,
          containerPadding: 0,
        });
        grid.style.height = `${layout.containerHeight}px`;
        [...grid.children].forEach((button, i) => {
          const box = layout.boxes[i];
          button.style.left = `${box.left}px`;
          button.style.top = `${box.top}px`;
          button.style.width = `${box.width}px`;
          button.style.height = `${box.height}px`;
        });
      };
      try {
        frameInput.checked = localStorage.getItem('film-library-full-frame') === '1';
      } catch { /* private mode */ }
      frameInput.addEventListener('change', () => {
        try {
          localStorage.setItem('film-library-full-frame', frameInput.checked ? '1' : '0');
        } catch { /* private mode */ }
        layoutFilmFrames();
        syncMonth();
      });
      grid.querySelectorAll('img').forEach(img => {
        if (img.complete) return;
        img.addEventListener('load', () => {
          if (frameInput.checked) {
            layoutFilmFrames();
            syncMonth();
          }
        }, { once: true });
      });
      if (typeof ResizeObserver === 'function') {
        new ResizeObserver(() => {
          if (frameInput.checked) layoutFilmFrames();
        }).observe(grid);
      }
      layoutFilmFrames();

      const monthStarts = [...grid.children].filter((el, i, all) =>
        i === 0 || el.dataset.month !== all[i - 1].dataset.month
      );
      let ticking = false;
      const syncMonth = () => {
        ticking = false;
        const line = tag.getBoundingClientRect().top + 8;
        let current = monthStarts[0];
        for (const start of monthStarts) {
          if (start.getBoundingClientRect().top <= line) current = start;
        }
        const label = current?.dataset.month || '';
        if (tag.textContent !== label) tag.textContent = label;
      };
      window.addEventListener('scroll', () => {
        if (!ticking) {
          ticking = true;
          requestAnimationFrame(syncMonth);
        }
      }, { passive: true });
      window.addEventListener('resize', syncMonth);
      syncMonth();

      const linked = new URLSearchParams(window.location.search).get('photo');
      if (linked) {
        const target = decodeURIComponent(linked).toLowerCase();
        const index = photos.findIndex(url => Routes.photoFilename(url).toLowerCase() === target);
        if (index >= 0) openAt(index);
      }
      return true;
    }

    function renderGroupSiblingNav() {
      const nav = document.getElementById('group-sibling-nav');
      if (!nav) return;
      const cities = (group.subAlbums || [])
        .map(id => ALBUMS.find(a => a.id === id))
        .filter(a => a && !a.hidden && a.type !== 'group'
          && a.albumKind !== 'film-roll' && getAlbumPhotoCount(a) > 0);
      if (cities.length < 2) {
        nav.hidden = true;
        nav.innerHTML = '';
        return;
      }
      nav.hidden = false;
      nav.innerHTML = `
        <span class="album-sibling-nav-links">
          <span class="album-sibling-link is-active" aria-current="page">${group.title}</span>
          ${cities.map(city =>
            `<a class="album-sibling-link" href="${albumPageUrl(city)}">${city.title}</a>`
          ).join('')}
        </span>`;
    }

    function showGroup() {
      if (group.id === 'misc-film-rolls-2026' && showFilmLibrary()) return;

      const highlights = Array.isArray(group.highlights) ? group.highlights.filter(Boolean) : [];
      const hasHighlights = highlights.length > 0;
      // With highlights: trip page = trailer only; chapters live on second page.
      // Without highlights: keep the classic all-in-one group index.
      const chaptersMode = isChaptersIndex || !hasHighlights;

      const datelineEl = document.getElementById('group-dateline');
      // Trailer page: title + description + CTA. Date/count live on the albums index.
      if (!chaptersMode && hasHighlights) {
        datelineEl.hidden = true;
        datelineEl.textContent = '';
      } else {
        datelineEl.hidden = false;
        datelineEl.textContent = groupDateline();
      }
      document.getElementById('group-title').textContent = group.title;
      renderGroupSiblingNav();

      const backLink = document.getElementById('back-link');
      if (chaptersMode && hasHighlights && group.id !== 'misc-film-rolls-2026') {
        backLink.href = Routes.group(group.id);
        document.getElementById('back-link-label').textContent = group.title;
      } else if (group.parentId) {
        const parent = ALBUMS.find(a => a.id === group.parentId);
        backLink.href = Routes.group(group.parentId);
        document.getElementById('back-link-label').textContent = parent ? parent.title : 'Back';
      } else if (groupAudience === 'family' || groupAudience.startsWith('family:')) {
        backLink.href = '/family/';
        document.getElementById('back-link-label').textContent = 'Family Gallery';
      } else {
        backLink.href = Routes.personalWork;
        document.getElementById('back-link-label').textContent = 'Personal';
      }

      const highlightsSection = document.getElementById('group-highlights');
      const highlightsGrid = document.getElementById('group-highlights-grid');
      const sectionsRoot = document.getElementById('chapters');

      // The trailer strip rides above the album covers on the group page itself;
      // the /albums/ route stays as a plain index for anyone landing there directly.
      const showStrip = !isChaptersIndex && hasHighlights;
      highlightsSection.hidden = !showStrip;
      sectionsRoot.hidden = false;

      if (showStrip) {
        const openHighlight = (index) => PhotoViewer.open({
          photos: highlights,
          index,
          alt: group.title,
          preferParentId: group.id,
          syncUrl: true,
        });

        renderFavoritesGrid(highlightsGrid, highlights, {
          alt: group.title,
          eagerCount: 2,
          onActivate: openHighlight,
        });

        const toolbar = document.getElementById('film-library-toolbar');
        const frameToggle = document.getElementById('film-frame-toggle');
        const switchLink = document.getElementById('film-view-switch');
        const frameInput = document.getElementById('film-frame-input');
        toolbar.hidden = false;
        switchLink.hidden = true;
        frameToggle.hidden = false;
        document.getElementById('group-highlights-heading').hidden = false;

        const layoutHighlights = () => {
          const full = frameInput.checked;
          highlightsGrid.classList.toggle('is-full-frame', full);
          highlightsGrid.classList.toggle('is-square', !full);
          if (!full) {
            highlightsGrid.style.height = '';
            [...highlightsGrid.children].forEach(button => {
              button.style.left = '';
              button.style.top = '';
              button.style.width = '';
              button.style.height = '';
            });
            return;
          }
          const width = highlightsGrid.clientWidth;
          if (!width || typeof justifiedLayout !== 'function') return;
          const ratios = [...highlightsGrid.children].map(button => {
            const img = button.querySelector('img');
            if (img.naturalWidth && img.naturalHeight) return img.naturalWidth / img.naturalHeight;
            return 1.5;
          });
          const layout = justifiedLayout(ratios, {
            containerWidth: width,
            targetRowHeight: window.innerWidth <= 640 ? 140 : 200,
            boxSpacing: 4,
            containerPadding: 0,
          });
          highlightsGrid.style.height = `${layout.containerHeight}px`;
          [...highlightsGrid.children].forEach((button, i) => {
            const box = layout.boxes[i];
            button.style.left = `${box.left}px`;
            button.style.top = `${box.top}px`;
            button.style.width = `${box.width}px`;
            button.style.height = `${box.height}px`;
          });
        };

        try {
          frameInput.checked = localStorage.getItem('trip-highlights-full-frame') === '1';
        } catch { /* private mode */ }
        frameInput.addEventListener('change', () => {
          try {
            localStorage.setItem('trip-highlights-full-frame', frameInput.checked ? '1' : '0');
          } catch { /* private mode */ }
          layoutHighlights();
        });
        highlightsGrid.querySelectorAll('img').forEach(img => {
          if (img.complete && img.naturalWidth) return;
          img.addEventListener('load', () => {
            if (frameInput.checked) layoutHighlights();
          });
        });
        if (typeof ResizeObserver === 'function') {
          new ResizeObserver(() => {
            if (frameInput.checked) layoutHighlights();
          }).observe(highlightsGrid);
        }
        layoutHighlights();

        const linked = new URLSearchParams(window.location.search).get('photo');
        if (linked) {
          const target = decodeURIComponent(linked).toLowerCase();
          const index = highlights.findIndex(
            url => Routes.photoFilename(url).toLowerCase() === target
          );
          if (index >= 0) openHighlight(index);
        }
      }

      const filmFavoritesOnly = showStrip && group.id === 'misc-film-rolls-2026';

      function appendAlbumCard(grid, album) {
        const card = document.createElement('a');
        card.href = albumPageUrl(album);
        card.className = 'album-card fade-in visible';
        const posStyle = album.coverPosition ? ` style="object-position:${album.coverPosition}"` : '';
        const dateline = albumDateline(album);
        card.innerHTML = `
          <img class="album-card-img"
               src="${albumCoverUrlWide(album)}"
               alt="${album.title}"
               loading="lazy"${posStyle} />
          <div class="album-card-overlay">
            ${dateline ? `<p class="album-card-dateline">${dateline}</p>` : ''}
            <h2 class="album-card-title">${album.title}</h2>
          </div>
        `;
        const cardImg = card.querySelector('img');
        cardImg.addEventListener('error', () => { cardImg.src = albumCoverUrl(album); }, { once: true });
        grid.appendChild(card);
      }

      function renderSection(title, albums, { first = false } = {}) {
        if (!albums.length) return;
        const section = document.createElement('section');
        section.className = 'group-sub-section';
        if (title) {
          const heading = document.createElement('h2');
          heading.className = 'group-sub-section-title' + (first ? ' group-sub-section-title--first' : '');
          heading.textContent = title;
          section.appendChild(heading);
        }
        const grid = document.createElement('div');
        grid.className = 'album-grid group-sub-album-grid';
        albums.forEach(album => appendAlbumCard(grid, album));
        section.appendChild(grid);
        sectionsRoot.appendChild(section);
      }

      if (filmFavoritesOnly) {
        const more = document.createElement('a');
        more.className = 'favorites-more';
        more.href = Routes.groupChapters(group);
        more.textContent = 'View all rolls';
        sectionsRoot.appendChild(more);
      } else {
        if (showStrip) {
          const bandHeading = document.createElement('h2');
          bandHeading.className = 'group-chapters-heading';
          bandHeading.textContent = 'View all photos from each city';
          sectionsRoot.appendChild(bandHeading);
        }

        if (group.subAlbumSections?.length) {
          group.subAlbumSections.forEach((sec, i) => {
            renderSection(sec.title, resolveSubAlbums(sec.albums), { first: i === 0 });
          });
        } else {
          renderSection('', resolveSubAlbums(group.subAlbums), { first: true });
        }

        if (!group.includeHiddenSubAlbums && group.showFilmRolls !== false) {
          renderFilmRollLinks(group);
        }
      }
    }
    })();
  </script>
</body>
</html>
