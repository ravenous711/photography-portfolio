<!DOCTYPE html>
<html lang="en">
<head>
  <script>if(sessionStorage.getItem("site_unlocked")!=="true"){window.location.replace("/login/?return="+encodeURIComponent(window.location.href));}</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Album — Raveen Fernando</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css" />
  <script>tailwind.config = { theme: { extend: { colors: { gold: '#c9a96e' } } } }</script>
</head>
<body class="overflow-x-hidden">

  <!-- ── Navigation ── -->
  <nav id="main-nav" class="nav-scrolled">
    <a href="/" class="nav-logo">RF<span>.</span></a>
    <ul class="nav-links">
      <li><a href="/"   data-nav-link data-nav="home">Home</a></li>
      <li><a href="/gallery/" data-nav-link data-nav="gallery">Gallery</a></li>
    </ul>
    <button id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </nav>

  <div id="mobile-menu" role="dialog" aria-label="Navigation menu">
    <a href="/">Home</a>
    <a href="/gallery/">Gallery</a>
  </div>

  <!-- ── Page Header ── -->
  <header class="page-header fade-in">
    <a href="/gallery/" class="back-link" id="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M19 12H5M5 12l7 7M5 12l7-7"/>
      </svg>
      <span id="back-link-label">Gallery</span>
    </a>
    <div class="gold-rule" style="margin-top:1.5rem"></div>
    <p class="group-page-dateline" id="group-dateline"></p>
    <h1 class="page-title" id="group-title">–</h1>
    <p class="mt-4 text-sm" id="group-desc" style="color:var(--color-muted);max-width:420px;margin-left:auto;margin-right:auto"></p>
  </header>

  <!-- ── Password Modal (shown for protected groups) ── -->
  <div id="password-modal" style="display:none;position:fixed;inset:0;z-index:500;background:rgba(10,10,10,0.97);display:none;align-items:center;justify-content:center;flex-direction:column;padding:2rem;text-align:center">
    <svg style="width:2.5rem;height:2.5rem;margin-bottom:1.5rem;opacity:0.4" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    <h2 class="font-serif text-3xl font-light mb-2" id="modal-group-title">Private Album</h2>
    <p class="text-sm mb-8" style="color:rgba(240,237,232,0.45)">Enter the password to view this collection.</p>
    <form id="password-form" novalidate style="width:100%;max-width:320px">
      <input id="password-input" type="password" placeholder="Password"
        autocomplete="current-password"
        style="width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);color:white;padding:0.75rem 1rem;margin-bottom:0.5rem;font-family:inherit;font-size:0.9rem;letter-spacing:0.1em;text-align:center;outline:none;transition:border-color 0.2s"
        onfocus="this.style.borderColor='rgba(255,255,255,0.3)'"
        onblur="this.style.borderColor='rgba(255,255,255,0.12)'" />
      <p id="password-error" style="color:#f87171;font-size:0.8rem;min-height:1.2rem;margin-bottom:0.5rem"></p>
      <button type="submit" style="width:100%;background:white;color:black;border:none;padding:0.75rem;font-family:inherit;font-size:0.8rem;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;transition:opacity 0.2s" onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">
        Unlock
      </button>
    </form>
    <a href="/gallery/" style="margin-top:2rem;font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:rgba(240,237,232,0.3);text-decoration:none;transition:color 0.2s" onmouseover="this.style.color='rgba(240,237,232,0.6)'" onmouseout="this.style.color='rgba(240,237,232,0.3)'">Back to Gallery</a>
  </div>

  <!-- ── Sub-album Grid ── -->
  <main class="px-6 md:px-12 pb-24 max-w-7xl mx-auto">
    <div class="album-grid fade-in fade-in-delay-1" id="sub-album-grid">
      <!-- Populated by JS -->
    </div>
  </main>

  <!-- ── Footer ── -->
  <footer>
    <p id="footer-copyright"></p>
    <p class="mt-1">
      <a href="/">Home</a>
    </p>
  </footer>

  <style>
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--color-text); }
    .album-card { display: block; text-decoration: none; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60%  { transform: translateX(-8px); }
      40%, 80%  { transform: translateX(8px); }
    }
  </style>

  <script src="/js/config.js"></script>
  <script src="/js/routes.js"></script>
  <script src="/js/main.js"></script>
  <script>SiteAuth.guard();</script>
  <script>
    document.getElementById('footer-copyright').textContent =
      `© ${new Date().getFullYear()} ${SITE_CONFIG.photographerName}`;

    Routes.canonicalize('group', ['id']);
    const groupId = Routes.parsePathId('group', ['id']);
    const group = ALBUMS.find(a => a.id === groupId && a.type === 'group');

    if (!group) {
      window.location.replace(Routes.gallery);
    } else {
      document.title = `${group.title} — ${SITE_CONFIG.photographerName}`;
      document.getElementById('modal-group-title').textContent = group.title;

      if (group.protected && !AlbumAuth.isUnlocked(group.id)) {
        showPasswordModal();
      } else {
        showGroup();
      }
    }

    function showPasswordModal() {
      const modal = document.getElementById('password-modal');
      modal.style.display = 'flex';

      const form  = document.getElementById('password-form');
      const input = document.getElementById('password-input');
      const error = document.getElementById('password-error');
      input.focus();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        error.textContent = '';
        const btn = form.querySelector('button[type="submit"]');
        btn.textContent = 'Checking…';
        btn.disabled = true;

        const hash = await hashPassword(input.value.trim());
        if (hash === group.passwordHash) {
          AlbumAuth.unlock(group.id);
          modal.style.display = 'none';
          showGroup();
        } else {
          error.textContent = 'Incorrect password.';
          input.value = '';
          input.focus();
          btn.textContent = 'Unlock';
          btn.disabled = false;
          input.style.animation = 'shake 0.4s ease';
          input.addEventListener('animationend', () => { input.style.animation = ''; }, { once: true });
        }
      });
    }

    function showGroup() {
      document.getElementById('group-dateline').textContent = albumDateline(group);
      document.getElementById('group-title').textContent = group.title;
      const groupDesc = document.getElementById('group-desc');
      if (group.subAlbums?.length) {
        groupDesc.style.display = 'none';
        groupDesc.textContent = '';
      } else {
        groupDesc.style.display = '';
        groupDesc.textContent = group.description || '';
      }

      const backLink = document.getElementById('back-link');
      if (group.parentId) {
        const parent = ALBUMS.find(a => a.id === group.parentId);
        backLink.href = Routes.group(group.parentId);
        document.getElementById('back-link-label').textContent = parent ? parent.title : 'Back';
      }

      const grid = document.getElementById('sub-album-grid');
      const subAlbums = group.subAlbums
        .map(id => ALBUMS.find(a => a.id === id))
        .filter(a => a && !a.hidden);

      subAlbums.forEach(album => {
        const isGroup = album.type === 'group';
        const href = albumPageUrl(album);

        const card = document.createElement('a');
        card.href = href;
        card.className = 'album-card fade-in visible';
        const posStyle = album.coverPosition ? ` style="object-position:${album.coverPosition}"` : '';
        const dateline = albumDateline(album);
        card.innerHTML = `
          <img class="album-card-img"
               src="${album.coverImage}"
               alt="${album.title}"
               loading="lazy"${posStyle} />
          <div class="album-card-overlay">
            ${dateline ? `<p class="album-card-dateline">${dateline}</p>` : ''}
            <h2 class="album-card-title">${album.title}</h2>
          </div>
        `;
        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
