<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Admin — Raveen Fernando</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <script src="/js/justified-layout.js"></script>
  <style>
    /* ── Auth screen ── */
    #auth-screen {
      position: fixed; inset: 0; z-index: 900;
      background: var(--color-bg);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; padding: 2rem; text-align: center;
    }
    #auth-screen.hidden { display: none; }

    /* ── Toolbar ── */
    #toolbar {
      position: sticky; top: 0; z-index: 100;
      background: var(--nav-scrolled-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--color-border);
      padding: 0.75rem 1.5rem;
      display: flex; align-items: center; gap: 1rem;
      flex-wrap: wrap;
    }

    /* ── Photo grid ── */
    .photo-grid {
      position: relative;
      padding-bottom: 1.25rem;
    }
    .photo-thumb {
      position: absolute; cursor: pointer;
      border: 2px solid transparent;
      border-radius: 2px;
      overflow: hidden;
      transition: border-color 0.15s;
      background: var(--color-surface);
    }
    .photo-thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.15s;
    }
    .photo-thumb .mark-overlay {
      position: absolute; inset: 0;
      background: rgba(220, 38, 38, 0.7);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.15s;
      pointer-events: none;
    }
    .photo-thumb.marked {
      border-color: rgb(220, 38, 38);
    }
    .photo-thumb.marked .mark-overlay { opacity: 1; }
    .photo-thumb.marked img { opacity: 0.4; }

    /* ── Selection checkbox corner ── */
    .thumb-check {
      position: absolute; top: 7px; left: 7px; z-index: 2;
      width: 28px; height: 28px;
      background: rgba(255,255,255,0.9);
      border: 1.5px solid rgba(0,0,0,0.2);
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .photo-thumb:hover .thumb-check,
    .photo-thumb.marked .thumb-check { opacity: 1; }
    .photo-thumb.marked .thumb-check {
      background: rgb(220,38,38);
      border-color: rgb(220,38,38);
    }
    .thumb-check svg { display: none; }
    .photo-thumb.marked .thumb-check svg { display: block; }

    /* ── Curated badge (gold star) ── */
    .photo-thumb.is-curated { border-color: var(--color-gold); }
    /* pending-add = will be added to curated on save */
    .photo-thumb.curate-pending-add { border-color: var(--color-gold); }
    /* pending-remove = currently curated but will be removed on save */
    .photo-thumb.curate-pending-remove { border-color: #6b7280; }
    .photo-thumb.curate-pending-remove .curated-badge { opacity: 0.25; }
    .photo-thumb.curate-pending-remove .curate-add-badge { display: none !important; }

    .curated-badge {
      position: absolute; bottom: 6px; right: 6px; z-index: 3;
      background: var(--color-gold);
      border-radius: 50%;
      width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
    }
    .curated-badge:hover { transform: scale(1.2); }
    .curated-badge svg { display: block; pointer-events: none; }
    .photo-thumb.marked .curated-badge { opacity: 0.4; }

    /* Faint star outline on hover for non-curated photos (click to add) */
    .curate-add-badge {
      position: absolute; bottom: 6px; right: 6px; z-index: 3;
      background: rgba(0,0,0,0.45);
      border-radius: 50%;
      width: 22px; height: 22px;
      display: none; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .photo-thumb:not(.is-curated):not(.curate-pending-add):hover .curate-add-badge { display: flex; }
    .photo-thumb.curate-pending-add .curate-add-badge { display: flex; background: var(--color-gold); }
    .curate-add-badge svg { display: block; pointer-events: none; }

    /* ── Album curated action row ── */
    .album-curate-actions {
      display: flex; align-items: center; gap: 0.5rem;
      flex-shrink: 0;
    }
    .btn-curate-clear {
      font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase;
      border: 1px solid var(--color-muted); color: var(--color-muted);
      background: transparent; padding: 0.25rem 0.6rem; cursor: pointer;
      border-radius: 2px; transition: opacity 0.15s; white-space: nowrap;
    }
    .btn-curate-clear:hover { opacity: 0.7; }

    /* Curated save button in toolbar */
    #save-curated-btn {
      border-color: var(--color-gold); color: var(--color-gold);
    }

    /* ── Album directory rows ── */
    .album-section-heading {
      font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--color-muted); padding: 1.75rem 0 0.5rem;
      border-top: 1px solid var(--color-border); margin-top: 0.5rem;
    }
    .album-section-heading:first-child { border-top: none; padding-top: 0.25rem; }
    .album-group-heading {
      font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--color-muted); opacity: 0.55;
      padding: 1rem 0 0.25rem 0.75rem;
    }
    .album-row {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.85rem 0;
      cursor: pointer;
      border-bottom: 1px solid var(--color-border);
      transition: opacity 0.15s;
      text-decoration: none;
    }
    .album-row.indented { padding-left: 0.75rem; }
    .album-row:hover { opacity: 0.65; }
    .album-row-title {
      font-family: var(--font-serif);
      font-size: 1.2rem; font-weight: 300; letter-spacing: 0.04em;
      color: var(--color-text); flex: 1; margin: 0;
    }
    .album-row-meta {
      font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--color-muted); white-space: nowrap;
    }
    .album-row-chevron { color: var(--color-muted); flex-shrink: 0; }

    /* ── Detail view header ── */
    #detail-header {
      display: flex; align-items: baseline; gap: 1rem;
      margin-bottom: 1.5rem; flex-wrap: wrap;
    }
    #detail-header h2 {
      font-family: var(--font-serif); font-size: 1.5rem; font-weight: 300;
      letter-spacing: 0.04em; margin: 0; color: var(--color-text); flex: 1;
    }
    #detail-status {
      font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--color-muted);
    }

    /* ── Album section (detail wrapper — kept for savePendingCurated queries) ── */
    .album-section { margin-bottom: 1rem; border-bottom: 1px solid var(--color-border); }

    /* Legacy accordion styles (preserved, unused in new detail view) */
    .album-header { display: flex; align-items: center; gap: 0.75rem; padding: 0.9rem 0; cursor: pointer; user-select: none; }
    .album-header h2 { font-family: var(--font-serif); font-size: 1.25rem; font-weight: 300; letter-spacing: 0.04em; margin: 0; color: var(--color-text); flex: 1; }
    .album-header .album-meta { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-muted); }
    .album-header .chevron { width: 16px; height: 16px; color: var(--color-muted); flex-shrink: 0; }
    .album-body {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.3s ease;
    }
    .album-section.open .album-body { max-height: 99999px; }

    /* ── Buttons ── */
    .btn-danger {
      background: rgb(220, 38, 38);
      color: white;
      border: none;
      padding: 0.5rem 1.25rem;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s;
      border-radius: 2px;
    }
    .btn-danger:hover { opacity: 0.85; }
    .btn-danger:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-ghost {
      background: transparent;
      color: var(--color-muted);
      border: 1px solid var(--color-border);
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      border-radius: 2px;
    }
    .btn-ghost:hover { color: var(--color-text); border-color: var(--color-text); }

    /* ── Admin Lightbox ── */
    #admin-lightbox {
      position: fixed; inset: 0; z-index: 900;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.96);
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease;
    }
    #admin-lightbox.open { opacity: 1; pointer-events: all; }

    #alb-img {
      max-width: min(88vw, 1400px); max-height: 82vh;
      object-fit: contain; display: block;
      opacity: 0; transition: opacity 0.2s ease;
      user-select: none; pointer-events: none;
    }
    #alb-img.loaded { opacity: 1; }
    #alb-spinner {
      position: absolute;
      width: 28px; height: 28px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: rgba(255,255,255,0.6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    #admin-lightbox.loading #alb-spinner { display: block; }
    #admin-lightbox.loading #alb-img { opacity: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #alb-close {
      position: absolute; top: 1.25rem; right: 1.5rem; z-index: 2;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.75); width: 40px; height: 40px; border-radius: 50%;
      font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    #alb-close:hover { background: rgba(255,255,255,0.18); color: white; }

    .alb-nav {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.75); width: 52px; height: 52px; border-radius: 50%;
      font-size: 1.6rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .alb-nav:hover { background: rgba(255,255,255,0.2); color: white; }
    .alb-nav[disabled] { opacity: 0.2; cursor: default; pointer-events: none; }
    #alb-prev { left: 1.25rem; }
    #alb-next { right: 1.25rem; }

    #alb-footer {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 2;
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; padding: 1.25rem 1.5rem;
      background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 100%);
      flex-wrap: wrap;
    }
    #alb-counter {
      font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(255,255,255,0.4); flex-shrink: 0;
    }
    #alb-mark {
      font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.22); background: transparent;
      color: rgba(255,255,255,0.65); padding: 0.4rem 1rem; border-radius: 2px;
      cursor: pointer; transition: all 0.15s; flex-shrink: 0;
    }
    #alb-mark:hover { border-color: #ef4444; color: #f87171; }
    #alb-mark.marked { background: rgba(220,38,38,0.2); border-color: #ef4444; color: #f87171; }
    #alb-copy-url {
      font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.22); background: transparent;
      color: rgba(255,255,255,0.65); padding: 0.4rem 1rem; border-radius: 2px;
      cursor: pointer; transition: all 0.15s; flex-shrink: 0;
    }
    #alb-copy-url:hover { border-color: rgba(255,255,255,0.5); color: white; }
    #alb-copy-url.copied { border-color: #22c55e; color: #4ade80; }
    #alb-hint {
      font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(255,255,255,0.22); text-align: right;
    }
    @media (max-width: 640px) { #alb-hint { display: none; } }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      background: var(--color-text); color: var(--color-bg);
      padding: 0.75rem 1.5rem;
      font-size: 0.8rem; letter-spacing: 0.06em;
      border-radius: 2px; z-index: 500;
      opacity: 0; transition: opacity 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    /* ── Tab active state ── */
    .tab-btn.active {
      color: var(--color-text);
      border-color: var(--color-text);
    }

  </style>
</head>
<body class="overflow-x-hidden">

  <!-- ── Auth Screen ── -->
  <div id="auth-screen">
    <p style="font-size:0.72rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--color-muted);margin-bottom:0.75rem">Admin Access</p>
    <p style="font-family:var(--font-serif);font-size:2rem;font-weight:300;letter-spacing:0.08em;margin-bottom:2.5rem" id="auth-site-name">–</p>
    <form id="auth-form" novalidate style="width:100%;max-width:320px">
      <input id="auth-input" type="password" placeholder="Admin password"
        autocomplete="current-password"
        style="width:100%;background:var(--color-surface);border:1px solid var(--color-border);color:var(--color-text);padding:0.75rem 1rem;margin-bottom:0.5rem;font-family:var(--font-sans);font-size:0.9rem;letter-spacing:0.1em;text-align:center;outline:none;transition:border-color 0.2s;border-radius:2px"
        onfocus="this.style.borderColor='var(--color-text)'"
        onblur="this.style.borderColor='var(--color-border)'"
      />
      <p id="auth-error" style="color:#f87171;font-size:0.8rem;min-height:1.2rem;margin-bottom:0.5rem;text-align:center"></p>
      <button type="submit" style="width:100%;background:var(--color-text);color:var(--color-bg);border:none;padding:0.75rem;font-family:var(--font-sans);font-size:0.8rem;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;transition:opacity 0.2s;border-radius:2px" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">
        Enter
      </button>
    </form>
  </div>

  <!-- ── Main Admin UI (hidden until auth) ── -->
  <div id="admin-ui" style="display:none">

    <!-- ── Toolbar ── -->
    <div id="toolbar">
      <!-- List mode: site name + tabs -->
      <span id="toolbar-site-name" style="font-family:var(--font-serif);font-size:1.1rem;letter-spacing:0.06em;color:var(--color-text)">Admin</span>
      <span id="toolbar-tabs" style="display:flex;align-items:center;gap:0.5rem;flex:1">
        <button class="btn-ghost tab-btn active" id="tab-albums" onclick="switchTab('albums')">Albums</button>
        <button class="btn-ghost tab-btn" id="tab-codes" onclick="switchTab('codes')">Access codes</button>
      </span>
      <!-- Detail mode: back button + album title -->
      <button class="btn-ghost" id="back-btn" style="display:none" onclick="closeAlbumDetail()">← Albums</button>
      <span id="detail-toolbar-title" style="display:none;font-family:var(--font-serif);font-size:1rem;letter-spacing:0.04em;color:var(--color-text);flex:1"></span>
      <!-- Shared actions -->
      <span id="selection-count" style="font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-muted)">0 selected</span>
      <button class="btn-ghost" onclick="clearSelection()">Clear</button>
      <button class="btn-ghost" id="save-curated-btn" style="display:none" onclick="savePendingCurated()">Save curated changes</button>
      <button class="btn-danger" id="commit-btn" disabled onclick="commitDeletions()">Commit Deletions</button>
      <button class="btn-ghost" onclick="signOut()" style="color:var(--color-muted);margin-left:0.5rem">Sign out</button>
    </div>

    <!-- ── Albums list (directory) ── -->
    <main id="pane-albums" style="padding: 2rem 1.5rem 4rem">
      <div id="album-list"></div>
    </main>

    <!-- ── Album detail view ── -->
    <main id="pane-album-detail" style="display:none; padding: 2rem 1.5rem 4rem">
      <div id="detail-header">
        <h2 id="detail-album-title"></h2>
        <span id="detail-status"></span>
      </div>
      <div id="album-detail-grid-container"></div>
    </main>

    <!-- ── Access codes tab ── -->
    <main id="pane-codes" style="display:none; padding: 2rem 1.5rem 4rem; max-width: 720px">

      <!-- Create form -->
      <section style="margin-bottom:2rem;padding:1.25rem 1.5rem;border:1px solid var(--color-border)">
        <p style="font-size:0.7rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-muted);margin-bottom:1rem">Create access code</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:0.75rem">
          <input id="code-label" placeholder="Label (e.g. Smith Wedding)" style="background:var(--color-surface);border:1px solid var(--color-border);color:var(--color-text);padding:0.5rem 0.75rem;font-size:0.8rem;border-radius:2px;width:100%">
          <select id="code-audience" style="background:var(--color-surface);border:1px solid var(--color-border);color:var(--color-text);padding:0.5rem 0.75rem;font-size:0.8rem;border-radius:2px">
            <option value="friends">friends</option>
            <option value="family">family</option>
            <option value="client:">client:name — edit below</option>
          </select>
        </div>
        <div style="display:flex;gap:0.75rem;align-items:center">
          <input id="code-value" placeholder="Plaintext code (min 8 chars, shown once)" style="background:var(--color-surface);border:1px solid var(--color-border);color:var(--color-text);padding:0.5rem 0.75rem;font-size:0.8rem;border-radius:2px;flex:1">
          <button class="btn-ghost" onclick="createCode()" style="font-size:0.75rem;white-space:nowrap">Create</button>
        </div>
        <p id="code-create-status" style="font-size:0.75rem;color:var(--color-muted);margin-top:0.5rem;min-height:1.2em"></p>
      </section>

      <!-- Code list -->
      <div id="codes-list">
        <p style="font-size:0.8rem;color:var(--color-muted)">Loading...</p>
      </div>
    </main>

  <!-- ── Admin Lightbox ── -->
  <div id="admin-lightbox" role="dialog" aria-modal="true">
    <button id="alb-close" aria-label="Close" onclick="lbClose()">✕</button>
    <button class="alb-nav" id="alb-prev" aria-label="Previous" onclick="lbNav(-1)">‹</button>

    <div style="position:relative;display:flex;align-items:center;justify-content:center;">
      <img id="alb-img" alt="" />
      <div id="alb-spinner"></div>
    </div>

    <button class="alb-nav" id="alb-next" aria-label="Next" onclick="lbNav(1)">›</button>

    <div id="alb-footer">
      <span id="alb-counter"></span>
      <button id="alb-mark" onclick="lbToggleMark()">Mark for deletion</button>
      <button id="alb-copy-url" onclick="lbCopyUrl()">Copy URL</button>
      <span id="alb-hint">← → navigate &nbsp;·&nbsp; D mark &nbsp;·&nbsp; Esc close</span>
    </div>
  </div>

  <!-- ── Toast notification ── -->
  <div id="toast"></div>

  <script src="/js/config.js"></script>
  <script src="/js/albums/clients.js"></script>
  <script src="/js/albums/family-2025.js"></script>
  <script src="/js/albums/family-2026.js"></script>
  <script src="/js/albums/california-2025.js"></script>
  <script src="/js/albums/misc-2026.js"></script>
  <script src="/js/albums/italy-2026.js"></script>
  <script src="/js/albums.js"></script>
  <script src="/js/routes.js"></script>
  <script src="/js/main.js"></script>
  <script>
    const R2_BASE_PATTERN = /^https:\/\/pub-[a-f0-9]+\.r2\.dev\//;

    function gridUrl(fullUrl) {
      const m = fullUrl.match(/^(https:\/\/pub-[a-f0-9]+\.r2\.dev\/)(.+)$/);
      return m ? `${m[1]}grid/${m[2]}` : fullUrl;
    }
    function thumbUrl(fullUrl) { return gridUrl(fullUrl); }

    // ── Auth (server-side session) ───────────────────────────────────────────
    document.getElementById('auth-site-name').textContent = SITE_CONFIG.photographerName;

    // On load: check if we already have a valid session cookie
    fetch('/api/admin-verify', { credentials: 'same-origin' })
      .then(r => { if (r.ok) showAdminUI(); })
      .catch(() => {});

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('auth-input').value.trim();
      if (!pw) return;
      const btn = e.target.querySelector('button');
      btn.textContent = 'Checking…'; btn.disabled = true;

      try {
        const res = await fetch('/api/admin-login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw }),
        });

        if (res.ok) {
          showAdminUI();
        } else {
          document.getElementById('auth-error').textContent = 'Incorrect password.';
          const input = document.getElementById('auth-input');
          input.value = '';
          input.style.animation = 'shake 0.4s ease';
          input.addEventListener('animationend', () => { input.style.animation = ''; }, { once: true });
          btn.textContent = 'Enter'; btn.disabled = false;
        }
      } catch {
        document.getElementById('auth-error').textContent = 'Network error — try again.';
        btn.textContent = 'Enter'; btn.disabled = false;
      }
    });

    async function signOut() {
      await fetch('/api/admin-login', { method: 'DELETE', credentials: 'same-origin' });
      document.getElementById('admin-ui').style.display = 'none';
      document.getElementById('auth-screen').classList.remove('hidden');
      document.getElementById('auth-input').value = '';
      document.getElementById('auth-error').textContent = '';
    }

    function showAdminUI() {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('admin-ui').style.display = 'block';
      renderAlbums();
      checkInitialRoute(); // navigate to #album-id if present on load / reload
    }

    // ── Hash-based routing so reloading restores the right album ─────────────
    function checkInitialRoute() {
      const hash = location.hash;
      if (hash.startsWith('#album-')) {
        const albumId = decodeURIComponent(hash.slice(7));
        const album = ALBUMS.find(a => a.id === albumId);
        if (album) openAlbumDetail(album, /* pushState= */ false);
      }
    }

    window.addEventListener('popstate', () => {
      const hash = location.hash;
      if (hash.startsWith('#album-')) {
        const albumId = decodeURIComponent(hash.slice(7));
        const album = ALBUMS.find(a => a.id === albumId);
        if (album) openAlbumDetail(album, /* pushState= */ false);
      } else {
        if (currentDetailAlbum) _showListView();
      }
    });

    // ── Selection state (deletion) ───────────────────────────────────────────
    const selected = new Set();

    // ── Pending curated edits: albumId → Set of URLs in the new curated set ─
    // null means no edits pending for that album.
    const pendingCurated = new Map(); // albumId → Set<url>

    function updateToolbar() {
      const count = selected.size;
      document.getElementById('selection-count').textContent =
        count === 0 ? '0 selected' : `${count} photo${count !== 1 ? 's' : ''} selected`;
      document.getElementById('commit-btn').disabled = count === 0;

      // Show "Save curated changes" if any album has pending curated edits
      const hasPending = pendingCurated.size > 0;
      document.getElementById('save-curated-btn').style.display = hasPending ? '' : 'none';
    }

    // Return the album id shared by all selected photos, or null if mixed/none
    function selectedAlbumId() {
      if (selected.size === 0) return null;
      const ids = new Set();
      selected.forEach(url => {
        const thumb = document.querySelector(`.photo-thumb[data-url="${CSS.escape(url)}"]`) ||
                      document.querySelector(`.photo-thumb[data-url="${url}"]`);
        if (thumb) ids.add(thumb.closest('[data-album-id]')?.dataset.albumId || null);
      });
      ids.delete(null);
      return ids.size === 1 ? [...ids][0] : null;
    }

    function clearSelection() {
      selected.clear();
      document.querySelectorAll('.photo-thumb.marked').forEach(el => el.classList.remove('marked'));
      updateToolbar();
    }

    // ── Toggle a photo in/out of pending curated set ─────────────────────────
    function toggleCurated(thumb, url, albumId, currentCuratedSet) {
      if (!pendingCurated.has(albumId)) {
        // First edit for this album — start from the current curated set
        pendingCurated.set(albumId, new Set(currentCuratedSet));
      }
      const pending = pendingCurated.get(albumId);
      const isNowPending = pending.has(url);

      if (isNowPending) {
        pending.delete(url);
        // Revert visual: if it was originally curated, show faded; if it was a new add, remove add style
        if (currentCuratedSet.has(url)) {
          thumb.classList.add('curate-pending-remove');
          thumb.classList.remove('curate-pending-add');
        } else {
          thumb.classList.remove('curate-pending-add');
        }
      } else {
        pending.add(url);
        if (currentCuratedSet.has(url)) {
          // Restoring an originally-curated photo
          thumb.classList.remove('curate-pending-remove');
        } else {
          // New addition
          thumb.classList.add('curate-pending-add');
        }
      }

      // If pending matches original, clear the pending state for this album
      const same = pending.size === currentCuratedSet.size &&
        [...currentCuratedSet].every(u => pending.has(u));
      if (same) {
        pendingCurated.delete(albumId);
        // Revert all visual state for this album
        document.querySelectorAll(`.album-section[data-album-id="${CSS.escape(albumId)}"] .photo-thumb`).forEach(t => {
          t.classList.remove('curate-pending-add', 'curate-pending-remove');
        });
      }

      updateToolbar();
      // Re-apply the curated filter so the grid updates live while the filter is active
      const filterFn = document.getElementById('curated-filter-btn')?._applyFilter;
      if (filterFn) filterFn();
    }

    // ── Save all pending curated changes ─────────────────────────────────────
    async function savePendingCurated() {
      if (pendingCurated.size === 0) return;
      const btn = document.getElementById('save-curated-btn');
      btn.textContent = 'Saving…'; btn.disabled = true;

      const errors = [];
      for (const [albumId, urlSet] of pendingCurated) {
        const orderedPhotos = [];
        // Preserve DOM order
        document.querySelectorAll(`.album-section[data-album-id="${CSS.escape(albumId)}"] .photo-thumb`).forEach(t => {
          if (urlSet.has(t.dataset.url)) orderedPhotos.push(t.dataset.url);
        });
        try {
          const res = await fetch('/api/admin-curate', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ albumId, photos: orderedPhotos }),
          });
          const data = await res.json();
          if (!res.ok) {
            errors.push(`${albumId}: ${data.error || res.statusText}`);
          } else {
            // Update DOM to reflect saved state
            const section = document.querySelector(`.album-section[data-album-id="${CSS.escape(albumId)}"]`);
            if (section) {
              const newCurated = new Set(orderedPhotos);
              section.querySelectorAll('.photo-thumb').forEach(t => {
                const u = t.dataset.url;
                const shouldBe = newCurated.has(u);
                t.classList.toggle('is-curated', shouldBe);
                t.classList.remove('curate-pending-add', 'curate-pending-remove');
                const existing = t.querySelector('.curated-badge');
                if (shouldBe && !existing) {
                  const badge = makeCuratedBadge(albumId, newCurated);
                  t.appendChild(badge);
                  badge.addEventListener('click', (e) => { e.stopPropagation(); toggleCurated(t, u, albumId, newCurated); });
                } else if (!shouldBe && existing) {
                  existing.remove();
                }
              });
              const meta = section.querySelector('.album-meta');
              const total = section.querySelectorAll('.photo-thumb').length;
              if (meta) meta.textContent = `${total} photo${total !== 1 ? 's' : ''}${orderedPhotos.length > 0 ? ` · ${orderedPhotos.length} curated` : ''}`;
            }
          }
        } catch (err) {
          errors.push(`${albumId}: ${err.message}`);
        }
      }

      pendingCurated.clear();
      if (errors.length) {
        showToast(`Some saves failed: ${errors.join('; ')}`, 8000);
      } else {
        showToast(`Curated sets saved — Vercel redeploying.`, 5000);
      }
      btn.textContent = 'Save curated changes'; btn.disabled = false;
      updateToolbar();
      // Update detail status if still in the album detail view
      if (currentDetailAlbum) {
        const newCurated = document.querySelectorAll(`#pane-album-detail .photo-thumb.is-curated, #pane-album-detail .photo-thumb.curate-pending-add`).length;
        const total = document.querySelectorAll('#pane-album-detail .photo-thumb').length;
        const hEl = document.getElementById('detail-status');
        if (hEl && total) {
          const prev       = hEl.textContent.split(' · ');
          const heartsPart = prev.find(p => p.includes('hearted')) || '';
          const curPart    = newCurated > 0 ? `${newCurated} curated` : 'none curated';
          hEl.textContent  = [prev[0], curPart, heartsPart].filter(Boolean).join(' · ');
        }
      }
    }

    function makeCuratedBadge() {
      const badge = document.createElement('div');
      badge.className = 'curated-badge';
      badge.title = 'In curated set — click to remove';
      badge.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="white" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
      return badge;
    }
    function makeCurateAddBadge() {
      const badge = document.createElement('div');
      badge.className = 'curate-add-badge';
      badge.title = 'Click to add to curated set';
      badge.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
      return badge;
    }

    // ── Justified layout (mirrors album page) ────────────────────────────────
    function runJustifiedLayout(grid) {
      const allItems     = Array.from(grid.querySelectorAll('.photo-thumb'));
      const visibleItems = allItems.filter(el => el.style.display !== 'none');
      if (!visibleItems.length) { grid.style.height = '0px'; return; }
      const containerWidth = grid.offsetWidth;
      if (!containerWidth) return;
      const aspectRatios = visibleItems.map(item => {
        const img = item.querySelector('img');
        if (img && img.naturalWidth && img.naturalHeight) return img.naturalWidth / img.naturalHeight;
        return 1.5;
      });
      const layout = justifiedLayout(aspectRatios, {
        containerWidth,
        targetRowHeight: window.innerWidth <= 640 ? 200 : window.innerWidth <= 1024 ? 280 : 420,
        boxSpacing: window.innerWidth <= 640 ? 6 : 12,
        containerPadding: 0,
      });
      grid.style.height = layout.containerHeight + 'px';
      // Position only visible items; hidden items are left off-screen via display:none
      visibleItems.forEach((item, i) => {
        const box = layout.boxes[i];
        item.style.left   = box.left   + 'px';
        item.style.top    = box.top    + 'px';
        item.style.width  = box.width  + 'px';
        item.style.height = box.height + 'px';
      });
    }

    function bindAdminGridLayout(grid) {
      runJustifiedLayout(grid);
      grid.querySelectorAll('img').forEach(img => {
        if (img.complete && img.naturalWidth) runJustifiedLayout(grid);
        else img.addEventListener('load', () => runJustifiedLayout(grid));
      });
    }

    // ── Album detail navigation ───────────────────────────────────────────────
    let currentDetailAlbum = null;

    async function openAlbumDetail(album, pushState = true) {
      currentDetailAlbum = album;

      // Update URL hash so reloading returns to this album
      if (pushState) {
        history.pushState({ albumId: album.id }, '', `#album-${encodeURIComponent(album.id)}`);
      }

      // Switch panes
      document.getElementById('pane-albums').style.display = 'none';
      document.getElementById('pane-codes').style.display  = 'none';
      document.getElementById('pane-album-detail').style.display = '';

      // Toolbar: show back + title, hide tabs
      document.getElementById('toolbar-tabs').style.display       = 'none';
      document.getElementById('toolbar-site-name').style.display  = 'none';
      document.getElementById('back-btn').style.display           = '';
      document.getElementById('detail-toolbar-title').style.display = '';
      document.getElementById('detail-toolbar-title').textContent = album.title;

      // Set detail header
      document.getElementById('detail-album-title').textContent = album.title;
      document.getElementById('detail-status').textContent = 'Loading…';
      document.getElementById('album-detail-grid-container').innerHTML = '';

      // Fetch favorites tally async
      let tally = [];
      try {
        const res = await fetch(`/api/admin-favorites?albumId=${encodeURIComponent(album.id)}`, {
          credentials: 'same-origin',
        });
        if (res.ok) { const d = await res.json(); tally = d.tally || []; }
      } catch {}

      renderAlbumDetail(album, tally);
    }

    function _showListView() {
      currentDetailAlbum = null;
      document.getElementById('pane-album-detail').style.display = 'none';
      document.getElementById('pane-albums').style.display       = '';
      document.getElementById('toolbar-tabs').style.display       = '';
      document.getElementById('toolbar-site-name').style.display  = '';
      document.getElementById('back-btn').style.display           = 'none';
      document.getElementById('detail-toolbar-title').style.display = 'none';
      document.getElementById('album-list').innerHTML = '';
      renderAlbums();
    }

    function closeAlbumDetail() {
      history.pushState(null, '', location.pathname); // clear the hash
      _showListView();
    }

    function renderAlbumDetail(album, tally) {
      const container = document.getElementById('album-detail-grid-container');
      container.innerHTML = '';

      const allPhotos = getAlbumAllPhotos(album).filter(u => !u.endsWith('.svg'));
      const heartMap  = new Map(tally.map(({ photoUrl, count }) => [photoUrl, count]));
      const curatedSet = new Set(Array.isArray(album.curated) ? album.curated : []);

      const heartedCount  = tally.length;
      const curatedCount2 = curatedSet.size;
      const parts = [`${allPhotos.length} photos`];
      if (curatedCount2 > 0) parts.push(`${curatedCount2} curated`);
      else parts.push('none curated');
      if (heartedCount) parts.push(`${heartedCount} hearted`);
      document.getElementById('detail-status').textContent = parts.join(' · ');

      // Legend + curated filter toggle
      let curatedFilterActive = false;
      const legend = document.createElement('div');
      legend.style.cssText = 'display:flex;align-items:center;gap:1.25rem;margin-bottom:1rem;font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-muted);flex-wrap:wrap';

      const filterBtn = document.createElement('button');
      filterBtn.id = 'curated-filter-btn';
      filterBtn.textContent = 'Show curated only';
      filterBtn.style.cssText = 'margin-left:auto;background:transparent;border:1px solid var(--color-border);color:var(--color-muted);padding:3px 10px;font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;border-radius:2px;transition:background 0.15s,color 0.15s';

      function applyCuratedFilter() {
        const thumbs = document.querySelectorAll('#pane-album-detail .photo-thumb');
        thumbs.forEach(th => {
          const isCurated = th.classList.contains('is-curated') || th.classList.contains('curate-pending-add');
          th.style.display = curatedFilterActive && !isCurated ? 'none' : '';
        });
        // Force re-layout since visible set changed
        const g = document.querySelector('#pane-album-detail .photo-grid');
        if (g) runJustifiedLayout(g);
        filterBtn.style.background = curatedFilterActive ? 'var(--color-gold)' : 'transparent';
        filterBtn.style.color      = curatedFilterActive ? '#000' : 'var(--color-muted)';
        filterBtn.style.borderColor = curatedFilterActive ? 'var(--color-gold)' : 'var(--color-border)';
        filterBtn.textContent = curatedFilterActive ? 'Show all photos' : 'Show curated only';
      }
      filterBtn._applyFilter = applyCuratedFilter;
      filterBtn.addEventListener('click', () => {
        curatedFilterActive = !curatedFilterActive;
        applyCuratedFilter();
      });

      legend.innerHTML = `
        <span style="display:flex;align-items:center;gap:0.45rem">
          <span style="display:inline-flex;align-items:center;gap:3px;background:rgba(0,0,0,0.75);color:#e85d6e;padding:2px 7px;border-radius:10px;font-size:0.65rem">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="#e85d6e" stroke="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </span>
          Hearted by friends
        </span>
        <span style="display:flex;align-items:center;gap:0.45rem">
          <span style="display:inline-flex;align-items:center;justify-content:center;background:var(--color-gold);border-radius:50%;width:18px;height:18px">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="white" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </span>
          In curated set — click ★ to toggle
        </span>
        <span style="display:flex;align-items:center;gap:0.45rem">
          <span style="display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.9);border:1.5px solid rgba(0,0,0,0.2);border-radius:4px;width:18px;height:18px">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
          Hover + click checkbox to mark for deletion
        </span>
      `;
      legend.appendChild(filterBtn);
      container.appendChild(legend);

      // Grid wrapper — class album-section + data-album-id so existing savePendingCurated queries work
      const wrapper = document.createElement('div');
      wrapper.className = 'album-section';
      wrapper.dataset.albumId = album.id;
      wrapper.style.cssText = 'border-bottom:none;margin-bottom:0';

      const grid = document.createElement('div');
      grid.className = 'photo-grid';
      grid.style.position = 'relative';
      wrapper.appendChild(grid);
      container.appendChild(wrapper);

      // Lazy-load images as they scroll into view (same pattern as original accordion)
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          const img = entry.target.querySelector('img');
          if (img && img.dataset.src) {
            const src = img.dataset.src;
            delete img.dataset.src;
            img.addEventListener('load',  () => { img.classList.add('loaded'); runJustifiedLayout(grid); }, { once: true });
            img.addEventListener('error', () => { img.src = src; }, { once: true }); // fallback to full URL
            img.src = gridUrl(src);
          }
          observer.unobserve(entry.target);
        });
      }, { rootMargin: '300px' });

      allPhotos.forEach(url => {
        const thumb = document.createElement('div');
        thumb.className = 'photo-thumb' + (curatedSet.has(url) ? ' is-curated' : '');
        thumb.dataset.url = url;

        // Image — deferred src; click → lightbox
        const img = document.createElement('img');
        img.alt = ''; img.decoding = 'async';
        img.dataset.src = url; // loaded by observer
        img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in';
        img.addEventListener('click', (e) => { e.stopPropagation(); openLightbox(url, allPhotos); });

        checkEl.className = 'thumb-check';
        checkEl.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>`;
        checkEl.addEventListener('click', (e) => { e.stopPropagation(); toggleThumb(thumb, url); });

        // Heart count badge (top-right)
        const hearts = heartMap.get(url) || 0;
        if (hearts > 0) {
          const hBadge = document.createElement('div');
          hBadge.style.cssText = 'position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.75);color:#e85d6e;font-size:0.65rem;padding:2px 7px;border-radius:10px;display:flex;align-items:center;gap:3px;pointer-events:none;z-index:3';
          hBadge.innerHTML = `<svg width="9" height="9" viewBox="0 0 24 24" fill="#e85d6e" stroke="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> ${hearts}`;
          thumb.appendChild(hBadge);
        }

        // Curated star badge (bottom-right — solid gold if curated, faint on hover for adding)
        if (curatedSet.has(url)) {
          const badge = makeCuratedBadge();
          badge.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleCurated(thumb, url, album.id, curatedSet);
          });
          thumb.appendChild(badge);
        }
        const addBadge = makeCurateAddBadge();
        addBadge.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleCurated(thumb, url, album.id, curatedSet);
        });
        thumb.appendChild(addBadge);

        thumb.appendChild(img);
        thumb.appendChild(overlay);
        thumb.appendChild(checkEl);
        grid.appendChild(thumb);
        observer.observe(thumb);
      });

      // Run layout once after first paint so grid.offsetWidth is non-zero
      requestAnimationFrame(() => {
        bindAdminGridLayout(grid);
        runJustifiedLayout(grid);
      });
      window.addEventListener('resize', () => runJustifiedLayout(grid), { passive: true });
    }

    // ── Render (directory list) ───────────────────────────────────────────────
    function renderAlbums() {
      const container = document.getElementById('album-list');
      container.innerHTML = '';

      const leafAlbums = ALBUMS.filter(a =>
        a.type !== 'group' &&
        a.albumKind !== 'film-roll' &&
        getAlbumAllPhotos(a).some(p => !p.endsWith('.svg'))
      );

      if (!leafAlbums.length) {
        container.innerHTML = '<p style="color:var(--color-muted);font-size:0.85rem">No albums with photos found.</p>';
        return;
      }

      function makeRow(album, indented = false) {
        const photos       = getAlbumAllPhotos(album).filter(u => !u.endsWith('.svg'));
        const curatedCount = Array.isArray(album.curated) ? album.curated.length : 0;
        const count        = photos.length;
        const curatedStyle = curatedCount === 0
          ? 'color:var(--color-muted);opacity:0.55'
          : 'color:var(--color-gold)';
        const curatedLabel = curatedCount === 0 ? 'no curated set' : `${curatedCount} curated`;
        const row = document.createElement('div');
        row.className = 'album-row' + (indented ? ' indented' : '');
        row.innerHTML = `
          <span class="album-row-title">${album.title}</span>
          <span class="album-row-meta">
            ${count} photo${count !== 1 ? 's' : ''} · <span style="${curatedStyle}">${curatedLabel}</span>
          </span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="album-row-chevron" aria-hidden="true">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        `;
        row.addEventListener('click', () => openAlbumDetail(album));
        return row;
      }

      function sectionHeading(label) {
        const el = document.createElement('div');
        el.className = 'album-section-heading';
        el.textContent = label;
        return el;
      }

      function groupHeading(label) {
        const el = document.createElement('div');
        el.className = 'album-group-heading';
        el.textContent = label;
        return el;
      }

      // ── Family albums ──────────────────────────────────────────────────────
      const familyAlbums = leafAlbums.filter(a => String(a.audience || '').startsWith('family'));
      if (familyAlbums.length) {
        container.appendChild(sectionHeading('Family'));
        // Group by year (extracted from id or title)
        const byYear = {};
        familyAlbums.forEach(a => {
          const m = (a.id + ' ' + a.title).match(/20\d\d/);
          const yr = m ? m[0] : 'Other';
          (byYear[yr] = byYear[yr] || []).push(a);
        });
        Object.keys(byYear).sort().forEach(yr => {
          container.appendChild(groupHeading(yr));
          byYear[yr].forEach(a => container.appendChild(makeRow(a, true)));
        });
      }

      // ── Public / Friends albums ────────────────────────────────────────────
      const publicAlbums = leafAlbums.filter(a => !String(a.audience || '').startsWith('family'));
      if (publicAlbums.length) {
        container.appendChild(sectionHeading('Public · Friends'));

        // Build parent → children map from group albums
        const groupMap = {};
        ALBUMS.filter(a => a.type === 'group').forEach(g => {
          (g.subAlbums || []).forEach(childId => { groupMap[childId] = g; });
        });

        // Separate top-level (no parent group) from children
        const topLevel  = publicAlbums.filter(a => !groupMap[a.id]);
        const childIds  = new Set(publicAlbums.filter(a => groupMap[a.id]).map(a => a.id));

        // Group top-level by year
        const byYear = {};
        topLevel.forEach(a => {
          const m = (a.id + ' ' + a.title).match(/20\d\d/);
          const yr = m ? m[0] : 'Other';
          (byYear[yr] = byYear[yr] || []).push(a);
        });

        // Also collect group albums that have children in leafAlbums
        const usedGroups = new Set();
        publicAlbums.filter(a => groupMap[a.id]).forEach(a => {
          const g = groupMap[a.id];
          const m = (g.id + ' ' + g.title).match(/20\d\d/);
          const yr = m ? m[0] : 'Other';
          if (!usedGroups.has(g.id)) {
            usedGroups.add(g.id);
            (byYear[yr] = byYear[yr] || [])._groups = (byYear[yr]._groups || new Map());
            byYear[yr]._groups.set(g.id, { group: g, children: [] });
          }
          byYear[yr]._groups.get(g.id).children.push(a);
        });

        Object.keys(byYear).sort().reverse().forEach(yr => {
          container.appendChild(groupHeading(yr));
          // Render standalone albums for this year
          (byYear[yr] || []).forEach(a => container.appendChild(makeRow(a)));
          // Render grouped albums (e.g. Italy → Venice, Florence…)
          (byYear[yr]._groups || new Map()).forEach(({ group, children }) => {
            const subHeading = document.createElement('div');
            subHeading.className = 'album-group-heading';
            subHeading.style.paddingLeft = '0';
            subHeading.style.opacity = '0.75';
            subHeading.textContent = group.title;
            container.appendChild(subHeading);
            children.forEach(a => container.appendChild(makeRow(a, true)));
          });
        });
      }
    }

    // ── Commit Deletions ─────────────────────────────────────────────────────
    async function commitDeletions() {
      if (selected.size === 0) return;

      const confirmMsg = `Permanently delete ${selected.size} photo${selected.size !== 1 ? 's' : ''} from R2 and remove from config.js?\n\nThis cannot be undone.`;
      if (!confirm(confirmMsg)) return;

      const btn = document.getElementById('commit-btn');
      btn.textContent = 'Deleting…'; btn.disabled = true;

      try {
        const res = await fetch('/api/admin-delete', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ urls: Array.from(selected) }),
        });

        const data = await res.json();

        if (!res.ok) {
          showToast(`Error: ${data.error || res.statusText}`);
          btn.textContent = 'Commit Deletions'; btn.disabled = false;
          return;
        }

        const { deleted, deleteFailed, configUpdated, configError } = data;
        let msg = `Deleted ${deleted.length} photo${deleted.length !== 1 ? 's' : ''} from R2.`;
        if (deleteFailed.length > 0) msg += ` ${deleteFailed.length} failed.`;
        if (configUpdated) msg += ' config.js updated — Vercel redeploying.';
        if (configError) msg += ` Config note: ${configError}`;

        showToast(msg, 6000);
        clearSelection();

        // Remove deleted thumbs from DOM
        deleted.forEach(key => {
          const url = `https://pub-d6285edfbb3747a9bbfc77b32aac2baa.r2.dev/${key}`;
          const thumb = document.querySelector(`.photo-thumb[data-url="${CSS.escape(url)}"]`) ||
                        document.querySelector(`.photo-thumb[data-url="${url}"]`);
          if (thumb) thumb.remove();
        });

      } catch (err) {
        showToast(`Request failed: ${err.message}`);
      }

      btn.textContent = 'Commit Deletions';
      btn.disabled = selected.size === 0;
    }


    // ── Tab switching ─────────────────────────────────────────────────────────
    function switchTab(tab) {
      document.getElementById('pane-albums').style.display = tab === 'albums' ? '' : 'none';
      document.getElementById('pane-codes').style.display  = tab === 'codes'  ? '' : 'none';
      document.getElementById('tab-albums').classList.toggle('active', tab === 'albums');
      document.getElementById('tab-codes').classList.toggle('active', tab === 'codes');
      if (tab === 'codes') loadCodesList();
    }

    // ── Toast ────────────────────────────────────────────────────────────────
    function showToast(msg, duration = 4000) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), duration);
    }

    function toggleThumb(thumb, url) {
      if (thumb.classList.toggle('marked')) {
        selected.add(url);
      } else {
        selected.delete(url);
      }
      updateToolbar();
    }

    // ── Lightbox ─────────────────────────────────────────────────────────────
    let lbPhotos = [];   // full-res URL list for current album
    let lbIndex  = 0;   // current position

    function openLightbox(url, albumPhotos) {
      lbPhotos = albumPhotos || [url];
      lbIndex  = lbPhotos.indexOf(url);
      if (lbIndex < 0) lbIndex = 0;
      document.getElementById('admin-lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
      lbShow();
    }

    function lbShow() {
      const lb  = document.getElementById('admin-lightbox');
      const img = document.getElementById('alb-img');
      const url = lbPhotos[lbIndex];

      lb.classList.add('loading');
      img.classList.remove('loaded');
      img.onload = () => { img.classList.add('loaded'); lb.classList.remove('loading'); };
      img.onerror = () => { lb.classList.remove('loading'); };
      img.src = url;
      if (img.complete && img.naturalWidth) { img.classList.add('loaded'); lb.classList.remove('loading'); }

      // Counter
      document.getElementById('alb-counter').textContent =
        lbPhotos.length > 1 ? `${lbIndex + 1} / ${lbPhotos.length}` : '';

      // Prev / Next
      document.getElementById('alb-prev').disabled = lbIndex === 0;
      document.getElementById('alb-next').disabled = lbIndex === lbPhotos.length - 1;

      // Preload adjacent images (2 before, 2 after)
      [-2, -1, 1, 2].forEach(offset => {
        const i = lbIndex + offset;
        if (i >= 0 && i < lbPhotos.length) {
          const pre = new Image();
          pre.src = lbPhotos[i];
        }
      });

      // Mark button state
      lbSyncMark();
    }

    function lbSyncMark() {
      const btn = document.getElementById('alb-mark');
      const isMarked = selected.has(lbPhotos[lbIndex]);
      btn.textContent = isMarked ? '✕ Marked for deletion' : 'Mark for deletion';
      btn.classList.toggle('marked', isMarked);
    }

    function lbNav(dir) {
      const next = lbIndex + dir;
      if (next < 0 || next >= lbPhotos.length) return;
      lbIndex = next;
      lbShow();
    }

    function lbToggleMark() {
      const url   = lbPhotos[lbIndex];
      const thumb = document.querySelector(`.photo-thumb[data-url="${CSS.escape(url)}"]`) ||
                    document.querySelector(`.photo-thumb[data-url="${url}"]`);
      if (thumb) {
        toggleThumb(thumb, url);
      } else {
        // curation photos have no thumb — toggle directly
        if (selected.has(url)) selected.delete(url); else selected.add(url);
        updateToolbar();
      }
      lbSyncMark();
    }

    function lbCopyUrl() {
      const url = lbPhotos[lbIndex];
      if (!url) return;
      navigator.clipboard.writeText(url).then(() => {
        const btn = document.getElementById('alb-copy-url');
        btn.textContent = '✓ Copied';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy URL'; btn.classList.remove('copied'); }, 2000);
      }).catch(() => {
        showToast('Copy failed — check browser permissions.');
      });
    }

    function lbClose() {
      document.getElementById('admin-lightbox').classList.remove('open');
      document.body.style.overflow = '';
      const img = document.getElementById('alb-img');
      img.onload = null; img.onerror = null; img.src = '';
      img.classList.remove('loaded');
      document.getElementById('admin-lightbox').classList.remove('loading');
    }

    // Close on backdrop click
    document.getElementById('admin-lightbox').addEventListener('click', e => {
      if (e.target === document.getElementById('admin-lightbox')) lbClose();
    });

    document.addEventListener('keydown', e => {
      if (!document.getElementById('admin-lightbox').classList.contains('open')) return;
      if (e.key === 'Escape')      { lbClose(); }
      else if (e.key === 'ArrowLeft')  { lbNav(-1); }
      else if (e.key === 'ArrowRight') { lbNav(1); }
      else if (e.key === 'd' || e.key === 'D') { lbToggleMark(); }
    });

    // ── Access codes ──────────────────────────────────────────────────────────

    async function loadCodesList() {
      const el = document.getElementById('codes-list');
      el.innerHTML = '<p style="font-size:0.8rem;color:var(--color-muted)">Loading...</p>';
      const resp = await fetch('/api/admin-access-codes');
      if (!resp.ok) { el.innerHTML = '<p style="color:red;font-size:0.8rem">Failed to load codes.</p>'; return; }
      const { codes } = await resp.json();
      if (!codes.length) { el.innerHTML = '<p style="font-size:0.8rem;color:var(--color-muted)">No codes yet.</p>'; return; }
      el.innerHTML = `
        <table style="width:100%;border-collapse:collapse;font-size:0.78rem">
          <thead>
            <tr style="border-bottom:1px solid var(--color-border);color:var(--color-muted)">
              <th style="text-align:left;padding:0.5rem 0.75rem;font-weight:400;letter-spacing:0.08em;text-transform:uppercase">Label</th>
              <th style="text-align:left;padding:0.5rem 0.75rem;font-weight:400;letter-spacing:0.08em;text-transform:uppercase">Audience</th>
              <th style="text-align:left;padding:0.5rem 0.75rem;font-weight:400;letter-spacing:0.08em;text-transform:uppercase">Created</th>
              <th style="text-align:left;padding:0.5rem 0.75rem;font-weight:400;letter-spacing:0.08em;text-transform:uppercase">Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${codes.map(c => `
              <tr id="code-row-${c.id}" style="border-bottom:1px solid var(--color-border);${c.revoked ? 'opacity:0.4' : ''}">
                <td style="padding:0.6rem 0.75rem">${escHtml(c.label)}</td>
                <td style="padding:0.6rem 0.75rem;font-family:monospace">${escHtml(c.audience)}</td>
                <td style="padding:0.6rem 0.75rem;color:var(--color-muted)">${c.created_at.slice(0,10)}</td>
                <td style="padding:0.6rem 0.75rem">${c.revoked ? '<span style="color:var(--color-muted)">Revoked</span>' : '<span style="color:#4caf50">Active</span>'}</td>
                <td style="padding:0.6rem 0.75rem;text-align:right">
                  ${!c.revoked ? `<button class="btn-ghost" style="font-size:0.7rem;color:var(--color-muted)" onclick="revokeCode(${c.id})">Revoke</button>` : ''}
                </td>
              </tr>`).join('')}
          </tbody>
        </table>`;
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function createCode() {
      const label    = document.getElementById('code-label').value.trim();
      const audience = document.getElementById('code-audience').value.trim();
      const code     = document.getElementById('code-value').value.trim();
      const status   = document.getElementById('code-create-status');

      if (!label || !audience || !code) { status.textContent = 'Fill in all fields.'; return; }
      if (code.length < 8) { status.textContent = 'Code must be at least 8 characters.'; return; }

      status.textContent = 'Creating…';
      const resp = await fetch('/api/admin-access-codes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ label, audience, code }),
      });
      const data = await resp.json();
      if (!resp.ok) { status.textContent = `Error: ${data.error}`; return; }

      // Show the code once, then clear the field
      status.innerHTML = `✓ Created. <strong>Send this code — it won't be shown again:</strong> <code style="user-select:all;font-size:0.9em;background:var(--color-surface);padding:0.1em 0.4em">${escHtml(code)}</code>`;
      document.getElementById('code-label').value = '';
      document.getElementById('code-value').value = '';
      loadCodesList();
    }

    async function revokeCode(id) {
      if (!confirm('Revoke this code? Anyone using it will lose access immediately.')) return;
      const resp = await fetch(`/api/admin-access-codes?id=${id}`, { method: 'DELETE' });
      if (resp.ok) loadCodesList();
      else alert('Revoke failed — see console.');
    }

  </script>
</body>
</html>
