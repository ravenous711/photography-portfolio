<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Admin — Raveen Fernando</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css" />
  <script>tailwind.config = { theme: { extend: { colors: { gold: '#c9a96e' } } } }</script>
  <script src="/js/justified-layout.js"></script>
  <style>
    /* ── Auth screen ── */
    #auth-screen {
      position: fixed; inset: 0; z-index: 900;
      background: var(--color-bg);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; padding: 2rem; text-align: center;
    }
    #auth-screen.hidden { display: none; }

    /* ── Toolbar ── */
    #toolbar {
      position: sticky; top: 0; z-index: 100;
      background: var(--nav-scrolled-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--color-border);
      padding: 0.75rem 1.5rem;
      display: flex; align-items: center; gap: 1rem;
      flex-wrap: wrap;
    }

    /* ── Photo grid ── */
    .photo-grid {
      position: relative;
      padding-bottom: 1.25rem;
    }
    .photo-thumb {
      position: absolute; cursor: pointer;
      border: 2px solid transparent;
      border-radius: 2px;
      overflow: hidden;
      transition: border-color 0.15s;
      background: var(--color-surface);
    }
    .photo-thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.15s;
    }
    .photo-thumb .mark-overlay {
      position: absolute; inset: 0;
      background: rgba(220, 38, 38, 0.7);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.15s;
      pointer-events: none;
    }
    .photo-thumb.marked {
      border-color: rgb(220, 38, 38);
    }
    .photo-thumb.marked .mark-overlay { opacity: 1; }
    .photo-thumb.marked img { opacity: 0.4; }

    /* ── Selection checkbox corner ── */
    .thumb-check {
      position: absolute; top: 7px; left: 7px; z-index: 2;
      width: 28px; height: 28px;
      background: rgba(255,255,255,0.9);
      border: 1.5px solid rgba(0,0,0,0.2);
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .photo-thumb:hover .thumb-check,
    .photo-thumb.marked .thumb-check { opacity: 1; }
    .photo-thumb.marked .thumb-check {
      background: rgb(220,38,38);
      border-color: rgb(220,38,38);
    }
    .thumb-check svg { display: none; }
    .photo-thumb.marked .thumb-check svg { display: block; }

    /* ── Album section ── */
    .album-section { margin-bottom: 1rem; border-bottom: 1px solid var(--color-border); }
    .album-header {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.9rem 0;
      cursor: pointer;
      user-select: none;
    }
    .album-header:hover h2 { opacity: 0.7; }
    .album-header h2 {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      margin: 0;
      color: var(--color-text);
      transition: opacity 0.15s;
      flex: 1;
    }
    .album-header .album-meta {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-muted);
    }
    .album-header .chevron {
      width: 16px; height: 16px;
      color: var(--color-muted);
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .album-section.open .chevron { transform: rotate(180deg); }
    .album-body {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.3s ease;
    }
    .album-section.open .album-body { max-height: 99999px; }

    /* ── Buttons ── */
    .btn-danger {
      background: rgb(220, 38, 38);
      color: white;
      border: none;
      padding: 0.5rem 1.25rem;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s;
      border-radius: 2px;
    }
    .btn-danger:hover { opacity: 0.85; }
    .btn-danger:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-ghost {
      background: transparent;
      color: var(--color-muted);
      border: 1px solid var(--color-border);
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      border-radius: 2px;
    }
    .btn-ghost:hover { color: var(--color-text); border-color: var(--color-text); }

    /* ── Admin Lightbox ── */
    #admin-lightbox {
      position: fixed; inset: 0; z-index: 900;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.96);
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease;
    }
    #admin-lightbox.open { opacity: 1; pointer-events: all; }

    #alb-img {
      max-width: min(88vw, 1400px); max-height: 82vh;
      object-fit: contain; display: block;
      opacity: 0; transition: opacity 0.2s ease;
      user-select: none; pointer-events: none;
    }
    #alb-img.loaded { opacity: 1; }
    #alb-spinner {
      position: absolute;
      width: 28px; height: 28px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: rgba(255,255,255,0.6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    #admin-lightbox.loading #alb-spinner { display: block; }
    #admin-lightbox.loading #alb-img { opacity: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #alb-close {
      position: absolute; top: 1.25rem; right: 1.5rem; z-index: 2;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.75); width: 40px; height: 40px; border-radius: 50%;
      font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    #alb-close:hover { background: rgba(255,255,255,0.18); color: white; }

    .alb-nav {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.75); width: 52px; height: 52px; border-radius: 50%;
      font-size: 1.6rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .alb-nav:hover { background: rgba(255,255,255,0.2); color: white; }
    .alb-nav[disabled] { opacity: 0.2; cursor: default; pointer-events: none; }
    #alb-prev { left: 1.25rem; }
    #alb-next { right: 1.25rem; }

    #alb-footer {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 2;
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; padding: 1.25rem 1.5rem;
      background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 100%);
      flex-wrap: wrap;
    }
    #alb-counter {
      font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(255,255,255,0.4); flex-shrink: 0;
    }
    #alb-mark {
      font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.22); background: transparent;
      color: rgba(255,255,255,0.65); padding: 0.4rem 1rem; border-radius: 2px;
      cursor: pointer; transition: all 0.15s; flex-shrink: 0;
    }
    #alb-mark:hover { border-color: #ef4444; color: #f87171; }
    #alb-mark.marked { background: rgba(220,38,38,0.2); border-color: #ef4444; color: #f87171; }
    #alb-copy-url {
      font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.22); background: transparent;
      color: rgba(255,255,255,0.65); padding: 0.4rem 1rem; border-radius: 2px;
      cursor: pointer; transition: all 0.15s; flex-shrink: 0;
    }
    #alb-copy-url:hover { border-color: rgba(255,255,255,0.5); color: white; }
    #alb-copy-url.copied { border-color: #22c55e; color: #4ade80; }
    #alb-hint {
      font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(255,255,255,0.22); text-align: right;
    }
    @media (max-width: 640px) { #alb-hint { display: none; } }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      background: var(--color-text); color: var(--color-bg);
      padding: 0.75rem 1.5rem;
      font-size: 0.8rem; letter-spacing: 0.06em;
      border-radius: 2px; z-index: 500;
      opacity: 0; transition: opacity 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    /* ── Tab active state ── */
    .tab-btn.active {
      color: var(--color-text);
      border-color: var(--color-text);
    }

    /* ── Curation results ── */
    .curation-album { margin-bottom: 2.5rem; }
    .curation-album h2 {
      font-family: var(--font-serif);
      font-size: 1.25rem; font-weight: 300;
      letter-spacing: 0.04em;
      margin: 0 0 0.15rem;
      color: var(--color-text);
    }
    .curation-album .curate-link {
      font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--color-gold); text-decoration: none;
    }
    .curation-album .curate-link:hover { text-decoration: underline; }
    .curation-photo-row {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--color-border);
      cursor: pointer;
    }
    .curation-photo-row:hover { background: var(--color-surface); margin: 0 -0.5rem; padding: 0.5rem 0.5rem; }
    .curation-photo-row img {
      width: 52px; height: 52px;
      object-fit: cover; border-radius: 2px; flex-shrink: 0;
      opacity: 0; transition: opacity 0.3s;
    }
    .curation-photo-row img.loaded { opacity: 1; }
    .curation-photo-row .vote-bars { flex: 1; }
    .vote-bar-label {
      display: flex; justify-content: space-between;
      font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 4px;
    }
    .vote-bar-track {
      height: 4px; background: var(--color-border);
      border-radius: 2px; overflow: hidden; margin-bottom: 3px;
    }
    .vote-bar-keep { height: 100%; background: #22c55e; border-radius: 2px; }
    .vote-bar-cut  { height: 100%; background: #ef4444; border-radius: 2px; }
    .curation-select-check {
      width: 18px; height: 18px; flex-shrink: 0;
      accent-color: #ef4444; cursor: pointer;
    }
    .select-all-row {
      display: flex; align-items: center; gap: 0.5rem;
      margin-bottom: 0.75rem;
      font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--color-muted);
    }
    .no-votes { font-size: 0.82rem; color: var(--color-muted); padding: 0.5rem 0; }
  </style>
</head>
<body class="overflow-x-hidden">

  <!-- ── Auth Screen ── -->
  <div id="auth-screen">
    <p style="font-size:0.72rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--color-muted);margin-bottom:0.75rem">Admin Access</p>
    <p style="font-family:var(--font-serif);font-size:2rem;font-weight:300;letter-spacing:0.08em;margin-bottom:2.5rem" id="auth-site-name">–</p>
    <form id="auth-form" novalidate style="width:100%;max-width:320px">
      <input id="auth-input" type="password" placeholder="Admin password"
        autocomplete="current-password"
        style="width:100%;background:var(--color-surface);border:1px solid var(--color-border);color:var(--color-text);padding:0.75rem 1rem;margin-bottom:0.5rem;font-family:var(--font-sans);font-size:0.9rem;letter-spacing:0.1em;text-align:center;outline:none;transition:border-color 0.2s;border-radius:2px"
        onfocus="this.style.borderColor='var(--color-text)'"
        onblur="this.style.borderColor='var(--color-border)'"
      />
      <p id="auth-error" style="color:#f87171;font-size:0.8rem;min-height:1.2rem;margin-bottom:0.5rem;text-align:center"></p>
      <button type="submit" style="width:100%;background:var(--color-text);color:var(--color-bg);border:none;padding:0.75rem;font-family:var(--font-sans);font-size:0.8rem;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;transition:opacity 0.2s;border-radius:2px" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">
        Enter
      </button>
    </form>
  </div>

  <!-- ── Main Admin UI (hidden until auth) ── -->
  <div id="admin-ui" style="display:none">

    <!-- ── Toolbar ── -->
    <div id="toolbar">
      <span style="font-family:var(--font-serif);font-size:1.1rem;letter-spacing:0.06em;color:var(--color-text);flex:1">Admin</span>
      <!-- Tab switcher -->
      <button class="btn-ghost tab-btn active" id="tab-albums" onclick="switchTab('albums')">Albums</button>
      <button class="btn-ghost tab-btn" id="tab-curation" onclick="switchTab('curation')">Curation</button>
      <span id="selection-count" style="font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-muted)">0 selected</span>
      <button class="btn-ghost" onclick="clearSelection()">Clear</button>
      <button class="btn-danger" id="commit-btn" disabled onclick="commitDeletions()">Commit Deletions</button>
    </div>

    <!-- ── Albums tab ── -->
    <main id="pane-albums" style="padding: 2rem 1.5rem 4rem">
      <div id="album-list"></div>
    </main>

    <!-- ── Curation tab ── -->
    <main id="pane-curation" style="display:none; padding: 2rem 1.5rem 4rem">
      <div id="curate-share-links" style="margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--color-border)">
        <p style="font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-muted);margin:0 0 0.75rem">Share curate links</p>
        <div id="curate-share-list"></div>
      </div>
      <div id="curation-list">
        <p style="color:var(--color-muted);font-size:0.85rem">Loading vote data…</p>
      </div>
    </main>

  </div>

  <!-- ── Admin Lightbox ── -->
  <div id="admin-lightbox" role="dialog" aria-modal="true">
    <button id="alb-close" aria-label="Close" onclick="lbClose()">✕</button>
    <button class="alb-nav" id="alb-prev" aria-label="Previous" onclick="lbNav(-1)">‹</button>

    <div style="position:relative;display:flex;align-items:center;justify-content:center;">
      <img id="alb-img" alt="" />
      <div id="alb-spinner"></div>
    </div>

    <button class="alb-nav" id="alb-next" aria-label="Next" onclick="lbNav(1)">›</button>

    <div id="alb-footer">
      <span id="alb-counter"></span>
      <button id="alb-mark" onclick="lbToggleMark()">Mark for deletion</button>
      <button id="alb-copy-url" onclick="lbCopyUrl()">Copy URL</button>
      <span id="alb-hint">← → navigate &nbsp;·&nbsp; D mark &nbsp;·&nbsp; Esc close</span>
    </div>
  </div>

  <!-- ── Toast notification ── -->
  <div id="toast"></div>

  <script src="/js/config.js"></script>
  <script src="/js/routes.js"></script>
  <script src="/js/main.js"></script>
  <script>
    const R2_BASE_PATTERN = /^https:\/\/pub-[a-f0-9]+\.r2\.dev\//;

    function gridUrl(fullUrl) {
      const m = fullUrl.match(/^(https:\/\/pub-[a-f0-9]+\.r2\.dev\/)(.+)$/);
      return m ? `${m[1]}grid/${m[2]}` : fullUrl;
    }
    function thumbUrl(fullUrl) { return gridUrl(fullUrl); }

    // ── Auth ────────────────────────────────────────────────────────────────
    document.getElementById('auth-site-name').textContent = SITE_CONFIG.photographerName;

    const SESSION_KEY = 'admin_unlocked';

    async function hashPassword(pw) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    if (sessionStorage.getItem(SESSION_KEY) === 'true') {
      showAdminUI();
    }

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('auth-input').value.trim();
      if (!pw) return;
      const btn = e.target.querySelector('button');
      btn.textContent = 'Checking…'; btn.disabled = true;

      const hash = await hashPassword(pw);
      if (hash === SITE_CONFIG.adminPasswordHash) {
        sessionStorage.setItem(SESSION_KEY, 'true');
        showAdminUI();
      } else {
        document.getElementById('auth-error').textContent = 'Incorrect password.';
        const input = document.getElementById('auth-input');
        input.value = '';
        input.style.animation = 'shake 0.4s ease';
        input.addEventListener('animationend', () => { input.style.animation = ''; }, { once: true });
        btn.textContent = 'Enter'; btn.disabled = false;
      }
    });

    function showAdminUI() {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('admin-ui').style.display = 'block';
      renderAlbums();
    }

    // ── Selection state ──────────────────────────────────────────────────────
    const selected = new Set();

    function updateToolbar() {
      const count = selected.size;
      document.getElementById('selection-count').textContent =
        count === 0 ? '0 selected' : `${count} photo${count !== 1 ? 's' : ''} selected`;
      document.getElementById('commit-btn').disabled = count === 0;
    }

    function clearSelection() {
      selected.clear();
      document.querySelectorAll('.photo-thumb.marked').forEach(el => el.classList.remove('marked'));
      updateToolbar();
    }

    // ── Justified layout (mirrors album page) ────────────────────────────────
    function runJustifiedLayout(grid) {
      const items = Array.from(grid.querySelectorAll('.photo-thumb'));
      if (!items.length) { grid.style.height = '0px'; return; }
      const containerWidth = grid.offsetWidth;
      if (!containerWidth) return;
      const aspectRatios = items.map(item => {
        const img = item.querySelector('img');
        if (img && img.naturalWidth && img.naturalHeight) return img.naturalWidth / img.naturalHeight;
        return 1.5;
      });
      const layout = justifiedLayout(aspectRatios, {
        containerWidth,
        targetRowHeight: window.innerWidth <= 640 ? 200 : window.innerWidth <= 1024 ? 280 : 420,
        boxSpacing: window.innerWidth <= 640 ? 6 : 12,
        containerPadding: 0,
      });
      grid.style.height = layout.containerHeight + 'px';
      items.forEach((item, i) => {
        const box = layout.boxes[i];
        item.style.left   = box.left   + 'px';
        item.style.top    = box.top    + 'px';
        item.style.width  = box.width  + 'px';
        item.style.height = box.height + 'px';
      });
    }

    function bindAdminGridLayout(grid) {
      runJustifiedLayout(grid);
      grid.querySelectorAll('img').forEach(img => {
        if (img.complete && img.naturalWidth) runJustifiedLayout(grid);
        else img.addEventListener('load', () => runJustifiedLayout(grid));
      });
    }

    // ── Render ───────────────────────────────────────────────────────────────
    function renderAlbums() {
      const container = document.getElementById('album-list');

      // Flatten all albums with actual photos (digital + all film sections, skip groups/placeholders)
      const leafAlbums = ALBUMS.filter(a =>
        a.type !== 'group' &&
        getAlbumAllPhotos(a).some(p => !p.endsWith('.svg'))
      );

      if (leafAlbums.length === 0) {
        container.innerHTML = '<p style="color:var(--color-muted);font-size:0.85rem">No albums with photos found.</p>';
        return;
      }

      leafAlbums.forEach(album => {
        const photos = getAlbumAllPhotos(album).filter(u => !u.endsWith('.svg'));
        const badge = album.hidden ? ' · Hidden' : album.protected ? ' · Protected' : '';
        const count = photos.length;

        const section = document.createElement('div');
        section.className = 'album-section';

        // Header (clickable)
        const header = document.createElement('div');
        header.className = 'album-header';
        header.innerHTML = `
          <h2>${album.title}</h2>
          <span class="album-meta">${count} photo${count !== 1 ? 's' : ''}${badge}</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        `;

        // Body (collapsible)
        const body = document.createElement('div');
        body.className = 'album-body';
        const grid = document.createElement('div');
        grid.className = 'photo-grid';
        body.appendChild(grid);

        section.appendChild(header);
        section.appendChild(body);
        container.appendChild(section);

        let imagesLoaded = false;

        function loadImages() {
          if (imagesLoaded) return;
          imagesLoaded = true;

          const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              if (!entry.isIntersecting) return;
              const img = entry.target.querySelector('img');
              if (img && img.dataset.src) {
                const original = img.dataset.src;
                delete img.dataset.src;
                img.addEventListener('load', () => {
                  img.classList.add('loaded');
                  runJustifiedLayout(grid);
                }, { once: true });
                img.addEventListener('error', () => { img.src = original; }, { once: true });
                img.src = thumbUrl(original);
              }
              observer.unobserve(entry.target);
            });
          }, { rootMargin: '200px' }); // start loading 200px before entering view

          photos.forEach(url => {
            const thumb = document.createElement('div');
            thumb.className = 'photo-thumb';
            thumb.dataset.url = url;

            const img = document.createElement('img');
            img.alt = '';
            img.decoding = 'async';
            img.dataset.src = url; // deferred — set by observer

            const overlay = document.createElement('div');
            overlay.className = 'mark-overlay';
            overlay.innerHTML = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;

            // Corner checkbox for deletion
            const checkEl = document.createElement('div');
            checkEl.className = 'thumb-check';
            checkEl.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>`;

            thumb.appendChild(img);
            thumb.appendChild(overlay);
            thumb.appendChild(checkEl);
            grid.appendChild(thumb);
            observer.observe(thumb);

            img.style.cursor = 'zoom-in';

            // Click image → lightbox (pass full album photo list for nav)
            img.addEventListener('click', (e) => { e.stopPropagation(); openLightbox(url, photos); });

            // Click checkbox corner → toggle selection; click elsewhere on card → toggle selection
            checkEl.addEventListener('click', (e) => { e.stopPropagation(); toggleThumb(thumb, url); });
            thumb.addEventListener('click', (e) => { if (e.target !== img) toggleThumb(thumb, url); });
          });

          bindAdminGridLayout(grid);
        }

        header.addEventListener('click', () => {
          section.classList.toggle('open');
          if (section.classList.contains('open')) loadImages();
        });
      });

      window.addEventListener('resize', () => {
        document.querySelectorAll('#album-list .photo-grid').forEach(runJustifiedLayout);
      }, { passive: true });
    }

    // ── Commit Deletions ─────────────────────────────────────────────────────
    async function commitDeletions() {
      if (selected.size === 0) return;

      const confirmMsg = `Permanently delete ${selected.size} photo${selected.size !== 1 ? 's' : ''} from R2 and remove from config.js?\n\nThis cannot be undone.`;
      if (!confirm(confirmMsg)) return;

      const btn = document.getElementById('commit-btn');
      btn.textContent = 'Deleting…'; btn.disabled = true;

      const pw = sessionStorage.getItem('_admin_pw_hash');

      // Re-hash is stored separately below; we need the hash to send to the API.
      // Prompt for password to re-derive hash (we don't store the plaintext).
      const rawPw = prompt('Re-enter admin password to confirm:');
      if (!rawPw) { btn.textContent = 'Commit Deletions'; btn.disabled = false; return; }

      const passwordHash = await hashPassword(rawPw);
      if (passwordHash !== SITE_CONFIG.adminPasswordHash) {
        showToast('Incorrect password — deletion cancelled.');
        btn.textContent = 'Commit Deletions'; btn.disabled = false;
        return;
      }

      try {
        const res = await fetch('/api/admin-delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passwordHash, urls: Array.from(selected) }),
        });

        const data = await res.json();

        if (!res.ok) {
          showToast(`Error: ${data.error || res.statusText}`);
          btn.textContent = 'Commit Deletions'; btn.disabled = false;
          return;
        }

        const { deleted, deleteFailed, configUpdated, configError } = data;
        let msg = `Deleted ${deleted.length} photo${deleted.length !== 1 ? 's' : ''} from R2.`;
        if (deleteFailed.length > 0) msg += ` ${deleteFailed.length} failed.`;
        if (configUpdated) msg += ' config.js updated — Vercel redeploying.';
        if (configError) msg += ` Config note: ${configError}`;

        showToast(msg, 6000);
        clearSelection();

        // Remove deleted thumbs from DOM
        deleted.forEach(key => {
          const url = `https://pub-d6285edfbb3747a9bbfc77b32aac2baa.r2.dev/${key}`;
          const thumb = document.querySelector(`.photo-thumb[data-url="${CSS.escape(url)}"]`) ||
                        document.querySelector(`.photo-thumb[data-url="${url}"]`);
          if (thumb) thumb.remove();
        });

      } catch (err) {
        showToast(`Request failed: ${err.message}`);
      }

      btn.textContent = 'Commit Deletions';
      btn.disabled = selected.size === 0;
    }

    // ── Toast ────────────────────────────────────────────────────────────────
    function showToast(msg, duration = 4000) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), duration);
    }

    function toggleThumb(thumb, url) {
      if (thumb.classList.toggle('marked')) {
        selected.add(url);
      } else {
        selected.delete(url);
      }
      updateToolbar();
    }

    // ── Lightbox ─────────────────────────────────────────────────────────────
    let lbPhotos = [];   // full-res URL list for current album
    let lbIndex  = 0;   // current position

    function openLightbox(url, albumPhotos) {
      lbPhotos = albumPhotos || [url];
      lbIndex  = lbPhotos.indexOf(url);
      if (lbIndex < 0) lbIndex = 0;
      document.getElementById('admin-lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
      lbShow();
    }

    function lbShow() {
      const lb  = document.getElementById('admin-lightbox');
      const img = document.getElementById('alb-img');
      const url = lbPhotos[lbIndex];

      lb.classList.add('loading');
      img.classList.remove('loaded');
      img.onload = () => { img.classList.add('loaded'); lb.classList.remove('loading'); };
      img.onerror = () => { lb.classList.remove('loading'); };
      img.src = url;
      if (img.complete && img.naturalWidth) { img.classList.add('loaded'); lb.classList.remove('loading'); }

      // Counter
      document.getElementById('alb-counter').textContent =
        lbPhotos.length > 1 ? `${lbIndex + 1} / ${lbPhotos.length}` : '';

      // Prev / Next
      document.getElementById('alb-prev').disabled = lbIndex === 0;
      document.getElementById('alb-next').disabled = lbIndex === lbPhotos.length - 1;

      // Preload adjacent images (2 before, 2 after)
      [-2, -1, 1, 2].forEach(offset => {
        const i = lbIndex + offset;
        if (i >= 0 && i < lbPhotos.length) {
          const pre = new Image();
          pre.src = lbPhotos[i];
        }
      });

      // Mark button state
      lbSyncMark();
    }

    function lbSyncMark() {
      const btn = document.getElementById('alb-mark');
      const isMarked = selected.has(lbPhotos[lbIndex]);
      btn.textContent = isMarked ? '✕ Marked for deletion' : 'Mark for deletion';
      btn.classList.toggle('marked', isMarked);
    }

    function lbNav(dir) {
      const next = lbIndex + dir;
      if (next < 0 || next >= lbPhotos.length) return;
      lbIndex = next;
      lbShow();
    }

    function lbToggleMark() {
      const url   = lbPhotos[lbIndex];
      const thumb = document.querySelector(`.photo-thumb[data-url="${CSS.escape(url)}"]`) ||
                    document.querySelector(`.photo-thumb[data-url="${url}"]`);
      if (thumb) {
        toggleThumb(thumb, url);
      } else {
        // curation photos have no thumb — toggle directly
        if (selected.has(url)) selected.delete(url); else selected.add(url);
        updateToolbar();
      }
      lbSyncMark();
    }

    function lbCopyUrl() {
      const url = lbPhotos[lbIndex];
      if (!url) return;
      navigator.clipboard.writeText(url).then(() => {
        const btn = document.getElementById('alb-copy-url');
        btn.textContent = '✓ Copied';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy URL'; btn.classList.remove('copied'); }, 2000);
      }).catch(() => {
        showToast('Copy failed — check browser permissions.');
      });
    }

    function lbClose() {
      document.getElementById('admin-lightbox').classList.remove('open');
      document.body.style.overflow = '';
      const img = document.getElementById('alb-img');
      img.onload = null; img.onerror = null; img.src = '';
      img.classList.remove('loaded');
      document.getElementById('admin-lightbox').classList.remove('loading');
    }

    // Close on backdrop click
    document.getElementById('admin-lightbox').addEventListener('click', e => {
      if (e.target === document.getElementById('admin-lightbox')) lbClose();
    });

    document.addEventListener('keydown', e => {
      if (!document.getElementById('admin-lightbox').classList.contains('open')) return;
      if (e.key === 'Escape')      { lbClose(); }
      else if (e.key === 'ArrowLeft')  { lbNav(-1); }
      else if (e.key === 'ArrowRight') { lbNav(1); }
      else if (e.key === 'd' || e.key === 'D') { lbToggleMark(); }
    });

    // ── Tab switching ─────────────────────────────────────────────────────────
    let curationLoaded = false;
    function switchTab(tab) {
      document.getElementById('pane-albums').style.display   = tab === 'albums'   ? '' : 'none';
      document.getElementById('pane-curation').style.display = tab === 'curation' ? '' : 'none';
      document.getElementById('tab-albums').classList.toggle('active',   tab === 'albums');
      document.getElementById('tab-curation').classList.toggle('active', tab === 'curation');
      // Hide the deletion toolbar items on curation tab
      document.getElementById('selection-count').style.display = tab === 'albums' ? '' : 'none';
      document.querySelector('.btn-ghost[onclick="clearSelection()"]').style.display = tab === 'albums' ? '' : 'none';
      document.getElementById('commit-btn').style.display = tab === 'albums' ? '' : 'none';
      if (tab === 'curation' && !curationLoaded) {
        curationLoaded = true;
        loadCurationResults();
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://dgajyvjxvobmnqxticvh.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_pwy5JTpQQG9VjrSmbBG4_Q_WWY8_NFa';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function renderCurateShareLinks() {
      const list = document.getElementById('curate-share-list');
      const groups = (ALBUMS || []).filter(a => a.type === 'group' && a.curatePasswordHash);
      if (!groups.length) {
        list.innerHTML = '<p style="color:var(--color-muted);font-size:0.85rem">No group curate links configured.</p>';
        return;
      }
      list.innerHTML = groups.map(g => {
        const url = `${location.origin}${Routes.curateGroup(g.id)}`;
        return `
          <div style="margin-bottom:0.75rem">
            <strong style="font-size:0.85rem">${g.title}</strong>
            <a class="curate-link" href="${url}" target="_blank" style="display:block;margin-top:0.25rem">↗ ${url}</a>
          </div>
        `;
      }).join('');
    }

    async function loadCurationResults() {
      renderCurateShareLinks();

      const container = document.getElementById('curation-list');
      container.innerHTML = '<p style="color:var(--color-muted);font-size:0.85rem">Loading…</p>';

      const { data, error } = await sb
        .from('votes')
        .select('album_id, photo_url, vote');

      if (error) {
        container.innerHTML = `<p style="color:#f87171;font-size:0.85rem">Failed to load votes: ${error.message}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = '<p style="color:var(--color-muted);font-size:0.85rem">No votes yet. Share a curate link with friends.</p>';
        return;
      }

      // Aggregate: { albumId: { photoUrl: { keep: N, cut: N } } }
      const agg = {};
      data.forEach(({ album_id, photo_url, vote }) => {
        if (!agg[album_id]) agg[album_id] = {};
        if (!agg[album_id][photo_url]) agg[album_id][photo_url] = { keep: 0, cut: 0 };
        agg[album_id][photo_url][vote]++;
      });

      container.innerHTML = '';

      Object.entries(agg).forEach(([albumId, photoVotes]) => {
        const albumConfig = (ALBUMS || []).find(a => a.id === albumId);
        const albumTitle  = albumConfig ? albumConfig.title : albumId;

        // Sort photos by cut votes descending
        const sorted = Object.entries(photoVotes)
          .sort(([, a], [, b]) => b.cut - a.cut);

        const section = document.createElement('div');
        section.className = 'curation-album';

        const curateUrl = `${location.origin}${Routes.curate(albumId)}`;
        section.innerHTML = `
          <h2>${albumTitle}</h2>
          <a class="curate-link" href="${curateUrl}" target="_blank">↗ Share curate link</a>
          <div class="select-all-row" style="margin-top:0.75rem">
            <label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer">
              <input type="checkbox" onchange="toggleSelectCutAbove(this, '${albumId}', 1)"
                style="accent-color:#ef4444;cursor:pointer" />
              Select all with ≥1 Cut vote
            </label>
          </div>
          <div class="curation-photo-list" id="curation-${albumId}"></div>
        `;
        container.appendChild(section);

        const list = section.querySelector(`#curation-${albumId}`);

        sorted.forEach(([photoUrl, v]) => {
          const total = v.keep + v.cut;
          const keepPct = total > 0 ? (v.keep / total) * 100 : 0;
          const cutPct  = total > 0 ? (v.cut  / total) * 100 : 0;

          const row = document.createElement('div');
          row.className = 'curation-photo-row';
          row.dataset.url = photoUrl;
          row.dataset.albumId = albumId;

          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.className = 'curation-select-check';
          cb.onchange = () => {
            if (cb.checked) selected.add(photoUrl); else selected.delete(photoUrl);
            updateToolbar();
          };

          const img = document.createElement('img');
          img.alt = '';
          img.decoding = 'async';
          img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
          img.addEventListener('error', () => { img.src = photoUrl; }, { once: true });
          img.src = thumbUrl(photoUrl);

          const bars = document.createElement('div');
          bars.className = 'vote-bars';
          bars.innerHTML = `
            <div class="vote-bar-label">
              <span>✓ Keep &nbsp;${v.keep}</span>
              <span>${v.cut}&nbsp; Cut ✕</span>
            </div>
            <div class="vote-bar-track"><div class="vote-bar-keep" style="width:${keepPct}%"></div></div>
            <div class="vote-bar-track"><div class="vote-bar-cut"  style="width:${cutPct}%"></div></div>
          `;

          const cutBadge = document.createElement('span');
          cutBadge.style.cssText = 'font-size:0.7rem;letter-spacing:0.06em;color:var(--color-muted);flex-shrink:0';
          cutBadge.textContent = `${total} vote${total !== 1 ? 's' : ''}`;

          row.appendChild(cb);
          row.appendChild(img);
          row.appendChild(bars);
          row.appendChild(cutBadge);
          list.appendChild(row);

          // Click image → lightbox (no album nav list for curation); click row → toggle checkbox
          img.style.cursor = 'zoom-in';
          row.addEventListener('click', (e) => {
            if (e.target === cb) return;
            if (e.target === img) { openLightbox(photoUrl, [photoUrl]); return; }
            cb.checked = !cb.checked;
            cb.onchange();
          });
        });
      });
    }

    function toggleSelectCutAbove(masterCb, albumId, threshold) {
      const list = document.getElementById(`curation-${albumId}`);
      list.querySelectorAll('.curation-photo-row').forEach(row => {
        const cb = row.querySelector('.curation-select-check');
        const url = row.dataset.url;
        // Count cut votes from agg — re-read from DOM bars label
        const label = row.querySelector('.vote-bar-label');
        if (!label) return;
        const cutMatch = label.textContent.match(/(\d+)\s*Cut/);
        const cutVotes = cutMatch ? parseInt(cutMatch[1]) : 0;
        if (cutVotes >= threshold) {
          cb.checked = masterCb.checked;
          if (masterCb.checked) selected.add(url); else selected.delete(url);
        }
      });
      updateToolbar();
      // Show albums tab commit button when items are selected from curation tab
      document.getElementById('commit-btn').style.display = '';
      document.getElementById('selection-count').style.display = '';
    }
  </script>
