<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Private Access — Raveen Fernando</title>
  <meta name="description" content="Enter your access code to view private albums." />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <style>
    .unlock-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .unlock-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem;
    }
    .unlock-card {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .unlock-lock-icon {
      width: 40px;
      height: 40px;
      margin: 0 auto 1.5rem;
      opacity: 0.5;
    }
    .unlock-title {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      margin-bottom: 0.5rem;
      color: var(--color-text);
    }
    .unlock-subtitle {
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 2.5rem;
    }
    .unlock-form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .unlock-input-wrap {
      position: relative;
      width: 100%;
    }
    .unlock-input {
      width: 100%;
      background: transparent;
      border: 1px solid var(--color-border);
      color: var(--color-text);
      padding: 0.75rem 2.75rem 0.75rem 1rem;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      outline: none;
      transition: border-color 0.2s;
      text-align: center;
    }
    .unlock-input:focus { border-color: var(--color-text); }
    .unlock-input::placeholder { color: var(--color-muted); }
    .unlock-visibility-btn {
      position: absolute;
      right: 0.55rem;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      padding: 0.35rem;
      color: var(--color-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }
    .unlock-visibility-btn:hover { color: var(--color-text); }
    .unlock-visibility-btn[aria-pressed="true"] { color: var(--color-text); }
    .unlock-btn {
      width: 100%;
      background: var(--color-text);
      color: var(--color-bg);
      border: none;
      padding: 0.75rem 1rem;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .unlock-btn:hover:not(:disabled) { opacity: 0.8; }
    .unlock-btn:disabled { opacity: 0.4; cursor: default; }
    .unlock-error {
      font-size: 0.8rem;
      color: #f87171;
      letter-spacing: 0.04em;
      min-height: 1.2em;
    }
    .unlock-remember {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: var(--color-muted);
      letter-spacing: 0.06em;
      cursor: pointer;
      margin-top: 0.25rem;
    }
    .unlock-remember input { cursor: pointer; accent-color: var(--color-text); }
    .unlock-success {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .unlock-success-icon {
      font-size: 2rem;
      opacity: 0.8;
    }
    .unlock-success-msg {
      font-size: 0.85rem;
      color: var(--color-muted);
      letter-spacing: 0.06em;
    }
    .unlock-signed-in {
      display: none;
      flex-direction: column;
      gap: 1.25rem;
    }
    .unlock-tier-badge {
      display: inline-block;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid var(--color-border);
      padding: 0.25rem 0.75rem;
      color: var(--color-muted);
    }
    .unlock-signout-btn {
      background: transparent;
      border: 1px solid var(--color-border);
      color: var(--color-muted);
      padding: 0.6rem 1.25rem;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .unlock-signout-btn:hover { border-color: var(--color-text); color: var(--color-text); }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60%  { transform: translateX(-6px); }
      40%,80%  { transform: translateX(6px); }
    }
    .shake { animation: shake 0.4s ease; }
  </style>
</head>
<body class="overflow-x-hidden unlock-page">

  <!-- ── Navigation ── -->
  <nav id="main-nav" class="nav-scrolled">
    <a href="/" class="nav-logo">RF<span>.</span></a>
    <ul class="nav-links">
      <li><a href="/"   data-nav-link data-nav="home">Home</a></li>
      <li><a href="/gallery/" data-nav-link data-nav="gallery">Gallery</a></li>
      <li><a href="/about/" data-nav-link data-nav="about">About</a></li>
      <li id="nav-family-gallery-item" style="display:none"><a href="/familyalbums/" data-nav-link data-nav="family">Family Albums</a></li>
      <li id="nav-signout-item" style="display:none"><a href="#" onclick="signOut();return false;" data-nav="signout">Sign out</a></li>
      <li><a href="/unlock/" id="nav-unlock-link" data-nav-link data-nav="unlock">Private Access</a></li>
    </ul>
    <button id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </nav>

  <div id="mobile-menu" role="dialog" aria-label="Navigation menu">
    <a href="/">Home</a>
    <a href="/gallery/">Gallery</a>
    <a href="/familyalbums/" id="mobile-family-gallery-link" style="display:none">Family Albums</a>
    <a href="#" id="mobile-signout-link" onclick="signOut();return false;" style="display:none">Sign out</a>
    <a href="/unlock/">Private Access</a>
  </div>

  <div class="unlock-wrap">
    <div class="unlock-card">

      <!-- Lock icon -->
      <svg class="unlock-lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>

      <!-- State: already signed in (shown above the form when tiers are active) -->
      <div id="signed-in-view" class="unlock-signed-in" style="display:none">
        <p class="unlock-title">You're in</p>
        <div id="signed-in-tiers" style="margin-bottom:0.5rem"></div>
        <a id="signed-in-gallery-btn" href="/gallery/" class="unlock-btn" style="display:inline-block;text-decoration:none;padding:0.75rem 2rem;width:auto">
          View gallery
        </a>
        <button class="unlock-signout-btn" onclick="signOut()">Sign out</button>

        <!-- Divider before additional-code form -->
        <div style="width:100%;border-top:1px solid var(--color-border);margin:1.5rem 0 0.25rem"></div>
        <p style="font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-muted)">
          Access another code
        </p>
      </div>

      <!-- Password form — always visible so additional tiers can be added -->
      <div id="form-view">
        <div id="form-title-block">
          <p class="unlock-title">Private Access</p>
          <p class="unlock-subtitle">Enter your access code</p>
        </div>

        <form class="unlock-form" id="unlock-form" novalidate>
          <div class="unlock-input-wrap">
            <input
              type="password"
              id="unlock-input"
              class="unlock-input"
              placeholder="Access code"
              autocomplete="current-password"
              aria-label="Access code"
            />
            <button
              type="button"
              id="unlock-visibility"
              class="unlock-visibility-btn"
              aria-label="Show access code"
              aria-pressed="false"
              title="Show access code"
            >
              <svg id="unlock-eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="unlock-eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" hidden>
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <p class="unlock-error" id="unlock-error" role="alert"></p>
          <label class="unlock-remember">
            <input type="checkbox" id="unlock-remember" checked />
            Remember on this device
          </label>
          <button type="submit" class="unlock-btn" id="unlock-btn">Continue</button>
        </form>
      </div>

    </div>
  </div>

  <!-- Toast -->
  <div id="unlock-toast" style="
    position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(2rem);
    background:var(--color-text);color:var(--color-bg);
    padding:0.6rem 1.4rem;font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;
    opacity:0;transition:opacity 0.3s,transform 0.3s;pointer-events:none;z-index:9999;
  "></div>

  <!-- Scripts -->
  <script src="/js/config.js"></script>
  <script src="/js/albums/clients.js"></script>
  <script src="/js/albums/family-2025.js"></script>
  <script src="/js/albums/family-2026.js"></script>
  <script src="/js/albums/california-2025.js"></script>
  <script src="/js/albums/misc-2026.js"></script>
  <script src="/js/albums/italy-2026.js"></script>
  <script src="/js/albums.js"></script>
  <script src="/js/routes.js"></script>
  <script src="/js/main.js"></script>
  <script>
    function showToast(msg, duration = 3000) {
      const t = document.getElementById('unlock-toast');
      t.textContent = msg;
      t.style.opacity = '1';
      t.style.transform = 'translateX(-50%) translateY(0)';
      clearTimeout(t._timer);
      t._timer = setTimeout(() => {
        t.style.opacity = '0';
        t.style.transform = 'translateX(-50%) translateY(2rem)';
      }, duration);
    }

    function tierLabel(tier) {
      if (tier === 'family') return 'Family';
      if (tier === 'family:anger-ali' || tier === 'family:fernando') return 'Family';
      if (tier === 'friends') return 'Friends';
      if (tier.startsWith('client:')) return tier.slice(7).replace(/-/g, ' ');
      return tier;
    }

    function renderSignedIn() {
      const tiers = TierAuth.grantedTiers();
      if (tiers.size === 0) {
        // No tiers active: hide signed-in view, show plain title block
        document.getElementById('signed-in-view').style.display = 'none';
        document.getElementById('form-title-block').style.display = '';
        return false;
      }

      // Tiers active: show signed-in banner above the form; hide the plain title block
      const sv = document.getElementById('signed-in-view');
      sv.style.display = 'flex';
      document.getElementById('form-title-block').style.display = 'none';

      const tiersEl = document.getElementById('signed-in-tiers');
      tiersEl.innerHTML = [...tiers]
        .map(t => `<span class="unlock-tier-badge">${tierLabel(t)}</span>`)
        .join(' ');

      // Point VIEW GALLERY to the client's specific album if a client tier is active
      const galleryBtn = document.getElementById('signed-in-gallery-btn');
      if (galleryBtn) {
        const clientTier = [...tiers].find(t => t.startsWith('client:'));
        if (clientTier && typeof ALBUMS !== 'undefined') {
          const clientId = clientTier.slice(7);
          const album = ALBUMS.find(a => a.id === clientId || a.id === clientId.replace(':', '-'));
          if (album) {
            galleryBtn.href = Routes.albumPageUrl(album);
            galleryBtn.textContent = 'View your album';
          } else {
            galleryBtn.href = '/gallery/';
            galleryBtn.textContent = 'View gallery';
          }
        } else {
          galleryBtn.href = '/gallery/';
          galleryBtn.textContent = 'View gallery';
        }
      }

      return true;
    }

    function signOut() {
      TierAuth.clear();
      try {
        Object.keys(sessionStorage)
          .filter(k => k.startsWith('worker_token_'))
          .forEach(k => sessionStorage.removeItem(k));
      } catch {}
      renderSignedIn();
      document.getElementById('unlock-input').value = '';
      document.getElementById('unlock-error').textContent = '';
      document.getElementById('unlock-btn').textContent = 'Continue';
      document.getElementById('unlock-btn').disabled = false;
      showToast('Signed out');
    }

    // Update nav to show signed-in state if already unlocked
    function updateNavLink() {
      const link = document.getElementById('nav-unlock-link');
      if (!link) return;
      if (TierAuth.grantedTiers().size > 0) {
        link.textContent = 'Private Access ✓';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateNavLink();
      renderSignedIn(); // renders the "already signed in" banner if applicable, but always continues

      const form  = document.getElementById('unlock-form');
      const input = document.getElementById('unlock-input');
      const error = document.getElementById('unlock-error');
      const btn   = document.getElementById('unlock-btn');
      const remember = document.getElementById('unlock-remember');
      const visibilityBtn = document.getElementById('unlock-visibility');
      const eyeOpen = document.getElementById('unlock-eye-open');
      const eyeClosed = document.getElementById('unlock-eye-closed');

      visibilityBtn?.addEventListener('click', () => {
        const showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        visibilityBtn.setAttribute('aria-pressed', String(!showing));
        visibilityBtn.setAttribute('aria-label', showing ? 'Show access code' : 'Hide access code');
        visibilityBtn.title = showing ? 'Show access code' : 'Hide access code';
        if (eyeOpen) eyeOpen.hidden = !showing;
        if (eyeClosed) eyeClosed.hidden = showing;
        input.focus();
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        error.textContent = '';
        btn.textContent = 'Checking…';
        btn.disabled = true;

        const granted = await TierAuth.tryUnlock(input.value.trim());

          if (granted) {
          TierAuth.grant(granted, remember.checked);
          updateNavLink();

          // Check for a ?next= redirect (from album page or banner link)
          const nextParam = new URLSearchParams(window.location.search).get('next');

          // If it's a single client album, redirect straight to their album
          const clientTier = granted.find(t => t.startsWith('client:'));
          if (clientTier) {
            const clientId = clientTier.slice(7);
            const album = (typeof ALBUMS !== 'undefined')
              ? ALBUMS.find(a => a.id === clientId || a.id === clientId.replace(':', '-'))
              : null;
            if (album) {
              showToast(`Access granted — loading your album…`);
              setTimeout(() => window.location.href = Routes.albumPageUrl(album), 800);
              return;
            }
          }

          // If there's a ?next= param, redirect there — same-origin only.
          // Rejects //attacker.example protocol-relative URLs and any off-origin path.
          const safeNext = (() => {
            if (!nextParam || !nextParam.startsWith('/') || nextParam.startsWith('//')) return null;
            try {
              const u = new URL(nextParam, window.location.origin);
              return u.origin === window.location.origin
                ? u.pathname + u.search + u.hash
                : null;
            } catch { return null; }
          })();
          if (safeNext) {
            showToast(`Access granted: ${granted.map(tierLabel).join(' + ')} — redirecting…`);
            setTimeout(() => window.location.href = safeNext, 800);
            return;
          }

          // Family tier: redirect to Family Gallery
          const hasFamilyTier = granted.some(t => t === 'family' || t.startsWith('family:'));
          if (hasFamilyTier) {
            showToast(`Access granted: ${granted.map(tierLabel).join(' + ')} — loading Family Albums…`);
            setTimeout(() => window.location.href = '/familyalbums/', 800);
            return;
          }

          // Re-render signed-in banner (additive — shows all currently granted tiers)
          showToast(`Access granted: ${granted.map(tierLabel).join(' + ')}`);
          renderSignedIn();
          // Clear the input for the next optional code
          input.value = '';
          btn.textContent = 'Continue';
          btn.disabled = false;
        } else {
          error.textContent = 'Incorrect access code. Please try again.';
          input.focus();
          input.select();
          btn.textContent = 'Continue';
          btn.disabled = false;
          input.classList.add('shake');
          input.addEventListener('animationend', () => input.classList.remove('shake'), { once: true });
        }
      });
    });
  </script>
</body>
</html>
