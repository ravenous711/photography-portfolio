<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Unlock — Raveen Fernando</title>
  <meta name="description" content="Enter your access code to view private albums." />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <style>
    .unlock-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .unlock-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem;
    }
    .unlock-card {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .unlock-lock-icon {
      width: 40px;
      height: 40px;
      margin: 0 auto 1.5rem;
      opacity: 0.5;
    }
    .unlock-title {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      margin-bottom: 0.5rem;
      color: var(--color-text);
    }
    .unlock-subtitle {
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 2.5rem;
    }
    .unlock-form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .unlock-input {
      width: 100%;
      background: transparent;
      border: 1px solid var(--color-border);
      color: var(--color-text);
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      outline: none;
      transition: border-color 0.2s;
      text-align: center;
    }
    .unlock-input:focus { border-color: var(--color-text); }
    .unlock-input::placeholder { color: var(--color-muted); }
    .unlock-btn {
      width: 100%;
      background: var(--color-text);
      color: var(--color-bg);
      border: none;
      padding: 0.75rem 1rem;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .unlock-btn:hover:not(:disabled) { opacity: 0.8; }
    .unlock-btn:disabled { opacity: 0.4; cursor: default; }
    .unlock-error {
      font-size: 0.8rem;
      color: #f87171;
      letter-spacing: 0.04em;
      min-height: 1.2em;
    }
    .unlock-remember {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: var(--color-muted);
      letter-spacing: 0.06em;
      cursor: pointer;
      margin-top: 0.25rem;
    }
    .unlock-remember input { cursor: pointer; accent-color: var(--color-text); }
    .unlock-success {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .unlock-success-icon {
      font-size: 2rem;
      opacity: 0.8;
    }
    .unlock-success-msg {
      font-size: 0.85rem;
      color: var(--color-muted);
      letter-spacing: 0.06em;
    }
    .unlock-signed-in {
      display: none;
      flex-direction: column;
      gap: 1.25rem;
    }
    .unlock-tier-badge {
      display: inline-block;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid var(--color-border);
      padding: 0.25rem 0.75rem;
      color: var(--color-muted);
    }
    .unlock-signout-btn {
      background: transparent;
      border: 1px solid var(--color-border);
      color: var(--color-muted);
      padding: 0.6rem 1.25rem;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .unlock-signout-btn:hover { border-color: var(--color-text); color: var(--color-text); }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60%  { transform: translateX(-6px); }
      40%,80%  { transform: translateX(6px); }
    }
    .shake { animation: shake 0.4s ease; }
  </style>
</head>
<body class="overflow-x-hidden unlock-page">

  <!-- ── Navigation ── -->
  <nav id="main-nav" class="nav-scrolled">
    <a href="/" class="nav-logo">RF<span>.</span></a>
    <ul class="nav-links">
      <li><a href="/"   data-nav-link data-nav="home">Home</a></li>
      <li><a href="/gallery/" data-nav-link data-nav="gallery">Gallery</a></li>
      <li><a href="/about/" data-nav-link data-nav="about">About</a></li>
      <li><a href="/unlock/" id="nav-unlock-link" data-nav-link data-nav="unlock">Unlock</a></li>
    </ul>
    <button id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </nav>

  <div id="mobile-menu" role="dialog" aria-label="Navigation menu">
    <a href="/">Home</a>
    <a href="/gallery/">Gallery</a>
    <a href="/about/">About</a>
    <a href="/unlock/">Unlock</a>
  </div>

  <div class="unlock-wrap">
    <div class="unlock-card">

      <!-- Lock icon -->
      <svg class="unlock-lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>

      <!-- State: already signed in -->
      <div id="signed-in-view" class="unlock-signed-in">
        <p class="unlock-title">You're in</p>
        <div id="signed-in-tiers"></div>
        <a href="/gallery/" class="unlock-btn" style="display:inline-block;text-decoration:none;padding:0.75rem 2rem;width:auto">
          View gallery
        </a>
        <button class="unlock-signout-btn" onclick="signOut()">Sign out</button>
      </div>

      <!-- State: unlock form -->
      <div id="form-view">
        <p class="unlock-title">Unlock</p>
        <p class="unlock-subtitle">Enter your access code</p>

        <form class="unlock-form" id="unlock-form" novalidate>
          <input
            type="password"
            id="unlock-input"
            class="unlock-input"
            placeholder="Access code"
            autocomplete="current-password"
            aria-label="Access code"
          />
          <p class="unlock-error" id="unlock-error" role="alert"></p>
          <label class="unlock-remember">
            <input type="checkbox" id="unlock-remember" />
            Remember on this device
          </label>
          <button type="submit" class="unlock-btn" id="unlock-btn">Unlock</button>
        </form>
      </div>

    </div>
  </div>

  <!-- Toast -->
  <div id="unlock-toast" style="
    position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(2rem);
    background:var(--color-text);color:var(--color-bg);
    padding:0.6rem 1.4rem;font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;
    opacity:0;transition:opacity 0.3s,transform 0.3s;pointer-events:none;z-index:9999;
  "></div>

  <!-- Scripts -->
  <script src="/js/config.js"></script>
  <script src="/js/routes.js"></script>
  <script src="/js/main.js"></script>
  <script>
    function showToast(msg, duration = 3000) {
      const t = document.getElementById('unlock-toast');
      t.textContent = msg;
      t.style.opacity = '1';
      t.style.transform = 'translateX(-50%) translateY(0)';
      clearTimeout(t._timer);
      t._timer = setTimeout(() => {
        t.style.opacity = '0';
        t.style.transform = 'translateX(-50%) translateY(2rem)';
      }, duration);
    }

    function tierLabel(tier) {
      if (tier === 'family') return 'Family';
      if (tier === 'friends') return 'Friends';
      if (tier.startsWith('client:')) return tier.slice(7).replace(/-/g, ' ');
      return tier;
    }

    function renderSignedIn() {
      const tiers = TierAuth.grantedTiers();
      if (tiers.size === 0) return false;

      document.getElementById('form-view').style.display = 'none';
      const sv = document.getElementById('signed-in-view');
      sv.style.display = 'flex';

      const tiersEl = document.getElementById('signed-in-tiers');
      tiersEl.innerHTML = [...tiers]
        .map(t => `<span class="unlock-tier-badge">${tierLabel(t)}</span>`)
        .join(' ');
      return true;
    }

    function signOut() {
      TierAuth.clear();
      document.getElementById('signed-in-view').style.display = 'none';
      document.getElementById('form-view').style.display = 'block';
      showToast('Signed out');
    }

    // Update nav to show "Sign out" text if already unlocked
    function updateNavLink() {
      const link = document.getElementById('nav-unlock-link');
      if (!link) return;
      if (TierAuth.grantedTiers().size > 0) {
        link.textContent = 'Unlocked ✓';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateNavLink();
      if (renderSignedIn()) return;

      const form  = document.getElementById('unlock-form');
      const input = document.getElementById('unlock-input');
      const error = document.getElementById('unlock-error');
      const btn   = document.getElementById('unlock-btn');
      const remember = document.getElementById('unlock-remember');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        error.textContent = '';
        btn.textContent = 'Checking…';
        btn.disabled = true;

        const granted = await TierAuth.tryUnlock(input.value.trim());

        if (granted) {
          TierAuth.grant(granted, remember.checked);
          updateNavLink();

          // If it's a single client album, redirect straight there
          const clientTier = granted.find(t => t.startsWith('client:'));
          if (clientTier) {
            const clientId = clientTier.slice(7);
            const album = (typeof ALBUMS !== 'undefined')
              ? ALBUMS.find(a => a.id === clientId || a.id === clientId.replace(':', '-'))
              : null;
            if (album) {
              showToast(`Unlocked — loading your album…`);
              setTimeout(() => window.location.href = Routes.albumPageUrl(album), 800);
              return;
            }
          }

          showToast(`Unlocked: ${granted.map(tierLabel).join(' + ')}`);
          renderSignedIn();
        } else {
          error.textContent = 'Incorrect access code. Please try again.';
          input.value = '';
          input.focus();
          btn.textContent = 'Unlock';
          btn.disabled = false;
          input.classList.add('shake');
          input.addEventListener('animationend', () => input.classList.remove('shake'), { once: true });
        }
      });
    });
  </script>
</body>
</html>
