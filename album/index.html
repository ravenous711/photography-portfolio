<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Album — Raveen Fernando</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css" />
  <script>tailwind.config = { theme: { extend: { colors: { gold: '#c9a96e' } } } }</script>

  <!-- JSZip for album download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- FileSaver for triggering the download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <!-- Flickr justified-layout: all images scaled to equal row height -->
  <script src="/js/justified-layout.js"></script>
  <!-- exifr: reads EXIF from JPEG via range request for digital photo metadata -->
  <script src="https://unpkg.com/exifr@7/dist/full.umd.js"></script>
</head>
<body class="overflow-x-hidden album-page">

  <!-- ── Navigation ── -->
  <nav id="main-nav" class="nav-scrolled">
    <a href="/" class="nav-logo">RF<span>.</span></a>
    <ul class="nav-links">
      <li><a href="/"   data-nav-link data-nav="home">Home</a></li>
      <li><a href="/gallery/" data-nav-link data-nav="gallery">Gallery</a></li>
      <li><a href="/about/" data-nav-link data-nav="about">About</a></li>
    </ul>
    <button id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </nav>

  <div id="mobile-menu" role="dialog" aria-label="Navigation menu">
    <a href="/">Home</a>
    <a href="/gallery/">Gallery</a>
    <a href="/about/">About</a>
  </div>

  <!-- ── Password Modal (shown for protected albums) ── -->
  <div id="password-modal" style="display:none">
    <div class="password-modal-inner">
      <!-- Lock icon -->
      <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>

      <h1 class="font-serif text-3xl font-light mb-2" id="modal-album-title">Private Album</h1>
      <p class="text-sm mb-8" style="color:var(--color-muted)">Enter the password to view this album.</p>

      <form id="password-form" novalidate>
        <div style="position:relative;margin-bottom:0.5rem">
          <input
            type="password"
            id="password-input"
            class="form-field text-center text-lg tracking-widest"
            placeholder="············"
            autocomplete="current-password"
            style="text-align:center;letter-spacing:0.3em"
            aria-label="Album password"
          />
        </div>
        <p class="password-error" id="password-error" role="alert"></p>
        <button type="submit" class="btn-primary mt-6 w-full justify-center"
                style="width:100%;margin-top:1.5rem;justify-content:center">
          Unlock Album
        </button>
      </form>

      <a href="/gallery/" class="block mt-6 text-xs tracking-widest uppercase"
         style="color:var(--color-muted);text-decoration:none;transition:color 0.3s">
        ← Back to Gallery
      </a>
    </div>
  </div>

  <!-- ── Album Content (revealed after auth) ── -->
  <div id="album-content" style="display:none">

    <!-- Album header -->
    <header class="album-page-header px-6 md:px-12">
      <div class="album-header-identity">
        <a id="back-link" href="/gallery/" class="inline-flex items-center gap-2 text-xs tracking-widest uppercase mb-4"
           style="color:var(--color-muted);text-decoration:none;transition:color 0.3s"
           onmouseover="this.style.color='var(--color-text)'"
           onmouseout="this.style.color='var(--color-muted)'">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          <span id="back-label">All Albums</span>
        </a>
        <div class="album-header-title-row" id="album-header-title-row">
          <div class="album-header-title-block">
            <h1 class="font-serif text-4xl md:text-5xl font-light" id="album-title" style="letter-spacing:0.04em"></h1>
            <p class="album-page-subtitle" id="album-subtitle" hidden></p>
          </div>
          <p class="album-page-dateline" id="album-dateline"></p>
        </div>
      </div>

      <div class="gold-rule album-header-rule"></div>
    </header>

    <div id="album-toolbar-sentinel" aria-hidden="true"></div>
    <div id="album-header-toolbar" class="album-header-toolbar px-6 md:px-12">
        <a id="back-link-sticky" class="album-toolbar-back" href="/gallery/">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          <span id="back-label-sticky">All Albums</span>
        </a>
        <div class="album-toolbar-main">
        <div class="album-toolbar-title-group">
          <span id="album-toolbar-title" class="album-toolbar-title"></span>
          <nav id="album-section-nav" class="album-section-nav" aria-label="Jump to section" hidden></nav>
        </div>
        <div class="album-header-actions">
          <button type="button" id="select-btn" class="btn-ghost" aria-label="Select photos">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
              <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
            Select
          </button>
          <button type="button" id="liked-count-btn" class="btn-ghost liked-count-btn" hidden aria-label="Download selected photos">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            <span id="liked-count-label">0</span>
          </button>
          <button type="button" id="download-btn" class="btn-primary" aria-label="Download all photos">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Download All
          </button>
        </div>
      </div>
    </div>

    <!-- Photo grids -->
    <main class="px-6 md:px-8 pb-24">
      <div id="digital-section" class="album-content-section">
        <p id="digital-section-label" class="album-section-label" hidden></p>
        <div class="photo-grid" id="photo-grid">
          <!-- Digital photos populated by JS -->
        </div>
      </div>
      <div id="film-section" class="album-film-section" hidden>
        <!-- Film subsections populated by JS -->
      </div>
      <nav id="album-next-nav" class="album-next-nav" aria-label="Next album" hidden></nav>
    </main>

  </div>

  <!-- ── Selection action bar ── -->
  <div id="selection-bar">
    <span id="selection-count">0 selected</span>
    <div class="flex items-center gap-3">
      <button type="button" id="select-all-btn">Select all</button>
      <button type="button" id="download-selected-btn" class="btn-primary" disabled>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download Selected
      </button>
      <button type="button" id="cancel-select-btn">Cancel</button>
    </div>
  </div>

  <!-- ── Liked download confirm ── -->
  <div id="liked-download-confirm" class="liked-download-confirm" hidden role="dialog" aria-modal="true" aria-labelledby="liked-confirm-message">
    <div class="liked-download-confirm-inner">
      <p id="liked-confirm-message" class="font-serif text-xl font-light"></p>
      <div class="liked-download-confirm-actions">
        <button type="button" id="liked-confirm-cancel" class="btn-ghost">Cancel</button>
        <button type="button" id="liked-confirm-download" class="btn-primary">Download</button>
      </div>
    </div>
  </div>

  <!-- ── Lightbox ── -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="lightbox-actions">
      <button type="button" id="lightbox-like" class="lightbox-action-btn" aria-label="Select photo" aria-pressed="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </button>
      <button type="button" id="lightbox-download" class="lightbox-action-btn" aria-label="Download photo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>
      <button type="button" id="lightbox-close" class="lightbox-action-btn" aria-label="Close lightbox" onclick="closeLightbox()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="lightbox-shell">
      <!-- Desktop-only arrow buttons — hidden on mobile, replaced by tap zones -->
      <button class="lightbox-nav lightbox-nav--desktop" id="lightbox-prev" aria-label="Previous photo" onclick="lightboxNav(-1)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>

      <div id="lightbox-content">
        <div id="lightbox-meta-top">
          <div id="lightbox-caption-row">
            <span id="lightbox-position-part"></span>
            <span id="lightbox-overall-part"></span>
          </div>
        </div>

        <div id="lightbox-stage">
          <img id="lightbox-img-a" class="lightbox-layer" alt="Photo" />
          <img id="lightbox-img-b" class="lightbox-layer" alt="Photo" />
          <!-- Mobile tap zones -->
          <div class="lightbox-tap-prev" id="lightbox-tap-prev" aria-hidden="true"></div>
          <div class="lightbox-tap-next" id="lightbox-tap-next" aria-hidden="true"></div>
        </div>

        <div id="lightbox-meta-bottom">
          <p id="lightbox-detail-part">
            <span id="lightbox-camera-part"></span>
            <span id="lightbox-settings-part"></span>
          </p>
        </div>
      </div>

      <button class="lightbox-nav lightbox-nav--desktop" id="lightbox-next" aria-label="Next photo" onclick="lightboxNav(1)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ── Download Progress Toast ── -->
  <div id="download-progress">
    <p id="dl-label" class="font-sans text-sm" style="color:var(--color-text)">Preparing download…</p>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="dl-bar"></div>
    </div>
  </div>

  <!-- ── Footer ── -->
  <footer>
    <p id="footer-copyright"></p>
  </footer>

  <script src="/js/config.js"></script>
  <script src="/js/routes.js"></script>
  <script src="/js/main.js"></script>
  <script>
    // ════════════════════════════════════════════════════════
    // ALBUM PAGE LOGIC
    // ════════════════════════════════════════════════════════

    // ── Get album from URL ──
    let album;
    let allPhotos = [];
    let currentIndex = 0;
    let selectMode   = false;
    const selected   = new Set();

    if (Routes.redirectLegacyFlatAlbum()) {
      // redirecting to nested /gallery/:group/:slug/
    } else if (Routes.canonicalizeAlbumQuery()) {
      // redirecting from legacy ?id=
    } else {
      album = Routes.resolveAlbumFromPath();

      if (!album) {
        document.body.innerHTML = `
        <div style="height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.5rem;text-align:center;padding:2rem">
          <p class="font-serif text-3xl font-light">Album not found</p>
          <a href="/gallery/" class="btn-ghost">Back to Gallery</a>
        </div>`;
      } else {
        allPhotos = getAlbumAllPhotos(album);

        // Update page title
        document.title = `${albumDisplayTitle(album)} — ${SITE_CONFIG.photographerName}`;
        document.getElementById('footer-copyright').textContent =
          `© ${new Date().getFullYear()} ${SITE_CONFIG.photographerName}`;

        // If this is a sub-album, update back link and enforce parent group lock
        if (album.parentId) {
          const parent = ALBUMS.find(a => a.id === album.parentId);
          if (parent) {
            const backHref = Routes.group(album.parentId);
            document.getElementById('back-link').href = backHref;
            document.getElementById('back-label').textContent = parent.title;
            document.getElementById('back-link-sticky').href = backHref;
            document.getElementById('back-label-sticky').textContent = parent.title;

            // If the parent group is password-protected and not yet unlocked, gate here
            if (parent.protected && !AlbumAuth.isUnlocked(parent.id)) {
              window.location.replace(Routes.group(album.parentId));
            }
          }
        }

        // ── Auth check ──
        if (!album.protected || AlbumAuth.isUnlocked(album.id)) {
          showAlbum();
        } else {
          showPasswordModal();
        }
      }
    }

    // ── Show password modal ──
    function showPasswordModal() {
      document.getElementById('modal-album-title').textContent = album.title;
      document.getElementById('password-modal').style.display = 'flex';

      const form  = document.getElementById('password-form');
      const input = document.getElementById('password-input');
      const error = document.getElementById('password-error');

      input.focus();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        error.textContent = '';
        const btn = form.querySelector('button[type="submit"]');
        btn.textContent = 'Checking…';
        btn.disabled = true;

        const hash = await hashPassword(input.value.trim());

        if (hash === album.passwordHash) {
          AlbumAuth.unlock(album.id);
          document.getElementById('password-modal').style.display = 'none';
          showAlbum();
        } else {
          error.textContent = 'Incorrect password. Please try again.';
          input.value = '';
          input.focus();
          btn.textContent = 'Unlock Album';
          btn.disabled = false;

          // Shake animation
          input.style.animation = 'shake 0.4s ease';
          input.addEventListener('animationend', () => { input.style.animation = ''; }, { once: true });
        }
      });
    }

    // ── Render album grid ──
    function getSelectionStorageKey() {
      return `selected_${album.id}`;
    }

    function loadSelectedFromStorage() {
      selected.clear();
      try {
        const raw = localStorage.getItem(getSelectionStorageKey());
        if (!raw) return;
        JSON.parse(raw).forEach(i => {
          if (Number.isInteger(i) && i >= 0 && i < allPhotos.length) selected.add(i);
        });
      } catch {}
    }

    function saveSelectedToStorage() {
      try {
        localStorage.setItem(
          getSelectionStorageKey(),
          JSON.stringify([...selected].sort((a, b) => a - b)),
        );
      } catch {}
    }

    function syncThumbSelectedState(index, isSelected) {
      const thumb = document.querySelector(`.photo-thumb[data-photo-index="${index}"]`);
      if (thumb) thumb.classList.toggle('selected', isSelected);
    }

    function setPhotoSelected(index, isSelected) {
      if (isSelected) selected.add(index);
      else selected.delete(index);
      syncThumbSelectedState(index, isSelected);
      saveSelectedToStorage();
      updateSelectionUI();
    }

    function togglePhotoSelected(index) {
      setPhotoSelected(index, !selected.has(index));
    }

    function bindTapWithoutScroll(el, handler) {
      if (!el) return;
      let touchStartY = 0;
      let touchMoved = false;

      el.addEventListener('touchstart', (e) => {
        touchMoved = false;
        touchStartY = e.touches[0]?.clientY ?? 0;
      }, { passive: true });

      el.addEventListener('touchmove', (e) => {
        const y = e.touches[0]?.clientY ?? touchStartY;
        if (Math.abs(y - touchStartY) > 10) touchMoved = true;
      }, { passive: true });

      el.addEventListener('click', (e) => {
        if (touchMoved) {
          e.preventDefault();
          e.stopPropagation();
          return;
        }
        handler(e);
      });
    }

    function setSelectMode(enabled) {
      if (selectMode === enabled) return;
      selectMode = enabled;

      document.body.classList.toggle('album-select-mode', selectMode);
      document.getElementById('selection-bar').classList.toggle('show', selectMode);
      document.getElementById('photo-grid').classList.toggle('select-mode', selectMode);
      document.querySelectorAll('#film-section .photo-grid').forEach(grid => {
        grid.classList.toggle('select-mode', selectMode);
      });
      document.getElementById('select-btn').classList.toggle('active', selectMode);

      if (enabled) {
        document.getElementById('select-btn').blur();
      }

      updateSelectionUI();
    }

    function toggleSelectMode() {
      setSelectMode(!selectMode);
    }

    function setupSelectModeControls() {
      bindTapWithoutScroll(document.getElementById('select-btn'), () => toggleSelectMode());
      bindTapWithoutScroll(document.getElementById('cancel-select-btn'), () => toggleSelectMode());
      bindTapWithoutScroll(document.getElementById('download-btn'), () => downloadPhotos(allPhotos));
      bindTapWithoutScroll(document.getElementById('liked-count-btn'), () => showLikedDownloadConfirm());
      document.getElementById('select-all-btn').addEventListener('click', () => toggleSelectAll());
      document.getElementById('download-selected-btn').addEventListener('click', () => downloadSelected());
      document.getElementById('liked-confirm-cancel').addEventListener('click', hideLikedDownloadConfirm);
      document.getElementById('liked-confirm-download').addEventListener('click', () => {
        hideLikedDownloadConfirm();
        downloadSelected();
      });
      document.getElementById('liked-download-confirm').addEventListener('click', (e) => {
        if (e.target.id === 'liked-download-confirm') hideLikedDownloadConfirm();
      });
    }

    function toggleThumb(index, thumb) {
      togglePhotoSelected(index);
    }

    function toggleSelectAll() {
      const thumbs = Array.from(document.querySelectorAll('.photo-thumb'));
      if (selected.size === allPhotos.length) {
        selected.clear();
        thumbs.forEach(t => t.classList.remove('selected'));
      } else {
        allPhotos.forEach((_, i) => selected.add(i));
        thumbs.forEach(t => t.classList.add('selected'));
      }
      saveSelectedToStorage();
      updateSelectionUI();
    }

    function updateSelectionUI() {
      const count = selected.size;
      const total = allPhotos.length;
      let countText = count === 0 ? 'No photos selected' : `${count} of ${total} selected`;
      if (count > 0 && count <= INDIVIDUAL_THRESHOLD) countText += ' · downloads individually';
      else if (count > INDIVIDUAL_THRESHOLD) countText += ' · downloads as ZIP';
      document.getElementById('selection-count').textContent = countText;
      document.getElementById('download-selected-btn').disabled = count === 0;
      document.getElementById('select-all-btn').textContent =
        count === total ? 'Deselect all' : 'Select all';

      const likedBtn = document.getElementById('liked-count-btn');
      const likedLabel = document.getElementById('liked-count-label');
      if (likedBtn && likedLabel) {
        likedBtn.hidden = count === 0;
        likedLabel.textContent = String(count);
        likedBtn.setAttribute('aria-label', count === 1 ? 'Download 1 selected photo' : `Download ${count} selected photos`);
      }

      updateLightboxLikeButton();
    }

    function updateLightboxLikeButton() {
      const btn = document.getElementById('lightbox-like');
      const lb = document.getElementById('lightbox');
      if (!btn || !lb?.classList.contains('open')) return;
      const isSelected = selected.has(currentIndex);
      btn.classList.toggle('is-liked', isSelected);
      btn.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
      btn.setAttribute('aria-label', isSelected ? 'Deselect photo' : 'Select photo');
    }

    function showLikedDownloadConfirm() {
      const count = selected.size;
      if (!count) return;
      const modal = document.getElementById('liked-download-confirm');
      const message = document.getElementById('liked-confirm-message');
      message.textContent = count === 1
        ? 'Download 1 selected photo?'
        : `Download ${count} selected photos?`;
      modal.hidden = false;
    }

    function hideLikedDownloadConfirm() {
      document.getElementById('liked-download-confirm').hidden = true;
    }

    const INDIVIDUAL_THRESHOLD = 5;

    function downloadSelected() {
      const urls = Array.from(selected).sort((a, b) => a - b).map(i => allPhotos[i]);
      if (urls.length <= INDIVIDUAL_THRESHOLD) {
        downloadIndividually(urls);
      } else {
        downloadPhotos(urls);
      }
    }

    async function downloadIndividually(photos) {
      const label    = document.getElementById('dl-label');
      const bar      = document.getElementById('dl-bar');
      const progress = document.getElementById('download-progress');
      const selDlBtn = document.getElementById('download-selected-btn');

      selDlBtn.disabled = true;
      progress.classList.add('show');
      label.textContent = `Downloading ${photos.length} photo${photos.length !== 1 ? 's' : ''}…`;

      for (let i = 0; i < photos.length; i++) {
        try {
          // Route through /api/download so no CORS required
          const proxyUrl = `/api/download?url=${encodeURIComponent(photos[i])}`;
          const response = await fetch(proxyUrl);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const blob = await response.blob();
          const filename = photos[i].split('/').pop().split('?')[0];
          saveAs(blob, filename);
        } catch (err) {
          console.warn(`Could not download photo ${i + 1}:`, err.message);
        }
        bar.style.width = Math.round(((i + 1) / photos.length) * 100) + '%';
        label.textContent = `${i + 1} of ${photos.length} downloaded…`;
        if (i < photos.length - 1) await new Promise(r => setTimeout(r, 400));
      }

      label.textContent = 'Done!';
      setTimeout(() => {
        progress.classList.remove('show');
        bar.style.width = '0%';
        selDlBtn.disabled = selected.size === 0;
      }, 1500);
    }

    function createPhotoThumb(url, index, sectionTitle) {
      const thumb = document.createElement('div');
      thumb.className = 'photo-thumb';
      thumb.dataset.photoIndex = String(index);
      thumb.dataset.photoUrl = url;
      thumb.setAttribute('tabindex', '0');
      thumb.setAttribute('role', 'button');
      thumb.setAttribute('aria-label', `Open photo ${index + 1}`);

      const img = document.createElement('img');
      img.alt     = `${sectionTitle} — photo ${index + 1}`;
      img.loading = index < 6 ? 'eager' : 'lazy';
      img.addEventListener('load', () => img.classList.add('loaded'));
      img.addEventListener('error', () => { img.src = url; }, { once: true });
      img.src = gridUrl(url);

      const expandOverlay = document.createElement('div');

          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>

    function runJustifiedLayout(grid) {
      const items = Array.from(grid.querySelectorAll('.photo-thumb'));
      if (!items.length) {
        grid.style.height = '0px';
        return;
      }

      const containerWidth = grid.offsetWidth;
      if (!containerWidth) return;

      const aspectRatios = items.map(item => {
        const img = item.querySelector('img');
        if (img.naturalWidth && img.naturalHeight) {
          return img.naturalWidth / img.naturalHeight;
        }
        return 1.5;
      });

      const layout = justifiedLayout(aspectRatios, {
        containerWidth: containerWidth,
        targetRowHeight: window.innerWidth <= 640 ? 200 : window.innerWidth <= 1024 ? 280 : 420,
        boxSpacing: window.innerWidth <= 640 ? 6 : 12,
        containerPadding: 0,
      });

      grid.style.height = layout.containerHeight + 'px';

      items.forEach((item, i) => {
        const box = layout.boxes[i];
        item.style.left   = box.left + 'px';
        item.style.top    = box.top  + 'px';
        item.style.width  = box.width + 'px';
        item.style.height = box.height + 'px';
      });
    }

    function bindGridLayout(grid) {
      if (!grid._layoutBound) {
        grid._layoutBound = true;
        new ResizeObserver(() => runJustifiedLayout(grid)).observe(grid);
      }

      let attempts = 0;
      const tryLayout = () => {
        runJustifiedLayout(grid);
        const hasThumbs = grid.querySelectorAll('.photo-thumb').length > 0;
        if (hasThumbs && !grid.offsetWidth && attempts++ < 12) {
          requestAnimationFrame(tryLayout);
          return;
        }

        grid.querySelectorAll('img').forEach(img => {
          if (img.complete && img.naturalWidth) { runJustifiedLayout(grid); }
          else { img.addEventListener('load', () => runJustifiedLayout(grid)); }
        });
      };

      tryLayout();
    }

    function getSectionIdForPhotoIndex(index) {
      const digitalCount = (album.photos || []).length;
      if (index < digitalCount) return 'digital-section';

      const filmSections = getAlbumFilmSections(album);
      let offset = digitalCount;
      for (let i = 0; i < filmSections.length; i++) {
        const count = (filmSections[i].photos || []).length;
        if (index < offset + count) return `album-section-film-${i}`;
        offset += count;
      }
      return 'digital-section';
    }

    function getFilmSectionRollMeta(section) {
      if (!section) return {};
      if (section.camera || section.filmStock) {
        return {
          camera: section.camera,
          filmStock: section.filmStock || section.label,
        };
      }

      const photos = section.photos || [];
      if (!photos.length) return { filmStock: section.label };

      const roll = ALBUMS.find(a =>
        a.albumKind === 'film-roll' &&
        Array.isArray(a.photos) &&
        photos.some(url => a.photos.includes(url))
      );
      if (roll) {
        return {
          camera: roll.camera,
          filmStock: roll.filmStock,
        };
      }

      return { filmStock: section.label };
    }

    function getLightboxCaptionParts(index) {
      const digitalCount = (album.photos || []).length;
      const filmSections = getAlbumFilmSections(album);
      const overall = `${index + 1}/${allPhotos.length}`;

      if (index < digitalCount) {
        const nav = album.digitalNavLabel || 'Digital';
        return {
          position: `${nav} · ${index + 1}/${digitalCount}`,
          detail: album.digitalLabel || '',
          overall,
        };
      }

      let offset = digitalCount;
      for (let i = 0; i < filmSections.length; i++) {
        const section = filmSections[i];
        const count = (section.photos || []).length;
        if (index < offset + count) {
          const navLabel = section.navLabel
            || (filmSections.length > 1 ? `Film Roll ${i + 1}` : (section.label || 'Film'));
          const rollMeta = getFilmSectionRollMeta(section);
          const detailParts = [];
          if (rollMeta.camera) detailParts.push(rollMeta.camera);
          if (rollMeta.filmStock) detailParts.push(rollMeta.filmStock);
          return {
            position: `${navLabel} · ${index - offset + 1}/${count}`,
            detail: detailParts.join(' · '),
            overall,
          };
        }
        offset += count;
      }

      return { position: overall, detail: '', overall: '' };
    }

    function scrollToLinkedPhoto() {
      const name = new URLSearchParams(window.location.search).get('photo');
      if (!name) return;

      const index = allPhotos.findIndex(url => {
        const filename = url.split('/').pop().split('?')[0];
        return filename === name;
      });

      const sectionId = index >= 0 ? getSectionIdForPhotoIndex(index) : 'digital-section';
      const thumb     = index >= 0 ? document.querySelector(`.photo-thumb[data-photo-index="${index}"]`) : null;

      // Step 1: scroll to section immediately so user lands in the right area
      requestAnimationFrame(() => scrollToAlbumSection(sectionId));

      if (!thumb) return;

      // Step 2: once the target image loads (layout will have rerun with real dimensions),
      // refine the scroll to center that exact photo
      const img = thumb.querySelector('img');

      const centerOnThumb = () => {
        const rect   = thumb.getBoundingClientRect();
        const center = rect.top + window.scrollY + rect.height / 2;
        window.scrollTo({ top: Math.max(0, center - window.innerHeight / 2), behavior: 'smooth' });
      };

      if (img && img.complete && img.naturalWidth) {
        // Already loaded — give layout one frame to settle first
        setTimeout(centerOnThumb, 120);
      } else if (img) {
        img.addEventListener('load', () => setTimeout(centerOnThumb, 120), { once: true });
      }
    }

    function measureStuckToolbarHeight(toolbar) {
      if (!toolbar) return 0;
      const hadStuck = toolbar.classList.contains('is-stuck');
      if (!hadStuck) toolbar.classList.add('is-stuck');
      const height = toolbar.getBoundingClientRect().height;
      if (!hadStuck) toolbar.classList.remove('is-stuck');
      return height;
    }

    function measureLiveStickyStackHeight() {
      const nav = document.getElementById('main-nav');
      const toolbar = document.getElementById('album-header-toolbar');
      if (!nav || !toolbar) return 112;
      return nav.getBoundingClientRect().height + toolbar.getBoundingClientRect().height;
    }

    function getStickyStackHeight() {
      const nav = document.getElementById('main-nav');
      const toolbar = document.getElementById('album-header-toolbar');
      if (!nav || !toolbar) return 112;

      const wasStuck = toolbar.classList.contains('is-stuck');
      const wasCompact = toolbar.classList.contains('is-compact');
      // Suppress CSS transition so getBoundingClientRect returns the final stuck
      // height immediately, not an in-progress intermediate value.
      toolbar.style.transition = 'none';
      toolbar.classList.add('is-stuck');
      if (!wasStuck) toolbar.classList.remove('is-compact');
      void toolbar.offsetHeight; // force reflow to settled state
      const height = nav.getBoundingClientRect().height + toolbar.getBoundingClientRect().height + 16;
      toolbar.classList.toggle('is-stuck', wasStuck);
      toolbar.classList.toggle('is-compact', wasCompact);
      toolbar.style.transition = '';

      document.documentElement.style.setProperty('--album-sticky-offset', `${height}px`);
      return height;
    }

    function getMinScrollForStuckToolbar() {
      const sentinel = document.getElementById('album-toolbar-sentinel');
      const navH = document.getElementById('main-nav')?.offsetHeight ?? 72;
      if (!sentinel) return 0;
      return Math.max(0, sentinel.getBoundingClientRect().top + window.scrollY - navH);
    }

    function syncStickyToolbarState() {
      const toolbar = document.getElementById('album-header-toolbar');
      const sentinel = document.getElementById('album-toolbar-sentinel');
      const navH = document.getElementById('main-nav')?.offsetHeight ?? 72;
      if (!toolbar || !sentinel) return;
      toolbar.classList.toggle('is-stuck', sentinel.getBoundingClientRect().top <= navH);
      getStickyStackHeight();
    }

    function updateAlbumStickyOffset() {
      getStickyStackHeight();
    }

    let sectionNavScrollSeq = 0;

    // Height of nav + stuck toolbar + gap. Constant regardless of scroll position,
    // so we measure it once per scroll in a single reflow.
    function measureStickyOffset() {
      const nav     = document.getElementById('main-nav');
      const toolbar = document.getElementById('album-header-toolbar');
      if (!nav || !toolbar) return 112;

      const wasStuck = toolbar.classList.contains('is-stuck');
      const wasCompact = toolbar.classList.contains('is-compact');
      toolbar.style.transition = 'none';
      toolbar.classList.add('is-stuck');
      if (!wasStuck) toolbar.classList.remove('is-compact');
      void toolbar.offsetHeight;
      const offset = nav.getBoundingClientRect().height + toolbar.getBoundingClientRect().height + 16;
      toolbar.classList.toggle('is-stuck', wasStuck);
      toolbar.classList.toggle('is-compact', wasCompact);
      toolbar.style.transition = '';

      document.documentElement.style.setProperty('--album-sticky-offset', `${offset}px`);
      return offset;
    }

    function scrollToAlbumSection(sectionId) {
      const el = document.getElementById(sectionId);
      if (!el) return;

      const seq = ++sectionNavScrollSeq;

      const isDigital = sectionId === 'digital-section';
      const labelEl   = el.querySelector('.album-section-label');
      const target    = (labelEl && labelEl.offsetParent !== null) ? labelEl : el;
      const offset    = measureStickyOffset();

      // Destination is re-evaluated every frame: target's live absolute Y minus the
      // sticky offset. When images load and shift the layout, this updates.
      const computeDest = () =>
        isDigital ? 0 : Math.max(0, target.getBoundingClientRect().top + window.scrollY - offset);

      // Exponential smoothing toward a (possibly moving) target. This never
      // overshoots and never restarts, so layout shifts are absorbed smoothly with
      // no stutter. TAU controls the feel (lower = snappier).
      const TAU = 80;
      let last  = performance.now();
      let settle = 0;

      let aborted = false;
      const abort = () => { aborted = true; };
      window.addEventListener('wheel',      abort, { passive: true, once: true });
      window.addEventListener('touchstart', abort, { passive: true, once: true });
      window.addEventListener('keydown',    abort, { once: true });

      const step = (now) => {
        if (aborted || seq !== sectionNavScrollSeq) { cleanup(); return; }

        const dt = Math.min(now - last, 50);
        last = now;

        const y         = window.scrollY;
        const dest      = computeDest();
        const remaining = dest - y;

        if (Math.abs(remaining) < 0.5) {
          if (++settle >= 3) { window.scrollTo({ top: dest, behavior: 'instant' }); cleanup(); return; }
        } else {
          settle = 0;
        }

        // 'instant' (not 'auto') so we bypass the CSS `scroll-behavior: smooth` —
        // otherwise each per-frame step becomes a smooth scroll and cancels out.
        const k = 1 - Math.exp(-dt / TAU);
        window.scrollTo({ top: y + remaining * k, behavior: 'instant' });
        rafId = requestAnimationFrame(step);
      };

      let rafId = requestAnimationFrame(step);
      function cleanup() {
        cancelAnimationFrame(rafId);
        window.removeEventListener('wheel', abort);
        window.removeEventListener('touchstart', abort);
        window.removeEventListener('keydown', abort);
      }
    }

    function setupStickyAlbumHeader() {
      const toolbar = document.getElementById('album-header-toolbar');
      const sentinel = document.getElementById('album-toolbar-sentinel');

      if (toolbar && sentinel) {
        updateAlbumStickyOffset();

        let isStuck = toolbar.classList.contains('is-stuck');
        let stickLockUntil = 0;
        const navHeight = () => document.getElementById('main-nav')?.offsetHeight || 72;
        const observer = new IntersectionObserver(([entry]) => {
          if (Date.now() < stickLockUntil) return;
          const nextStuck = !entry.isIntersecting;
          if (nextStuck === isStuck) return;

          const stackBefore = measureLiveStickyStackHeight();
          isStuck = nextStuck;
          toolbar.classList.toggle('is-stuck', nextStuck);

          requestAnimationFrame(() => {
            void toolbar.offsetHeight;
            const stackAfter = measureLiveStickyStackHeight();
            const delta = stackBefore - stackAfter;
            if (Math.abs(delta) > 0.5) {
              window.scrollTo({ top: window.scrollY + delta, behavior: 'instant' });
            }
            stickLockUntil = Date.now() + 200;
            getStickyStackHeight();
            window.dispatchEvent(new Event('scroll'));
          });
        }, {
          rootMargin: `-${navHeight()}px 0px 0px 0px`,
          threshold: 0,
        });

        observer.observe(sentinel);
        window.addEventListener('resize', updateAlbumStickyOffset, { passive: true });
      }

      const nav = document.getElementById('album-section-nav');
      const items = getAlbumSectionNavItems(album);

      if (!items.length) {
        nav.hidden = true;
        nav.innerHTML = '';
        return;
      }

      nav.hidden = false;
      nav.innerHTML = items.map(item => `
        <button type="button" class="album-section-nav-btn" data-target="${item.id}">
          ${item.label}
        </button>
      `).join('');

      nav.querySelectorAll('.album-section-nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          scrollToAlbumSection(btn.dataset.target);
          setActiveSectionNav(btn.dataset.target);
        });
      });

      if (items.length) {
        setActiveSectionNav(items[0].id);
      }

      setupSectionNavScrollSpy(items, nav);

      updateAlbumStickyOffset();
      setupAlbumHeaderScrollCompact(toolbar);
    }

    function setupAlbumHeaderScrollCompact(toolbar) {
      const COMPACT_MAX_WIDTH = 768;
      const SCROLL_THRESHOLD = 56;
      let lastScrollY = window.scrollY;
      let compact = false;
      let compactRaf = 0;

      const applyCompact = (nextCompact) => {
        if (compact === nextCompact) return;
        compact = nextCompact;
        toolbar.classList.toggle('is-compact', compact);
        lastScrollY = window.scrollY;
        getStickyStackHeight();
      };

      const updateCompact = () => {
        compactRaf = 0;
        if (window.innerWidth > COMPACT_MAX_WIDTH) {
          applyCompact(false);
          lastScrollY = window.scrollY;
          return;
        }

        if (!toolbar.classList.contains('is-stuck')) {
          applyCompact(false);
          lastScrollY = window.scrollY;
          return;
        }

        const delta = window.scrollY - lastScrollY;
        const minScroll = getMinScrollForStuckToolbar();
        let nextCompact = compact;

        if (window.scrollY < minScroll + SCROLL_THRESHOLD) {
          nextCompact = false;
        } else if (delta > 2) {
          nextCompact = true;
        } else if (delta < -2) {
          nextCompact = false;
        }

        applyCompact(nextCompact);
        lastScrollY = window.scrollY;
      };

      const scheduleCompact = () => {
        if (compactRaf) return;
        compactRaf = requestAnimationFrame(updateCompact);
      };

      window.addEventListener('scroll', scheduleCompact, { passive: true });
      window.addEventListener('resize', scheduleCompact, { passive: true });

      toolbar.addEventListener('click', (e) => {
        if (!toolbar.classList.contains('is-compact')) return;
        if (e.target.closest('a, button')) return;
        applyCompact(false);
      });
    }

    function setActiveSectionNav(sectionId) {
      const nav = document.getElementById('album-section-nav');
      if (!nav || !sectionId) return;
      nav.querySelectorAll('.album-section-nav-btn').forEach(btn => {
        btn.classList.toggle('is-active', btn.dataset.target === sectionId);
      });
    }

    function setupSectionNavScrollSpy(items, nav) {
      if (!items.length || !nav) return;

      let spyRaf = 0;

      const updateFromScroll = () => {
        spyRaf = 0;
        const offset = getStickyStackHeight();
        const anchor = window.scrollY + offset + 8;
        let activeId = items[0].id;

        for (const item of items) {
          const el = document.getElementById(item.id);
          if (!el) continue;

          const labelEl = el.querySelector('.album-section-label');
          const marker = (labelEl && labelEl.offsetParent !== null && !labelEl.hidden) ? labelEl : el;
          const top = marker.getBoundingClientRect().top + window.scrollY;
          if (top <= anchor) activeId = item.id;
        }

        setActiveSectionNav(activeId);
      };

      const scheduleUpdate = () => {
        if (spyRaf) return;
        spyRaf = requestAnimationFrame(updateFromScroll);
      };

      window.addEventListener('scroll', scheduleUpdate, { passive: true });
      window.addEventListener('resize', scheduleUpdate, { passive: true });
      scheduleUpdate();
    }

    function renderNextAlbumNav() {

      const next = getNextAlbum(album);
      if (!next) {
        nav.hidden = true;
        nav.innerHTML = '';

          </div>

            <path d="M5 12h14M13 6l6 6-6 6"/>

      `;
    }

    // ════════════════════════════════════════════════════════
    // LIGHTBOX
    // ════════════════════════════════════════════════════════
    const lightbox    = document.getElementById('lightbox');
    const lightboxLayers = [
      document.getElementById('lightbox-img-a'),
      document.getElementById('lightbox-img-b'),
    ];
    let activeLayer = 0;
    const lightboxPositionPart = document.getElementById('lightbox-position-part');
    const lightboxDetailPart   = document.getElementById('lightbox-detail-part');
    const lightboxCameraPart   = document.getElementById('lightbox-camera-part');
    const lightboxSettingsPart = document.getElementById('lightbox-settings-part');
    const lightboxOverallPart  = document.getElementById('lightbox-overall-part');
    const lightboxMetaTop      = document.getElementById('lightbox-meta-top');
    const lightboxMetaBottom   = document.getElementById('lightbox-meta-bottom');

    // ── EXIF cache: url → formatted string (or null if unavailable) ──
    const exifCache = new Map();

    async function fetchExifString(url) {
      if (exifCache.has(url)) return exifCache.get(url);

      try {
        const res = await fetch(`/api/exif/?url=${encodeURIComponent(url)}`);
        if (res.status === 204) { exifCache.set(url, null); return null; }
        if (!res.ok) { exifCache.set(url, null); return null; }

        const data = await res.json();
        if (!data) { exifCache.set(url, null); return null; }

        const parts = [];
        if (data.ExposureTime != null) {
          const t = data.ExposureTime;
          parts.push(t < 1 ? `1/${Math.round(1 / t)}s` : `${t}s`);
        }
        if (data.FNumber     != null) parts.push(`f/${data.FNumber}`);
        if (data.ISO         != null) parts.push(`ISO ${data.ISO}`);
        if (data.FocalLength != null) parts.push(`${Math.round(data.FocalLength)}mm`);

        const str = parts.length ? parts.join(' · ') : null;
        exifCache.set(url, str);
        return str;
      } catch {
        exifCache.set(url, null);
        return null;
      }
    }

    function syncLightboxCaptionWidth() {
      const activeImg = lightboxLayers[activeLayer];
      const w = activeImg?.offsetWidth;
      if (!w) return;
      lightboxMetaTop.style.width = `${w}px`;
      lightboxMetaBottom.style.width = `${w}px`;
    }

    function preloadLightboxNeighbors(index) {
      ImagePreload.preloadAdjacent(allPhotos, index, 4);
    }

    function prefetchLightboxIndex(index) {
      if (index < 0 || index >= allPhotos.length) return;
      const url = allPhotos[index];
      ImagePreload.load(gridUrl(url)).catch(() => {});
      if (!ImagePreload.isSlowConnection()) ImagePreload.load(url).catch(() => {});
    }

    async function showLightboxPhoto(fullResUrl, index) {
      const grid = gridUrl(fullResUrl);
      const nextLayer = 1 - activeLayer;
      const nextImg = lightboxLayers[nextLayer];
      const currentImg = lightboxLayers[activeLayer];
      const isCurrent = () => lightbox.classList.contains('open') && currentIndex === index;
      const thumbImg = document.querySelector(`.photo-thumb[data-photo-index="${index}"] img`);

      // Swap layers immediately — never block navigation on network/decode.
      if (ImagePreload.isLoaded(fullResUrl)) {
        ImagePreload.applyInstant(nextImg, fullResUrl);
      } else if (thumbImg?.complete && thumbImg.naturalWidth) {
        ImagePreload.applyInstant(nextImg, thumbImg.src);
      } else if (ImagePreload.isLoaded(grid)) {
        ImagePreload.applyInstant(nextImg, grid);
      } else {
        ImagePreload.applyInstant(nextImg, grid);
      }

      nextImg.classList.add('active');
      currentImg.classList.remove('active');
      activeLayer = nextLayer;
      requestAnimationFrame(syncLightboxCaptionWidth);

      // Upgrade quality in background (grid → full-res).
      ImagePreload.showProgressive(lightboxLayers[activeLayer], fullResUrl, grid, { isCurrent })
        .then(() => {
          if (isCurrent()) requestAnimationFrame(syncLightboxCaptionWidth);
        })
        .catch(() => {});

      prefetchLightboxIndex(index + 1);
      prefetchLightboxIndex(index + 2);
    }

    function openLightbox(index) {
      currentIndex = index;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
      loadLightboxImage(index);
      prefetchDownloadBlob(allPhotos[index]);
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
      lightboxLayers.forEach(layer => {
        layer.classList.remove('active');
        layer.src = '';
      });
      activeLayer = 0;
      lightboxMetaTop.style.width = '';
      lightboxMetaBottom.style.width = '';
    }

    // Prefetch blob for the current lightbox photo so share can fire fast.
    const downloadBlobCache = new Map(); // url → Promise<{blob, filename}>

    function prefetchDownloadBlob(url) {
      if (!url || downloadBlobCache.has(url)) return;
      const p = fetch(`/api/download?url=${encodeURIComponent(url)}`)
        .then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); })
        .then(blob => ({ blob, filename: url.split('/').pop().split('?')[0] }))
        .catch(() => null);
      downloadBlobCache.set(url, p);
    }

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    async function downloadLightboxPhoto() {
      const url = allPhotos[currentIndex];
      if (!url) return;

      const btn = document.getElementById('lightbox-download');
      const label = document.getElementById('dl-label');
      const progress = document.getElementById('download-progress');
      const bar = document.getElementById('dl-bar');

      // Kick off fetch immediately (may already be cached from lightbox open)
      prefetchDownloadBlob(url);

      if (btn) btn.disabled = true;

      try {
        const result = await downloadBlobCache.get(url);
        if (!result) throw new Error('Fetch failed');
        const { blob, filename } = result;

        // 1. Try Web Share API — opens iOS share sheet → Save Image → Photos
        const file = new File([blob], filename, { type: blob.type || 'image/jpeg' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file] });
            if (btn) btn.disabled = false;
            return;
          } catch (shareErr) {
            if (shareErr.name === 'AbortError') {
              if (btn) btn.disabled = false;
              return; // user cancelled share sheet — fine
            }
            // share failed, fall through to next method
          }
        }

        // 2. iOS fallback — open blob URL in new tab; user can long-press → Save to Photos
        if (isIOS) {
          const blobUrl = URL.createObjectURL(blob);
          window.open(blobUrl, '_blank');
          setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
          progress.classList.add('show');
          label.textContent = 'Long press → Save to Photos';
          bar.style.width = '100%';
          setTimeout(() => {
            progress.classList.remove('show');
            bar.style.width = '0%';
            if (btn) btn.disabled = false;
          }, 3000);
          return;
        }

        // 3. Desktop — standard FileSaver download
        saveAs(blob, filename);
        progress.classList.add('show');
        label.textContent = 'Download started!';
        bar.style.width = '100%';
      } catch (err) {
        progress.classList.add('show');
        label.textContent = 'Download failed. Try again.';
        console.warn('Lightbox download failed:', err.message);
        bar.style.width = '0%';
      }

      setTimeout(() => {
        progress.classList.remove('show');
        bar.style.width = '0%';
        if (btn) btn.disabled = false;
      }, 2000);
    }

    function updateLightboxMeta(index) {
      const hasMultipleSections = getAlbumSectionNavItems(album).length >= 2;
      const parts = hasMultipleSections ? getLightboxCaptionParts(index) : null;
      const digitalCount = (album.photos || []).length;
      const isDigital = index < digitalCount;

      if (hasMultipleSections && parts) {
        lightboxPositionPart.textContent = parts.position;
        lightboxOverallPart.textContent = parts.overall;
        lightboxOverallPart.hidden = false;
      } else {
        lightboxPositionPart.textContent = `${index + 1}/${allPhotos.length}`;
        lightboxOverallPart.textContent = '';
        lightboxOverallPart.hidden = true;
      }

      if (isDigital) {
        const url = allPhotos[index];
        const cameraLabel = parts?.detail || album.digitalLabel || '';
        lightboxCameraPart.textContent = cameraLabel;
        lightboxSettingsPart.textContent = exifCache.has(url) ? (exifCache.get(url) || '') : '';
        lightboxDetailPart.hidden = !cameraLabel && !lightboxSettingsPart.textContent;
        lightboxMetaBottom.hidden = lightboxDetailPart.hidden;

        const applySettings = (str) => {
          if (currentIndex !== index) return;
          lightboxSettingsPart.textContent = str || '';
          lightboxDetailPart.hidden = !lightboxCameraPart.textContent && !str;
          lightboxMetaBottom.hidden = lightboxDetailPart.hidden;
        };

        if (exifCache.has(url)) {
          applySettings(exifCache.get(url));
        } else {
          fetchExifString(url).then(applySettings);
        }

        [-1, 1].forEach(d => {
          const adj = index + d;
          if (adj >= 0 && adj < digitalCount) fetchExifString(allPhotos[adj]);
        });
      } else if (parts?.detail) {
        lightboxCameraPart.textContent = parts.detail;
        lightboxSettingsPart.textContent = '';
        lightboxDetailPart.hidden = false;
        lightboxMetaBottom.hidden = false;
      } else {
        lightboxCameraPart.textContent = '';
        lightboxSettingsPart.textContent = '';
        lightboxDetailPart.hidden = true;
        lightboxMetaBottom.hidden = true;
      }
    }

    function loadLightboxImage(index) {
      const url = allPhotos[index];

      updateLightboxMeta(index);
      document.getElementById('lightbox-prev').style.visibility = index === 0 ? 'hidden' : 'visible';
      document.getElementById('lightbox-next').style.visibility = index === allPhotos.length - 1 ? 'hidden' : 'visible';

      showLightboxPhoto(url, index);
      preloadLightboxNeighbors(index);
      requestAnimationFrame(syncLightboxCaptionWidth);
      updateLightboxLikeButton();
    }

    function lightboxNav(dir) {
      const newIndex = currentIndex + dir;
      if (newIndex >= 0 && newIndex < allPhotos.length) {
        prefetchLightboxIndex(newIndex);
        if (dir > 0) prefetchLightboxIndex(newIndex + 1);
        else prefetchLightboxIndex(newIndex - 1);
        currentIndex = newIndex;
        loadLightboxImage(currentIndex);
        prefetchDownloadBlob(allPhotos[currentIndex]);
      }
    }

    function bindLightboxPrefetch(btn, offset) {
      if (!btn) return;
      btn.addEventListener('touchstart', () => {
        prefetchLightboxIndex(currentIndex + offset);
        prefetchLightboxIndex(currentIndex + offset + (offset > 0 ? 1 : -1));
      }, { passive: true });
    }

    bindLightboxPrefetch(document.getElementById('lightbox-prev'), -1);
    bindLightboxPrefetch(document.getElementById('lightbox-next'), 1);

    // Prefetch blob as soon as user touches the download button — gives the
    // fetch a head start so navigator.share() fires within iOS gesture window.
    const dlBtn = document.getElementById('lightbox-download');
    dlBtn?.addEventListener('touchstart', () => prefetchDownloadBlob(allPhotos[currentIndex]), { passive: true });
    bindTapWithoutScroll(dlBtn, () => downloadLightboxPhoto());

    const likeBtn = document.getElementById('lightbox-like');
    bindTapWithoutScroll(likeBtn, () => togglePhotoSelected(currentIndex));

    // Mobile tap zones
    document.getElementById('lightbox-tap-prev')?.addEventListener('click', () => lightboxNav(-1));
    document.getElementById('lightbox-tap-next')?.addEventListener('click', () => lightboxNav(1));

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !document.getElementById('liked-download-confirm').hidden) {
        hideLikedDownloadConfirm();
        return;
      }
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape')     closeLightbox();
      if (e.key === 'ArrowLeft')  lightboxNav(-1);
      if (e.key === 'ArrowRight') lightboxNav(1);
    });

    // Click backdrop to close
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    // Touch swipe — ignore pinch/multi-touch; require clear horizontal flick
    let touchStartX = 0;
    let touchStartY = 0;
    let touchMulti  = false;

    lightbox.addEventListener('touchstart', (e) => {
      if (e.touches.length > 1) {
        touchMulti = true;
        return;
      }
      touchMulti = false;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    lightbox.addEventListener('touchmove', (e) => {
      if (e.touches.length > 1) touchMulti = true;
    }, { passive: true });

    lightbox.addEventListener('touchend', (e) => {
      if (touchMulti || e.touches.length > 0) {
        touchMulti = e.touches.length > 0;
        return;
      }

      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;

      // Must be a deliberate horizontal swipe, not pinch drift or scroll
      if (Math.abs(dx) < 60) return;
      if (Math.abs(dx) < Math.abs(dy) * 1.5) return;

      lightboxNav(dx < 0 ? 1 : -1);
    }, { passive: true });

    // ════════════════════════════════════════════════════════
    // ALBUM DOWNLOAD (ZIP)
    // ════════════════════════════════════════════════════════
    // ⚠️  R2 CORS: Your R2 bucket must allow cross-origin GET
    //     requests from this domain. Add a CORS rule in the
    //     Cloudflare R2 dashboard under Settings → CORS.
    //     Example rule:
    //       AllowedOrigins: ["https://yourdomain.com"]
    //       AllowedMethods: ["GET"]

    async function downloadPhotos(photos) {
      const dlBtn    = document.getElementById('download-btn');
      const selDlBtn = document.getElementById('download-selected-btn');
      const progress = document.getElementById('download-progress');
      const label    = document.getElementById('dl-label');
      const bar      = document.getElementById('dl-bar');

      const isAll = photos === allPhotos;
      if (dlBtn)    { dlBtn.disabled = true; }
      if (selDlBtn) { selDlBtn.disabled = true; }
      progress.classList.add('show');
      label.textContent = `Downloading ${photos.length} photo${photos.length !== 1 ? 's' : ''}…`;

      const zip    = new JSZip();
      const folder = zip.folder(album.title);
      const total  = photos.length;
      let completed = 0;

      const fetchPhoto = async (url, index) => {
        try {
          const response = await fetch(url, { mode: 'cors' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const blob = await response.blob();
          const ext = url.split('.').pop().split('?')[0] || 'jpg';
          folder.file(String(index + 1).padStart(3, '0') + '.' + ext, blob);
        } catch (err) {
          console.warn(`Could not fetch photo ${index + 1}:`, err.message);
        }
        completed++;
        bar.style.width   = Math.round((completed / total) * 100) + '%';
        label.textContent = `${completed} of ${total} photos…`;
      };

      const BATCH = 4;
      for (let i = 0; i < total; i += BATCH) {
        await Promise.all(photos.slice(i, i + BATCH).map((url, j) => fetchPhoto(url, i + j)));
      }

      label.textContent = 'Creating ZIP file…';
      try {
        const blob     = await zip.generateAsync({ type: 'blob' });
        const suffix   = isAll ? 'photos' : 'selection';
        const filename = `${album.title.replace(/[^a-z0-9]/gi, '-').toLowerCase()}-${suffix}.zip`;
        saveAs(blob, filename);
        label.textContent = 'Download started!';
      } catch (err) {
        label.textContent = 'Error creating ZIP. Try again.';
        console.error(err);
      }

      setTimeout(() => {
        progress.classList.remove('show');
        bar.style.width = '0%';
        if (dlBtn) {
          dlBtn.disabled = false;
          dlBtn.innerHTML = `
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Download All`;
        }
        if (selDlBtn) { selDlBtn.disabled = selected.size === 0; }
      }, 2500);
    }
  </script>

  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60%  { transform: translateX(-8px); }
      40%, 80%  { transform: translateX(8px); }
    }

    /* ── Selection bar ── */
    #selection-bar {
      position: fixed;
      bottom: 0;
      left: 0; right: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.5rem;
      padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
      background: var(--nav-scrolled-bg);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--color-border);
      transform: translateY(100%);
      visibility: hidden;
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), visibility 0.3s;
      flex-wrap: wrap;
    }
    #selection-bar.show {
      transform: translateY(0);
      visibility: visible;
      pointer-events: auto;
    }
    #selection-count {
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      color: var(--color-muted);
    }
    #select-all-btn, #cancel-select-btn {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-muted);
      background: transparent;
      border: 1px solid var(--color-border);
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    #select-all-btn:hover, #cancel-select-btn:hover {
      color: var(--color-text);
      border-color: rgba(255,255,255,0.2);
    }
    #cancel-select-btn { border-color: transparent; }

    /* ── Select mode thumbnail states ── */
    .photo-thumb-check {
      position: absolute;
      top: 8px; right: 8px;
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.5);
      background: rgba(0,0,0,0.3);
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s, border-color 0.15s;
      pointer-events: none;
    }
    .select-mode .photo-thumb-check { opacity: 1; }
    .select-mode .photo-thumb { cursor: pointer; }
    .select-mode .photo-thumb-overlay { opacity: 0 !important; }
    .select-mode .photo-thumb:hover .photo-thumb-check {
      border-color: rgba(255,255,255,0.8);
      background: rgba(0,0,0,0.5);
    }
    .photo-thumb.selected .photo-thumb-check {
      background: var(--color-gold) !important;
      border-color: var(--color-gold) !important;
      opacity: 1;
    }
    .photo-thumb.selected::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(201,169,110,0.15);
      pointer-events: none;
    }

    .photo-thumb-like {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-gold);
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
    }

    .photo-thumb.selected .photo-thumb-like { opacity: 1; }
    .select-mode .photo-thumb-like { opacity: 0; }

    .liked-count-btn {
      border-color: rgba(201, 169, 110, 0.45);
      color: var(--color-gold);
    }

    .liked-count-btn svg {
      fill: var(--color-gold);
      stroke: var(--color-gold);
    }

    .liked-download-confirm {
      position: fixed;
      inset: 0;
      z-index: 250;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(8px);
    }

    .liked-download-confirm[hidden] {
      display: none;
    }

    .liked-download-confirm-inner {
      width: min(100%, 22rem);
      padding: 1.75rem;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      text-align: center;
    }

    .liked-download-confirm-actions {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    /* ── Select button active state ── */
    #select-btn.active {
      border-color: var(--color-gold);
      color: var(--color-gold);
    }

    /* Add room for selection bar (main already has pb-24; extend, don't double) */
    body.album-select-mode main {
      padding-bottom: calc(9.5rem + env(safe-area-inset-bottom, 0px));
    }
  </style>
</body>
</html>
