<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Album — Raveen Fernando</title>

  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/base.css" />

</head>
<body class="overflow-x-hidden album-page">

  <!-- ── Navigation ── -->
  <nav id="main-nav" class="nav-scrolled">
    <a href="/" class="nav-logo">RF<span>.</span></a>
    <ul class="nav-links">
      <li><a href="/"   data-nav-link data-nav="home">Home</a></li>
      <li><a href="/gallery/" data-nav-link data-nav="gallery">Gallery</a></li>
      <li><a href="/about/" data-nav-link data-nav="about">About</a></li>

  </nav>

  <!-- ── Password Modal (shown for protected albums) ── -->
  <div id="password-modal" style="display:none">
    <div class="password-modal-inner">
      <!-- Lock icon -->

          Unlock Album

  <script src="/js/config.js"></script>
  <script src="/js/routes.js"></script>
  <script src="/js/main.js"></script>
  <script>
    // ════════════════════════════════════════════════════════
    // ALBUM PAGE LOGIC
    // ════════════════════════════════════════════════════════

    // ── Get album from URL ──
    let album;
    let allPhotos = [];
    let isCuratedView = false; // true when showing curated subset — affects lightbox captions
    let currentIndex = 0;
    let albumPageTitle = '';
    let selectMode   = false;
    const selected   = new Set();
    let refreshAlbumNavMenu = null;

    // ── Private image token (Phase 3) ────────────────────────────────────────
    // For family/client albums, images are served from a private R2 bucket via
    // the Worker. We exchange the stored password hash for a short-lived HMAC
    // token, then proxy every <img> through GET /image?key=...&token=...

    /** Returns true if this audience requires private R2 serving. */
    function isPrivateAudience(audience) {
      return audience === 'family' || (typeof audience === 'string' && audience.startsWith('client:'));
    }

    /**
     * Fetch (or return cached) a Worker image token for the given audience.
     * The token is valid for 4 hours; we refresh if < 5 min remain.
     */
    async function getPrivateToken(audience) {
      const cacheKey = `worker_token_${audience}`;
      try {
        const cached = JSON.parse(sessionStorage.getItem(cacheKey) || 'null');
        if (cached && cached.expiresAt > Date.now() + 5 * 60 * 1000) return cached.token;
      } catch {}

      const hash = TierAuth.getHash(audience);
      if (!hash) return null;

      const workerBase = (typeof WORKER_BASE_URL !== 'undefined') ? WORKER_BASE_URL : '';
      if (!workerBase) return null;

      try {
        const resp = await fetch(`${workerBase}/unlock`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ hash }),
        });
        if (!resp.ok) return null;
        const data = await resp.json();
        sessionStorage.setItem(cacheKey, JSON.stringify({ token: data.token, expiresAt: data.expiresAt }));
        return data.token;
      } catch {
        return null;
      }
    }

    /**
     * Convert a photo URL to a Worker-proxied URL for private albums.
     * For public albums returns the URL unchanged.
     */
    function toImageUrl(url, privateToken) {
      if (!privateToken || !url) return url;
      const workerBase = (typeof WORKER_BASE_URL !== 'undefined') ? WORKER_BASE_URL : '';
      if (!workerBase) return url;
      // Extract the R2 key by stripping any https://host/ prefix
      const key = url.replace(/^https?:\/\/[^/]+\//, '').replace(/^\/+/, '');
      return `${workerBase}/image?key=${encodeURIComponent(key)}&token=${encodeURIComponent(privateToken)}`;
    }

    // Active token for the current album (null for public albums)
    let _privateToken = null;

    if (Routes.redirectLegacyFlatAlbum()) {
      // redirecting to nested /gallery/:group/:slug/
    } else if (Routes.canonicalizeAlbumQuery()) {
      // redirecting from legacy ?id=
    } else {
      album = Routes.resolveAlbumFromPath();

      if (!album) {
        document.body.innerHTML = `
        <div style="height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.5rem;text-align:center;padding:2rem">
          <p class="font-serif text-3xl font-light">Album not found</p>
          <a href="/gallery/" class="btn-ghost">Back to Gallery</a>
        </div>`;
      } else {
        allPhotos = getAlbumAllPhotos(album);

        // Update page title (restored when lightbox closes)
        albumPageTitle = `${albumDisplayTitle(album)} — ${SITE_CONFIG.photographerName}`;
        document.title = albumPageTitle;
        document.getElementById('footer-copyright').textContent =
          `© ${new Date().getFullYear()} ${SITE_CONFIG.photographerName}`;

        // If this is a sub-album, update back link and enforce parent group lock
        if (album.parentId) {
          const parent = ALBUMS.find(a => a.id === album.parentId);
          if (parent) {
            const backHref = Routes.group(album.parentId);
            document.getElementById('back-link').href = backHref;
            document.getElementById('back-label').textContent = parent.title;
            document.getElementById('back-link-sticky').href = backHref;
            document.getElementById('back-label-sticky').textContent = parent.title;

            // If the parent group is password-protected and not yet unlocked, gate here
            if (parent.protected && !AlbumAuth.isUnlocked(parent.id)) {
              window.location.replace(Routes.group(album.parentId));
            }
          }
        }

        // ── Auth check ──
        const albumAudience = album.audience || 'public';
        const tierGranted   = TierAuth.canAccess(albumAudience);
        const isStrictTier  = albumAudience === 'family' || albumAudience.startsWith('client:');

        if (!tierGranted && isStrictTier) {
          // Family/client album: redirect non-unlocked visitors to /unlock/
          // (takes precedence over legacy protected gate so tier-gated albums don't
          //  show the old per-album password modal)
          window.location.replace(`/unlock/?next=${encodeURIComponent(window.location.pathname)}`);
        } else if (album.protected && !AlbumAuth.isUnlocked(album.id) && !isStrictTier) {
          // Legacy per-album password gate (only for albums not using the tier system)
          showPasswordModal();
        } else {
          // Public/friends: show album (curated or full based on curated[] presence)
          showAlbum();
        }
      }
    }

    // ── Show password modal ──
    function showPasswordModal() {
      document.getElementById('modal-album-title').textContent = album.title;
      document.getElementById('password-modal').style.display = 'flex';

      const form  = document.getElementById('password-form');
      const input = document.getElementById('password-input');
      const error = document.getElementById('password-error');

      input.focus();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        error.textContent = '';
        const btn = form.querySelector('button[type="submit"]');
        btn.textContent = 'Checking…';
        btn.disabled = true;

        const hash = await hashPassword(input.value.trim());

        if (hash === album.passwordHash) {
          AlbumAuth.unlock(album.id);
          document.getElementById('password-modal').style.display = 'none';
          showAlbum();
        } else {
          error.textContent = 'Incorrect password. Please try again.';
          input.value = '';
          input.focus();
          btn.textContent = 'Unlock Album';
          btn.disabled = false;

          // Shake animation
          input.style.animation = 'shake 0.4s ease';
          input.addEventListener('animationend', () => { input.style.animation = ''; }, { once: true });
        }
      });
    }

    // ── Render album grid ──
    function getSelectionStorageKey() {
      return `selected_${album.id}`;
    }

    function loadSelectedFromStorage() {
      selected.clear();
      try {
        const raw = localStorage.getItem(getSelectionStorageKey());
        if (!raw) return;
        JSON.parse(raw).forEach(i => {
          if (Number.isInteger(i) && i >= 0 && i < allPhotos.length) selected.add(i);
        });
      } catch {}
    }

    function saveSelectedToStorage() {
      try {
        localStorage.setItem(
          getSelectionStorageKey(),
          JSON.stringify([...selected].sort((a, b) => a - b)),
        );
      } catch {}
    }

    function syncThumbSelectedState(index, isSelected) {
      const thumb = document.querySelector(`.photo-thumb[data-photo-index="${index}"]`);
      if (thumb) thumb.classList.toggle('selected', isSelected);
    }

    function setPhotoSelected(index, isSelected) {
      if (isSelected) selected.add(index);
      else selected.delete(index);
      syncThumbSelectedState(index, isSelected);
      saveSelectedToStorage();
      updateSelectionUI();
    }

    function togglePhotoSelected(index) {
      setPhotoSelected(index, !selected.has(index));
    }

    function bindTapWithoutScroll(el, handler) {
      if (!el) return;
      let touchStartY = 0;
      let touchStartX = 0;
      let touchMoved = false;
      let lastTouchTap = 0;

      el.addEventListener('touchstart', (e) => {
        touchMoved = false;
        touchStartY = e.touches[0]?.clientY ?? 0;
        touchStartX = e.touches[0]?.clientX ?? 0;
      }, { passive: true });

      el.addEventListener('touchmove', (e) => {
        const y = e.touches[0]?.clientY ?? touchStartY;
        const x = e.touches[0]?.clientX ?? touchStartX;
        if (Math.abs(y - touchStartY) > 10 || Math.abs(x - touchStartX) > 10) touchMoved = true;
      }, { passive: true });

      el.addEventListener('touchend', (e) => {
        if (touchMoved) return;
        lastTouchTap = Date.now();
        handler(e);
      });

      el.addEventListener('click', (e) => {
        if (Date.now() - lastTouchTap < 500) return;
        handler(e);
      });
    }

    let scrollLockY = 0;
    let restoringFromLightbox = false;

    function lockPageScroll() {
      scrollLockY = window.scrollY;
      document.body.style.position = 'fixed';

    const INDIVIDUAL_THRESHOLD = 5;

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isMobileDownload = isIOS || /Android/i.test(navigator.userAgent);

    // Server-side streaming ZIP — builds + streams from R2 so phones never hold
    // the whole archive in memory (which crashes iOS on large, full-res albums).
    const ZIP_WORKER_URL = 'https://portfolio-zip-download.raveenfernando.workers.dev';

    function resetDownloadProgressUI() {
      const progress = document.getElementById('download-progress');
      const bar = document.getElementById('dl-bar');
      progress.classList.remove('show');
      bar.style.width = '0%';

    function photoUrlToKey(url) {
      if (!url) return '';
      return url.startsWith(`${R2_BASE_URL}/`) ? url.slice(R2_BASE_URL.length + 1) : url;
    }

    // Trigger a native streaming download from the ZIP Worker. A plain anchor
    // (GET) lets the browser download via the Content-Disposition header and
    // never renders the payload in-page — the reliable path on iOS Safari/Chrome.
    // (A hidden iframe makes iOS try to *render* the ZIP, which fails.)
    // For very large key lists that would blow the URL cap, fall back to a
    // top-level form POST into a new tab (still a native download).
    function submitWorkerZip(keys, filename) {
      const params = new URLSearchParams();
      params.set('filename', filename);
      params.set('keys', keys.join(','));
      const getUrl = `${ZIP_WORKER_URL}/?${params.toString()}`;

      if (getUrl.length <= 12000) {
        const a = document.createElement('a');
        a.href = getUrl;
        a.rel = 'noopener';
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => a.remove(), 1000);
        return;
      }

      const form = document.createElement('form');
      form.method = 'POST';
      form.action = ZIP_WORKER_URL;
      form.target = '_blank';
      form.rel = 'noopener';
      form.acceptCharset = 'utf-8';
      form.style.display = 'none';

      const addField = (name, value) => {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = name;
        input.value = value;
        form.appendChild(input);
      };
      addField('keys', keys.join('\n'));
      addField('filename', filename);

      document.body.appendChild(form);
      form.submit();
      setTimeout(() => form.remove(), 1000);
    }

    function photoFilename(url, fallbackIndex = 0) {
      const name = decodeURIComponent((url || '').split('/').pop().split('?')[0] || '');
      return name || `photo-${fallbackIndex + 1}.jpg`;
    }

    async function fetchPhotoBlob(url, attempts = 3) {
      let lastErr = new Error('Fetch failed');
      for (let attempt = 1; attempt <= attempts; attempt++) {
        try {
          const direct = await fetch(url, { mode: 'cors', cache: 'no-store' });
          if (direct.ok) return await direct.blob();
          lastErr = new Error(`HTTP ${direct.status}`);
        } catch (err) {
          lastErr = err;
        }

        try {
          const proxyUrl = `/api/download?url=${encodeURIComponent(url)}`;
          const proxied = await fetch(proxyUrl, { cache: 'no-store' });
          if (proxied.ok) return await proxied.blob();
          lastErr = new Error(`HTTP ${proxied.status}`);
        } catch (err) {
          lastErr = err;
        }

        if (attempt < attempts) {
          await new Promise(r => setTimeout(r, attempt * 1000));
        }
      }
      throw lastErr;
    }

    function downloadSelected() {
      const urls = Array.from(selected)
        .sort((a, b) => a - b)
        .map(i => allPhotos[i])
        .filter(Boolean);
      // Mobile saveAs() is unreliable, so always ZIP via the Worker there.
      // Desktop keeps the convenience of separate files for small selections.
      if (!isMobileDownload && urls.length <= INDIVIDUAL_THRESHOLD) {
        downloadIndividually(urls);
      } else {
        downloadPhotos(urls);
      }
    }

    async function downloadIndividually(photos) {
      const label    = document.getElementById('dl-label');
      const bar      = document.getElementById('dl-bar');
      const progress = document.getElementById('download-progress');
      const selDlBtn = document.getElementById('download-selected-btn');

      selDlBtn.disabled = true;
      progress.classList.add('show');
      label.textContent = `Downloading ${photos.length} photo${photos.length !== 1 ? 's' : ''}…`;

      let failed = 0;
      for (let i = 0; i < photos.length; i++) {
        try {
          const blob = await fetchPhotoBlob(photos[i]);
          saveAs(blob, photoFilename(photos[i], i));
        } catch (err) {
          failed++;
          console.warn(`Could not download photo ${i + 1}:`, err.message);
        }
        bar.style.width = Math.round(((i + 1) / photos.length) * 100) + '%';
        label.textContent = `${i + 1} of ${photos.length} downloaded…`;
        if (i < photos.length - 1) await new Promise(r => setTimeout(r, 400));
      }

      label.textContent = failed
        ? `Downloaded ${photos.length - failed} of ${photos.length} (${failed} failed)`
        : 'Done!';
      setTimeout(() => {
        progress.classList.remove('show');
        bar.style.width = '0%';
        selDlBtn.disabled = selected.size === 0;
      }, 1500);
    }

    function createPhotoThumb(url, index, sectionTitle) {

      img.addEventListener('error', () => { img.src = url; }, { once: true });
      // For private (Worker-proxied) URLs skip the grid transform; for public use gridUrl.
      img.src = _privateToken ? url : gridUrl(url);

      const expandOverlay = document.createElement('div');
      expandOverlay.className = 'photo-thumb-overlay';
      expandOverlay.innerHTML = `
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1">

      const likeBadge = document.createElement('div');

      likeBadge.setAttribute('aria-hidden', 'true');
      likeBadge.innerHTML = `
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>`;

      // Favorites heart badge (visible only when .favorites-enabled is on the grid)
      const favBadge = document.createElement('div');
      favBadge.className = 'fav-badge';
      favBadge.dataset.favUrl = url;
      favBadge.setAttribute('aria-label', 'Toggle favorite');
      favBadge.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" stroke-width="2">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>`;

      bindTapWithoutScroll(thumb, handleActivate);
      thumb.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') handleActivate(); });

      // Prefetch EXIF on hover for digital photos so it's cached before lightbox opens
      const digitalCount = (album.photos || []).length;
      if (index < digitalCount) {
        thumb.addEventListener('mouseenter', () => fetchExifString(allPhotos[index]), { once: true });
      }

      return thumb;

    function runJustifiedLayout(grid) {
      const items = Array.from(grid.querySelectorAll('.photo-thumb'));
      if (!items.length) {
        grid.style.height = '0px';
        return;
      }

      const containerWidth = grid.offsetWidth;
      if (!containerWidth) return;

      const aspectRatios = items.map(item => {
        const img = item.querySelector('img');
        if (img.naturalWidth && img.naturalHeight) {
          return img.naturalWidth / img.naturalHeight;
        }
        return 1.5;
      });

      const layout = justifiedLayout(aspectRatios, {
        containerWidth: containerWidth,
        targetRowHeight: window.innerWidth <= 640 ? 200 : window.innerWidth <= 1024 ? 280 : 420,
        boxSpacing: window.innerWidth <= 640 ? 6 : 12,
        containerPadding: 0,
      });

      grid.style.height = layout.containerHeight + 'px';

      items.forEach((item, i) => {
        const box = layout.boxes[i];
        item.style.left   = box.left + 'px';
        item.style.top    = box.top  + 'px';
        item.style.width  = box.width + 'px';
        item.style.height = box.height + 'px';
      });
    }

    function bindGridLayout(grid) {
      if (!grid._layoutBound) {
        grid._layoutBound = true;
        new ResizeObserver(() => runJustifiedLayout(grid)).observe(grid);
      }

      let attempts = 0;
      const tryLayout = () => {
        runJustifiedLayout(grid);
        const hasThumbs = grid.querySelectorAll('.photo-thumb').length > 0;
        if (hasThumbs && !grid.offsetWidth && attempts++ < 12) {
          requestAnimationFrame(tryLayout);
          return;
        }

        grid.querySelectorAll('img').forEach(img => {
          if (img.complete && img.naturalWidth) { runJustifiedLayout(grid); }
          else { img.addEventListener('load', () => runJustifiedLayout(grid)); }
        });
      };

      tryLayout();
    }

    async function showAlbum() {
      loadSelectedFromStorage();

      // ── Private token (family / client albums) ───────────────────────────
      const albumAudienceForToken = album.audience || 'public';
      if (isPrivateAudience(albumAudienceForToken)) {
        _privateToken = await getPrivateToken(albumAudienceForToken);
      } else {
        _privateToken = null;
      }

      // ── Curated-vs-full decision ─────────────────────────────────────────
      const albumAudience = album.audience || 'public';
      const tierGranted   = TierAuth.canAccess(albumAudience);
      const hasCurated    = Array.isArray(album.curated) && album.curated.length > 0;
      const fullPhotos    = getAlbumAllPhotos(album);

      // Always show curated if available (for everyone — it's the editorial landing).
      // Fall back to full album if no curated list exists yet.
      const showCurated = hasCurated;
      isCuratedView = showCurated;

      // Scope allPhotos to curated or full
      allPhotos = showCurated ? [...album.curated] : fullPhotos;

      // For private albums, rewrite all photo URLs to Worker-proxied endpoints now,
      // so the lightbox, prefetch, download, and favorites all use the correct URL.
      if (_privateToken) {
        allPhotos = allPhotos.map(url => toImageUrl(url, _privateToken));
      }

      // ── "See all" button — only shown to unlocked viewers ────────────────
      const seeAllBar = document.getElementById('see-all-bar');
      const seeAllBtn = document.getElementById('see-all-btn');
      if (showCurated && tierGranted && fullPhotos.length > album.curated.length) {
        const remaining = fullPhotos.length - album.curated.length;
        seeAllBtn.textContent = `See all ${fullPhotos.length} photos`;
        seeAllBar.hidden = false;
        function renderFullAlbum() {
          allPhotos = _privateToken
            ? fullPhotos.map(url => toImageUrl(url, _privateToken))
            : fullPhotos;
          // Restore section nav and digital label
          const sectionNav = document.getElementById('album-section-nav');
          if (sectionNav) sectionNav.hidden = false;
          const digitalLabel = document.getElementById('digital-section-label');
          if (digitalLabel) digitalLabel.hidden = false;
          // Re-render grid with full album
          const digitalGrid = document.getElementById('photo-grid');
          const filmSection  = document.getElementById('film-section');
          digitalGrid.innerHTML = '';
          filmSection.innerHTML = '';
          (album.photos || []).forEach((url, i) => digitalGrid.appendChild(createPhotoThumb(url, i, album.title)));
          const filmSections = getAlbumFilmSections(album);
          let offset = (album.photos || []).length;
          if (filmSections.length) {
            filmSection.hidden = false;
            filmSections.forEach((section, si) => {
              const block = document.createElement('div');
              block.id = `album-section-film-${si}`;
              block.className = si > 0 ? 'album-film-block album-film-block--continued' : 'album-film-block';
              const lbl = document.createElement('p');
              lbl.className = 'album-section-label';
              lbl.textContent = section.label || 'On film';
              block.appendChild(lbl);
              const grid = document.createElement('div');
              grid.className = 'photo-grid';
              (section.photos || []).forEach((url, i) => grid.appendChild(createPhotoThumb(url, offset + i, album.title)));
              block.appendChild(grid);
              filmSection.appendChild(block);
              offset += (section.photos || []).length;
            });
          } else {
            filmSection.hidden = true;
          }
          requestAnimationFrame(() => {
            bindGridLayout(digitalGrid);
            filmSection.querySelectorAll('.photo-grid').forEach(bindGridLayout);
            updateSelectionUI();
          });
        }

        function renderCuratedAlbum() {
          allPhotos = [...album.curated];
          const sectionNav = document.getElementById('album-section-nav');
          if (sectionNav) sectionNav.hidden = true;
          const digitalLabel = document.getElementById('digital-section-label');
          if (digitalLabel) digitalLabel.hidden = true;
          const digitalGrid = document.getElementById('photo-grid');
          const filmSection  = document.getElementById('film-section');
          digitalGrid.innerHTML = '';
          filmSection.innerHTML = '';
          filmSection.hidden = true;
          album.curated.forEach((url, i) => digitalGrid.appendChild(createPhotoThumb(url, i, album.title)));
          requestAnimationFrame(() => {
            bindGridLayout(digitalGrid);
            updateSelectionUI();
          });
        }

        let showingFull = false;
        seeAllBtn.addEventListener('click', () => {
          showingFull = !showingFull;
          if (showingFull) {
            isCuratedView = false;
            renderFullAlbum();
            seeAllBtn.textContent = `Back to highlights`;
          } else {
            isCuratedView = true;
            renderCuratedAlbum();
            seeAllBtn.textContent = `See all ${fullPhotos.length} photos`;
          }
        });
      } else {
        seeAllBar.hidden = true;
      }

      document.getElementById('album-content').style.display = 'block';
      document.getElementById('album-title').textContent        = albumDisplayTitle(album);
      document.getElementById('album-dateline').textContent     = albumDateline(album);
      document.getElementById('album-toolbar-title').textContent = albumDisplayTitle(album);

      const subtitleEl = document.getElementById('album-subtitle');
      const titleRow = document.getElementById('album-header-title-row');
      if (isFilmRollAlbum(album)) {
        subtitleEl.textContent = album.camera || '';
        subtitleEl.hidden = !album.camera;
        titleRow.classList.add('album-header-title-row--film-roll');
      } else {
        subtitleEl.textContent = '';
        subtitleEl.hidden = true;
        titleRow.classList.remove('album-header-title-row--film-roll');
      }

      const digitalGrid = document.getElementById('photo-grid');
      const filmSection = document.getElementById('film-section');
      digitalGrid.innerHTML = '';
      filmSection.innerHTML = '';

      // In curated mode: show only the curated photos in the digital grid,
      // skip film sections entirely (curated list is a flat array of URLs)
      const digitalPhotos = showCurated ? album.curated : (album.photos || []);
      const digitalLabelEl = document.getElementById('digital-section-label');
      if (isFilmRollAlbum(album)) {
        digitalLabelEl.textContent = '';
        digitalLabelEl.hidden = true;
      } else if (album.digitalLabel) {
        // When the "Digital" jump-nav tab exists (digital + film both present),
        // prefix the heading with "Digital" so the clicked tab and the section
        // it lands on use the same word (otherwise "Digital" -> "Fujifilm X-T5").
        const hasSectionNav = getAlbumSectionNavItems(album).length >= 2;
        digitalLabelEl.textContent = hasSectionNav
          ? `Digital · ${album.digitalLabel}`
          : album.digitalLabel;
        digitalLabelEl.hidden = false;
      } else {
        digitalLabelEl.textContent = '';
        digitalLabelEl.hidden = true;
      }

      digitalPhotos.forEach((url, i) => {
        digitalGrid.appendChild(createPhotoThumb(url, i, album.title));
      });

      // In curated mode, skip film sections (curated is a flat list of highlights)
      const filmSections = showCurated ? [] : getAlbumFilmSections(album);
      let photoOffset = digitalPhotos.length;

      if (filmSections.length) {
        filmSection.hidden = false;

        filmSections.forEach((section, sectionIndex) => {
          const block = document.createElement('div');
          block.id = `album-section-film-${sectionIndex}`;
          block.className = 'album-film-block';
          if (sectionIndex > 0) block.classList.add('album-film-block--continued');

          const label = document.createElement('p');
          label.className = 'album-section-label';
          label.textContent = section.label || 'On film';
          block.appendChild(label);

          const grid = document.createElement('div');
          grid.className = 'photo-grid';
          (section.photos || []).forEach((url, i) => {
            grid.appendChild(createPhotoThumb(url, photoOffset + i, album.title));
          });
          block.appendChild(grid);
          filmSection.appendChild(block);

          photoOffset += (section.photos || []).length;
        });
      } else {
        filmSection.hidden = true;
      }

      requestAnimationFrame(() => {
        bindGridLayout(digitalGrid);
        filmSection.querySelectorAll('.photo-grid').forEach(bindGridLayout);
        updateSelectionUI();
      });

      window.addEventListener('resize', () => {
        runJustifiedLayout(digitalGrid);
        filmSection.querySelectorAll('.photo-grid').forEach(runJustifiedLayout);
      });

      setupStickyAlbumHeader();
      // Hide section nav (Digital / film roll tabs) in curated mode —
      // must run AFTER setupStickyAlbumHeader() since it re-shows the nav
      if (showCurated) {
        const sectionNav = document.getElementById('album-section-nav');
        if (sectionNav) sectionNav.hidden = true;
        const digitalLabel = document.getElementById('digital-section-label');
        if (digitalLabel) digitalLabel.hidden = true;
      }
      setupSelectModeControls();
      renderSiblingNav();
      renderNextAlbumNav();
      scrollToLinkedPhoto();

      // Initialize favorites voting (only when tier is unlocked)
      initFavorites(album.id, tierGranted);
    }

    // Visible "More in <trip>" switcher in the page header so a visitor can hop
    // straight to a sibling city without backing out to the group page (UX-8).
    function renderSiblingNav() {
      const nav = document.getElementById('album-sibling-nav');
      if (!nav) return;
      const siblings = getSiblingAlbums(album);
      const parent = album.parentId ? ALBUMS.find(a => a.id === album.parentId) : null;
      if (siblings.length < 2 || !parent) {
        nav.hidden = true;
        nav.innerHTML = '';
        return;
      }
      nav.hidden = false;
      nav.innerHTML = `
        <span class="album-sibling-nav-label">More in ${parent.title}</span>
        <span class="album-sibling-nav-links">
          ${siblings.map(s => s.id === album.id
            ? `<span class="album-sibling-link is-active" aria-current="page">${s.title}</span>`
            : `<a class="album-sibling-link" href="${albumPageUrl(s)}">${s.title}</a>`
          ).join('')}
        </span>`;
    }

    function getSectionIdForPhotoIndex(index) {
      const digitalCount = (album.photos || []).length;
      if (index < digitalCount) return 'digital-section';

      const filmSections = getAlbumFilmSections(album);
      let offset = digitalCount;
      for (let i = 0; i < filmSections.length; i++) {
        const count = (filmSections[i].photos || []).length;
        if (index < offset + count) return `album-section-film-${i}`;
        offset += count;
      }
      return 'digital-section';
    }

    function getFilmSectionRollMeta(section) {
      if (!section) return {};
      if (section.camera || section.filmStock) {
        return {
          camera: section.camera,
          filmStock: section.filmStock || section.label,
        };
      }

      const photos = section.photos || [];
      if (!photos.length) return { filmStock: section.label };

      const roll = ALBUMS.find(a =>
        a.albumKind === 'film-roll' &&
        Array.isArray(a.photos) &&
        photos.some(url => a.photos.includes(url))
      );
      if (roll) {
        return {
          camera: roll.camera,
          filmStock: roll.filmStock,
        };
      }

      return { filmStock: section.label };
    }

    function getLightboxCaptionParts(index) {
      const overall = `${index + 1}/${allPhotos.length}`;

      // In curated mode photos may come from any section; skip per-section labels
      if (isCuratedView) {
        return { position: overall, detail: '', overall };
      }

      const digitalCount = (album.photos || []).length;
      const filmSections = getAlbumFilmSections(album);

      if (index < digitalCount) {
        const nav = album.digitalNavLabel || 'Digital';
        return {
          position: `${nav} · ${index + 1}/${digitalCount}`,
          detail: album.digitalLabel || '',
          overall,
        };
      }

      let offset = digitalCount;
      for (let i = 0; i < filmSections.length; i++) {
        const section = filmSections[i];
        const count = (section.photos || []).length;
        if (index < offset + count) {
          // Position chip mirrors the section nav tab (film stock). The detail
          // line carries the camera; the stock already shows in the position so
          // we don't repeat it here.
          const stockLabel = section.label
            || section.navLabel
            || (filmSections.length > 1 ? `Film Roll ${i + 1}` : 'Film');
          const rollMeta = getFilmSectionRollMeta(section);
          const detail = (rollMeta.filmStock && rollMeta.filmStock !== stockLabel)
            ? [rollMeta.camera, rollMeta.filmStock].filter(Boolean).join(' · ')
            : (rollMeta.camera || '');
          return {
            position: `${stockLabel} · ${index - offset + 1}/${count}`,
            detail,
            overall,
          };
        }
        offset += count;
      }

      return { position: overall, detail: '', overall: '' };
    }

    function getPhotoScrollTarget(index) {
      if (index < 0 || index >= allPhotos.length) return null;

      const thumb = document.querySelector(`.photo-thumb[data-photo-index="${index}"]`);
      if (!thumb) return null;

      const rect = thumb.getBoundingClientRect();
      const scrollBase = document.body.style.position === 'fixed' ? scrollLockY : window.scrollY;
      const center = rect.top + scrollBase + rect.height / 2;
      return Math.max(0, center - window.innerHeight / 2);
    }

    function scrollToPhotoInGrid(index, { behavior = 'auto' } = {}) {
      const targetY = getPhotoScrollTarget(index);
      if (targetY == null) return false;

      window.scrollTo({ top: targetY, behavior });
      return true;
    }

    function getLinkedPhotoIndex() {
      const name = new URLSearchParams(window.location.search).get('photo');
      if (!name) return -1;

      const target = decodeURIComponent(name).toLowerCase();
      return allPhotos.findIndex(url => {
        const filename = decodeURIComponent(url.split('/').pop().split('?')[0]).toLowerCase();
        return filename === target;
      });
    }

    function scrollToLinkedPhoto() {
      const index = getLinkedPhotoIndex();
      if (index < 0) return;

      // showAlbum() runs before lightbox DOM refs exist — defer until init finishes
      setTimeout(() => openLightbox(index), 0);
    }

    function measureStuckToolbarHeight(toolbar) {
      if (!toolbar) return 0;
      const hadStuck = toolbar.classList.contains('is-stuck');
      if (!hadStuck) toolbar.classList.add('is-stuck');
      const height = toolbar.getBoundingClientRect().height;
      if (!hadStuck) toolbar.classList.remove('is-stuck');
      return height;
    }

    function measureLiveStickyStackHeight() {
      const nav = document.getElementById('main-nav');
      const toolbar = document.getElementById('album-header-toolbar');
      if (!nav || !toolbar) return 112;
      return nav.getBoundingClientRect().height + toolbar.getBoundingClientRect().height;
    }

    function getStickyStackHeight() {
      const nav = document.getElementById('main-nav');
      const toolbar = document.getElementById('album-header-toolbar');
      if (!nav || !toolbar) return 112;

      const wasStuck = toolbar.classList.contains('is-stuck');
      // Suppress CSS transition so getBoundingClientRect returns the final stuck
      // height immediately, not an in-progress intermediate value.
      toolbar.style.transition = 'none';
      toolbar.classList.add('is-stuck');
      void toolbar.offsetHeight; // force reflow to settled state
      const height = nav.getBoundingClientRect().height + toolbar.getBoundingClientRect().height + 16;
      toolbar.classList.toggle('is-stuck', wasStuck);
      toolbar.style.transition = '';

      document.documentElement.style.setProperty('--album-sticky-offset', `${height}px`);
      return height;
    }

    function getMinScrollForStuckToolbar() {
      const sentinel = document.getElementById('album-toolbar-sentinel');
      const navH = document.getElementById('main-nav')?.offsetHeight ?? 72;
      if (!sentinel) return 0;
      return Math.max(0, sentinel.getBoundingClientRect().top + window.scrollY - navH);
    }

    function syncStickyToolbarState() {
      const toolbar = document.getElementById('album-header-toolbar');
      const sentinel = document.getElementById('album-toolbar-sentinel');
      const navH = document.getElementById('main-nav')?.offsetHeight ?? 72;
      if (!toolbar || !sentinel) return;
      toolbar.classList.toggle('is-stuck', sentinel.getBoundingClientRect().top <= navH);
      getStickyStackHeight();
    }

    function updateAlbumStickyOffset() {
      getStickyStackHeight();
    }

    let sectionNavScrollSeq = 0;

    // Height of nav + stuck toolbar + gap. Constant regardless of scroll position,
    // so we measure it once per scroll in a single reflow.
    function measureStickyOffset() {
      const nav     = document.getElementById('main-nav');
      const toolbar = document.getElementById('album-header-toolbar');
      if (!nav || !toolbar) return 112;

      const wasStuck = toolbar.classList.contains('is-stuck');
      toolbar.style.transition = 'none';
      toolbar.classList.add('is-stuck');
      void toolbar.offsetHeight;
      const offset = nav.getBoundingClientRect().height + toolbar.getBoundingClientRect().height + 16;
      toolbar.classList.toggle('is-stuck', wasStuck);
      toolbar.style.transition = '';

      document.documentElement.style.setProperty('--album-sticky-offset', `${offset}px`);
      return offset;
    }

    function scrollToAlbumSection(sectionId) {
      const el = document.getElementById(sectionId);
      if (!el) return;

      const seq = ++sectionNavScrollSeq;

      const isDigital = sectionId === 'digital-section';
      const labelEl   = el.querySelector('.album-section-label');
      const target    = (labelEl && labelEl.offsetParent !== null) ? labelEl : el;
      const offset    = measureStickyOffset();

      // Destination is re-evaluated every frame: target's live absolute Y minus the
      // sticky offset. When images load and shift the layout, this updates.
      const computeDest = () =>
        isDigital ? 0 : Math.max(0, target.getBoundingClientRect().top + window.scrollY - offset);

      // Exponential smoothing toward a (possibly moving) target. This never
      // overshoots and never restarts, so layout shifts are absorbed smoothly with
      // no stutter. TAU controls the feel (lower = snappier).
      const TAU = 80;
      let last  = performance.now();
      let settle = 0;

      let aborted = false;
      const abort = () => { aborted = true; };
      window.addEventListener('wheel',      abort, { passive: true, once: true });
      window.addEventListener('touchstart', abort, { passive: true, once: true });
      window.addEventListener('keydown',    abort, { once: true });

      const step = (now) => {
        if (aborted || seq !== sectionNavScrollSeq) { cleanup(); return; }

        const dt = Math.min(now - last, 50);
        last = now;

        const y         = window.scrollY;
        const dest      = computeDest();
        const remaining = dest - y;

        if (Math.abs(remaining) < 0.5) {
          if (++settle >= 3) { window.scrollTo({ top: dest, behavior: 'instant' }); cleanup(); return; }
        } else {
          settle = 0;
        }

        // 'instant' (not 'auto') so we bypass the CSS `scroll-behavior: smooth` —
        // otherwise each per-frame step becomes a smooth scroll and cancels out.
        const k = 1 - Math.exp(-dt / TAU);
        window.scrollTo({ top: y + remaining * k, behavior: 'instant' });
        rafId = requestAnimationFrame(step);
      };

      let rafId = requestAnimationFrame(step);
      function cleanup() {
        cancelAnimationFrame(rafId);
        window.removeEventListener('wheel', abort);
        window.removeEventListener('touchstart', abort);
        window.removeEventListener('keydown', abort);
      }
    }

    function setupStickyAlbumHeader() {
      const toolbar = document.getElementById('album-header-toolbar');
      const sentinel = document.getElementById('album-toolbar-sentinel');

      if (toolbar && sentinel) {
        updateAlbumStickyOffset();

        let isStuck = toolbar.classList.contains('is-stuck');
        let stickLockUntil = 0;
        const navHeight = () => document.getElementById('main-nav')?.offsetHeight || 72;
        const observer = new IntersectionObserver(([entry]) => {
          if (Date.now() < stickLockUntil) return;
          const nextStuck = !entry.isIntersecting;
          if (nextStuck === isStuck) return;

          const lightboxOpen = document.getElementById('lightbox')?.classList.contains('open');
          const stackBefore = measureLiveStickyStackHeight();
          isStuck = nextStuck;
          toolbar.classList.toggle('is-stuck', nextStuck);
          void toolbar.offsetHeight;
          const stackAfter = measureLiveStickyStackHeight();
          const delta = stackBefore - stackAfter;
          if (!lightboxOpen && !restoringFromLightbox && Math.abs(delta) > 0.5) {
            window.scrollTo({ top: window.scrollY + delta, behavior: 'instant' });
          }
          stickLockUntil = Date.now() + 200;
          getStickyStackHeight();
          if (!lightboxOpen) window.dispatchEvent(new Event('scroll'));
        }, {
          rootMargin: `-${navHeight()}px 0px 0px 0px`,
          threshold: 0,
        });

        observer.observe(sentinel);
        window.addEventListener('resize', updateAlbumStickyOffset, { passive: true });
      }

      const nav = document.getElementById('album-section-nav');
      const items = getAlbumSectionNavItems(album);

      if (!items.length) {
        nav.hidden = true;
        nav.innerHTML = '';
      } else {
        nav.hidden = false;
        nav.innerHTML = items.map(item => `
          <button type="button" class="album-section-nav-btn" data-target="${item.id}">
            ${item.label}
          </button>
        `).join('');

        nav.querySelectorAll('.album-section-nav-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            scrollToAlbumSection(btn.dataset.target);
            setActiveSectionNav(btn.dataset.target);
          });
        });

        setActiveSectionNav(items[0].id);
        setupSectionNavScrollSpy(items, nav);
      }

      updateAlbumStickyOffset();
      setupAlbumNavMenu(toolbar, items);
    }

    function setupAlbumNavMenu(toolbar, sectionItems) {
      const MOBILE_MAX = 640;
      const menuBtn = document.getElementById('album-nav-menu-btn');
      const menu = document.getElementById('album-nav-menu');
      const sectionsEl = document.getElementById('album-nav-menu-sections');
      const selectBtn = document.getElementById('album-nav-select-btn');
      const clearBtn = document.getElementById('album-nav-clear-btn');
      const likedBtn = document.getElementById('album-nav-liked-btn');
      const downloadBtn = document.getElementById('album-nav-download-btn');

      if (!menuBtn || !menu) return;

      if (sectionItems.length) {
        sectionsEl.hidden = false;
        sectionsEl.innerHTML = `
          <p class="album-nav-menu-label">Sections</p>
          ${sectionItems.map(item => `
            <button type="button" class="album-nav-menu-link" data-section="${item.id}">${item.label}</button>
          `).join('')}`;
      } else {
        sectionsEl.hidden = true;
        sectionsEl.innerHTML = '';
      }

      // Sibling-city switcher inside the menu so it's reachable when the header
      // is stuck on mobile (the visible header row scrolls away) — UX-8.
      const siblingsEl = document.getElementById('album-nav-menu-siblings');
      const siblings = getSiblingAlbums(album);
      const parentGroup = album.parentId ? ALBUMS.find(a => a.id === album.parentId) : null;
      if (siblingsEl && siblings.length > 1 && parentGroup) {
        siblingsEl.hidden = false;
        siblingsEl.innerHTML = `
          <p class="album-nav-menu-label">More in ${parentGroup.title}</p>
          ${siblings.map(s => s.id === album.id
            ? `<span class="album-nav-menu-link is-active" aria-current="page">${s.title}</span>`
            : `<a class="album-nav-menu-link" href="${albumPageUrl(s)}">${s.title}</a>`
          ).join('')}`;
      } else if (siblingsEl) {
        siblingsEl.hidden = true;
        siblingsEl.innerHTML = '';
      }

      const syncMenuVisibility = () => {
        const mobile = window.innerWidth <= MOBILE_MAX;
        // On mobile the Navigate menu replaces the inline pills/actions in
        // both states (top + stuck), so the header stays one compact row.
        menuBtn.hidden = !mobile;
        if (!mobile) closeAlbumNavMenu();
      };

      const updateLikedMenuLabel = () => {
        const count = selected.size;
        likedBtn.hidden = count === 0;
        likedBtn.textContent = count === 1 ? 'Download 1 selected' : `Download ${count} selected`;
        if (clearBtn) clearBtn.hidden = count === 0;
      };

      function openAlbumNavMenu() {
        menu.hidden = false;
        requestAnimationFrame(() => menu.classList.add('open'));
        menuBtn.setAttribute('aria-expanded', 'true');
      }

      function closeAlbumNavMenu() {
        menu.classList.remove('open');
        menuBtn.setAttribute('aria-expanded', 'false');
        menu.hidden = true;
      }

      window.closeAlbumNavMenu = closeAlbumNavMenu;

      menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (menu.classList.contains('open')) closeAlbumNavMenu();
        else openAlbumNavMenu();
      });

      sectionsEl?.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-section]');
        if (!btn) return;
        scrollToAlbumSection(btn.dataset.section);
        setActiveSectionNav(btn.dataset.section);
        closeAlbumNavMenu();
      });

      selectBtn?.addEventListener('click', () => {
        if (!selectMode) setSelectMode(true);
        closeAlbumNavMenu();
      });

      likedBtn?.addEventListener('click', () => {
        closeAlbumNavMenu();
        showLikedDownloadConfirm();
      });

      clearBtn?.addEventListener('click', () => {
        closeAlbumNavMenu();
        clearSelection();
      });

      downloadBtn?.addEventListener('click', () => {
        closeAlbumNavMenu();
        downloadPhotos(allPhotos);
      });

      document.addEventListener('click', (e) => {
        if (!menu.classList.contains('open')) return;
        if (e.target.closest('#album-nav-menu, #album-nav-menu-btn')) return;
        closeAlbumNavMenu();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeAlbumNavMenu();
      });

      window.addEventListener('scroll', closeAlbumNavMenu, { passive: true });
      window.addEventListener('resize', syncMenuVisibility, { passive: true });

      const stuckObserver = new MutationObserver(syncMenuVisibility);
      stuckObserver.observe(toolbar, { attributes: true, attributeFilter: ['class'] });

      syncMenuVisibility();
      updateLikedMenuLabel();
      refreshAlbumNavMenu = updateLikedMenuLabel;
    }

    function setActiveSectionNav(sectionId) {
      const nav = document.getElementById('album-section-nav');
      if (!nav || !sectionId) return;
      nav.querySelectorAll('.album-section-nav-btn').forEach(btn => {
        btn.classList.toggle('is-active', btn.dataset.target === sectionId);
      });
    }

    function setupSectionNavScrollSpy(items, nav) {
      if (!items.length || !nav) return;

      let spyRaf = 0;

      const updateFromScroll = () => {
        spyRaf = 0;
        const offset = getStickyStackHeight();
        const anchor = window.scrollY + offset + 8;
        let activeId = items[0].id;

        for (const item of items) {
          const el = document.getElementById(item.id);
          if (!el) continue;

          const labelEl = el.querySelector('.album-section-label');
          const marker = (labelEl && labelEl.offsetParent !== null && !labelEl.hidden) ? labelEl : el;
          const top = marker.getBoundingClientRect().top + window.scrollY;
          if (top <= anchor) activeId = item.id;
        }

        setActiveSectionNav(activeId);
      };

      const scheduleUpdate = () => {
        if (spyRaf) return;
        spyRaf = requestAnimationFrame(updateFromScroll);
      };

      window.addEventListener('scroll', scheduleUpdate, { passive: true });
      window.addEventListener('resize', scheduleUpdate, { passive: true });
      scheduleUpdate();
    }

    function renderNextAlbumNav() {
      const nav = document.getElementById('album-next-nav');
      const next = getNextAlbum(album);
      if (!next) {
        nav.hidden = true;
        nav.innerHTML = '';
        return;
      }

      const posStyle = next.coverPosition ? ` style="object-position:${next.coverPosition}"` : '';
      nav.hidden = false;
      nav.innerHTML = `
        <div class="gold-rule" style="margin-left:0;margin-bottom:2.5rem"></div>
        <a href="${albumPageUrl(next)}" class="album-next-link">
          <div class="album-next-thumb">
            <img src="${albumCoverUrl(next)}" alt="" loading="lazy"${posStyle} />
          </div>
          <div class="album-next-text">
            <span class="album-next-label">Next</span>
            <span class="album-next-title">${next.title}</span>
            ${albumDateline(next) ? `<span class="album-next-meta">${albumDateline(next)}</span>` : ''}
          </div>
          <svg class="album-next-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </a>
      `;
    }

    // ════════════════════════════════════════════════════════
    // LIGHTBOX
    // ════════════════════════════════════════════════════════
    const lightbox    = document.getElementById('lightbox');
    const lightboxLayers = [
      document.getElementById('lightbox-img-a'),
      document.getElementById('lightbox-img-b'),
    ];
    let activeLayer = 0;
    let lightboxNavGeneration = 0;
    const lightboxPositionPart = document.getElementById('lightbox-position-part');
    const lightboxDetailPart   = document.getElementById('lightbox-detail-part');
    const lightboxCameraPart   = document.getElementById('lightbox-camera-part');
    const lightboxSettingsPart = document.getElementById('lightbox-settings-part');
    const lightboxOverallPart  = document.getElementById('lightbox-overall-part');
    const lightboxMetaTop      = document.getElementById('lightbox-meta-top');
    const lightboxMetaBottom   = document.getElementById('lightbox-meta-bottom');

    // ── EXIF cache: url → formatted string (or null if unavailable) ──
    const exifCache = new Map();

    async function fetchExifString(url) {
      if (exifCache.has(url)) return exifCache.get(url);

      try {
        const res = await fetch(`/api/exif/?url=${encodeURIComponent(url)}`);
        if (res.status === 204) { exifCache.set(url, null); return null; }
        if (!res.ok) { exifCache.set(url, null); return null; }

        const data = await res.json();
        if (!data) { exifCache.set(url, null); return null; }

        const parts = [];
        if (data.ExposureTime != null) {
          const t = data.ExposureTime;
          parts.push(t < 1 ? `1/${Math.round(1 / t)}s` : `${t}s`);
        }
        if (data.FNumber     != null) parts.push(`f/${data.FNumber}`);
        if (data.ISO         != null) parts.push(`ISO ${data.ISO}`);
        if (data.FocalLength != null) parts.push(`${Math.round(data.FocalLength)}mm`);

        const str = parts.length ? parts.join(' · ') : null;
        exifCache.set(url, str);
        return str;
      } catch {
        exifCache.set(url, null);
        return null;
      }
    }

    function syncLightboxCaptionWidth() {
      const activeImg = lightboxLayers[activeLayer];
      const w = activeImg?.offsetWidth;
      if (!w) return;
      lightboxMetaTop.style.width = `${w}px`;
      lightboxMetaBottom.style.width = `${w}px`;
    }

    function preloadLightboxNeighbors(index) {
      ImagePreload.preloadAdjacent(allPhotos, index, 4);
    }

    function prefetchLightboxIndex(index) {
      if (index < 0 || index >= allPhotos.length) return;
      const url = allPhotos[index];
      ImagePreload.load(gridUrl(url)).catch(() => {});
      if (!ImagePreload.isSlowConnection()) ImagePreload.load(url).catch(() => {});
    }

    async function showLightboxPhoto(fullResUrl, index, generation) {
      const grid = gridUrl(fullResUrl);
      const nextLayer = 1 - activeLayer;
      const nextImg = lightboxLayers[nextLayer];
      const currentImg = lightboxLayers[activeLayer];
      const isCurrent = () =>
        lightbox.classList.contains('open') &&
        currentIndex === index &&
        generation === lightboxNavGeneration;
      const thumbImg = document.querySelector(`.photo-thumb[data-photo-index="${index}"] img`);

      let instantSrc = grid;
      if (ImagePreload.isLoaded(fullResUrl)) {
        instantSrc = fullResUrl;
      } else if (thumbImg?.complete && thumbImg.naturalWidth) {
        instantSrc = thumbImg.src;
      }

      // Keep the current frame visible until the incoming layer is ready to paint.
      // Without this, the hidden layer briefly shows its previous photo (N-1) when advancing.
      await ImagePreload.prepareLayer(nextImg, instantSrc);
      if (!isCurrent()) return;

      nextImg.classList.add('active');
      currentImg.classList.remove('active');
      currentImg.src = '';
      activeLayer = nextLayer;
      requestAnimationFrame(syncLightboxCaptionWidth);

      // Upgrade quality in background (grid → full-res).
      ImagePreload.showProgressive(lightboxLayers[activeLayer], fullResUrl, grid, { isCurrent })
        .then(() => {
          if (isCurrent()) requestAnimationFrame(syncLightboxCaptionWidth);
        })
        .catch(() => {});

      prefetchLightboxIndex(index + 1);
      prefetchLightboxIndex(index + 2);
    }

    function syncLightboxPhotoUrl(index) {
      const url = new URL(window.location.href);
      if (index >= 0 && index < allPhotos.length) {
        url.searchParams.set('photo', photoFilename(allPhotos[index], index));
      } else {
        url.searchParams.delete('photo');
      }
      history.replaceState(null, '', `${url.pathname}${url.search}${url.hash}`);
    }

    function openLightbox(index) {
      currentIndex = index;
      document.activeElement?.blur();
      lightboxNavGeneration += 1;
      lightbox.classList.add('open');
      lockPageScroll();
      loadLightboxImage(index, lightboxNavGeneration);
      prefetchDownloadBlob(allPhotos[index]);
    }

    function closeLightbox() {
      lightboxNavGeneration += 1;
      const index = currentIndex;
      const targetY = getPhotoScrollTarget(index);

      lightbox.classList.remove('open');
      restoringFromLightbox = true;
      unlockPageScroll(targetY != null ? targetY : scrollLockY);
      syncLightboxPhotoUrl(-1);
      if (albumPageTitle) document.title = albumPageTitle;
      lightboxLayers.forEach(layer => {
        layer.classList.remove('active');
        layer.src = '';
      });
      activeLayer = 0;
      lightboxMetaTop.style.width = '';
      lightboxMetaBottom.style.width = '';
      updateSelectionUI();
      window.setTimeout(() => { restoringFromLightbox = false; }, 300);
    }

    // Prefetch blob for the current lightbox photo so share can fire fast.
    const downloadBlobCache = new Map(); // url → Promise<{blob, filename}>

    function prefetchDownloadBlob(url) {
      if (!url || downloadBlobCache.has(url)) return;
      const p = fetch(url, { mode: 'cors', cache: 'no-store' })
        .then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); })
        .then(blob => ({ blob, filename: url.split('/').pop().split('?')[0] }))
        .catch(() => null);
      downloadBlobCache.set(url, p);
    }

    const isIOSDevice = isIOS;

    async function downloadLightboxPhoto() {
      const url = allPhotos[currentIndex];
      if (!url) return;

      const btn = document.getElementById('lightbox-download');
      const label = document.getElementById('dl-label');
      const progress = document.getElementById('download-progress');
      const bar = document.getElementById('dl-bar');

      // Kick off fetch immediately (may already be cached from lightbox open)
      prefetchDownloadBlob(url);

      if (btn) btn.disabled = true;

      try {
        const result = await downloadBlobCache.get(url);
        if (!result) throw new Error('Fetch failed');
        const { blob, filename } = result;

        // 1. Try Web Share API — opens iOS share sheet → Save Image → Photos
        const file = new File([blob], filename, { type: blob.type || 'image/jpeg' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file] });
            if (btn) btn.disabled = false;
            return;
          } catch (shareErr) {
            if (shareErr.name === 'AbortError') {
              if (btn) btn.disabled = false;
              return; // user cancelled share sheet — fine
            }
            // share failed, fall through to next method
          }
        }

        // 2. iOS fallback — open blob URL in new tab; user can long-press → Save to Photos
        if (isIOSDevice) {
          const blobUrl = URL.createObjectURL(blob);
          window.open(blobUrl, '_blank');
          setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
          progress.classList.add('show');
          label.textContent = 'Long press → Save to Photos';
          bar.style.width = '100%';
          setTimeout(() => {
            progress.classList.remove('show');
            bar.style.width = '0%';
            if (btn) btn.disabled = false;
          }, 3000);
          return;
        }

        // 3. Desktop — standard FileSaver download
        saveAs(blob, filename);
        progress.classList.add('show');
        label.textContent = 'Download started!';
        bar.style.width = '100%';
      } catch (err) {
        progress.classList.add('show');
        label.textContent = 'Download failed. Try again.';
        console.warn('Lightbox download failed:', err.message);
        bar.style.width = '0%';
      }

      setTimeout(() => {
        progress.classList.remove('show');
        bar.style.width = '0%';
        if (btn) btn.disabled = false;
      }, 2000);
    }

    function updateLightboxMeta(index) {
      const hasMultipleSections = getAlbumSectionNavItems(album).length >= 2;
      const parts = hasMultipleSections ? getLightboxCaptionParts(index) : null;
      const digitalCount = (album.photos || []).length;
      const isDigital = index < digitalCount;

      if (hasMultipleSections && parts) {
        lightboxPositionPart.textContent = parts.position;
        lightboxOverallPart.textContent = parts.overall;
        lightboxOverallPart.hidden = false;
      } else {
        lightboxPositionPart.textContent = `${index + 1}/${allPhotos.length}`;
        lightboxOverallPart.textContent = '';
        lightboxOverallPart.hidden = true;
      }

      if (isDigital) {
        const url = allPhotos[index];
        const cameraLabel = parts?.detail || album.digitalLabel || '';
        lightboxCameraPart.textContent = cameraLabel;
        lightboxSettingsPart.textContent = exifCache.has(url) ? (exifCache.get(url) || '') : '';
        lightboxDetailPart.hidden = !cameraLabel && !lightboxSettingsPart.textContent;
        lightboxMetaBottom.hidden = lightboxDetailPart.hidden;

        const applySettings = (str) => {
          if (currentIndex !== index) return;
          lightboxSettingsPart.textContent = str || '';
          lightboxDetailPart.hidden = !lightboxCameraPart.textContent && !str;
          lightboxMetaBottom.hidden = lightboxDetailPart.hidden;
        };

        if (exifCache.has(url)) {
          applySettings(exifCache.get(url));
        } else {
          fetchExifString(url).then(applySettings);
        }

        [-1, 1].forEach(d => {
          const adj = index + d;
          if (adj >= 0 && adj < digitalCount) fetchExifString(allPhotos[adj]);
        });
      } else if (parts?.detail) {
        lightboxCameraPart.textContent = parts.detail;
        lightboxSettingsPart.textContent = '';
        lightboxDetailPart.hidden = false;
        lightboxMetaBottom.hidden = false;
      } else {
        lightboxCameraPart.textContent = '';
        lightboxSettingsPart.textContent = '';
        lightboxDetailPart.hidden = true;
        lightboxMetaBottom.hidden = true;
      }
    }

    function loadLightboxImage(index, generation = lightboxNavGeneration) {
      const url = allPhotos[index];

      updateLightboxMeta(index);
      syncLightboxPhotoUrl(index);
      document.getElementById('lightbox-prev').style.visibility = index === 0 ? 'hidden' : 'visible';
      document.getElementById('lightbox-next').style.visibility = index === allPhotos.length - 1 ? 'hidden' : 'visible';

      showLightboxPhoto(url, index, generation);
      preloadLightboxNeighbors(index);
      requestAnimationFrame(syncLightboxCaptionWidth);
      updateLightboxLikeButton();
    }

    function lightboxNav(dir) {
      const newIndex = currentIndex + dir;
      if (newIndex >= 0 && newIndex < allPhotos.length) {
        prefetchLightboxIndex(newIndex);
        if (dir > 0) prefetchLightboxIndex(newIndex + 1);
        else prefetchLightboxIndex(newIndex - 1);
        currentIndex = newIndex;
        lightboxNavGeneration += 1;
        loadLightboxImage(currentIndex, lightboxNavGeneration);
        prefetchDownloadBlob(allPhotos[currentIndex]);
      }
    }

    function bindLightboxPrefetch(btn, offset) {
      if (!btn) return;
      btn.addEventListener('touchstart', () => {
        prefetchLightboxIndex(currentIndex + offset);
        prefetchLightboxIndex(currentIndex + offset + (offset > 0 ? 1 : -1));
      }, { passive: true });
    }

    bindLightboxPrefetch(document.getElementById('lightbox-prev'), -1);
    bindLightboxPrefetch(document.getElementById('lightbox-next'), 1);

    // Prefetch blob as soon as user touches the download button — gives the
    // fetch a head start so navigator.share() fires within iOS gesture window.
    const dlBtn = document.getElementById('lightbox-download');
    dlBtn?.addEventListener('touchstart', () => prefetchDownloadBlob(allPhotos[currentIndex]), { passive: true });
    bindTapWithoutScroll(dlBtn, () => downloadLightboxPhoto());

    const likeBtn = document.getElementById('lightbox-like');
    bindTapWithoutScroll(likeBtn, () => togglePhotoSelected(currentIndex));

    // Mobile tap zones
    document.getElementById('lightbox-tap-prev')?.addEventListener('click', () => lightboxNav(-1));
    document.getElementById('lightbox-tap-next')?.addEventListener('click', () => lightboxNav(1));

    // Keyboard navigation — capture phase + preventDefault so focused thumbs/buttons
    // behind the overlay can't scroll the page or steal the arrow key.
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !document.getElementById('liked-download-confirm').hidden) {
        hideLikedDownloadConfirm();
        return;
      }
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') {
        e.preventDefault();
        closeLightbox();
        return;
      }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        lightboxNav(e.key === 'ArrowRight' ? 1 : -1);
      }
    }, true);

    // Click backdrop to close
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    // Touch swipe — ignore pinch/multi-touch; require clear horizontal flick
    let touchStartX = 0;
    let touchStartY = 0;
    let touchMulti  = false;

    lightbox.addEventListener('touchstart', (e) => {
      if (e.touches.length > 1) {
        touchMulti = true;
        return;
      }
      touchMulti = false;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    lightbox.addEventListener('touchmove', (e) => {
      if (e.touches.length > 1) touchMulti = true;
    }, { passive: true });

    lightbox.addEventListener('touchend', (e) => {
      if (touchMulti || e.touches.length > 0) {
        touchMulti = e.touches.length > 0;
        return;
      }

      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;

      // Must be a deliberate horizontal swipe, not pinch drift or scroll
      if (Math.abs(dx) < 60) return;
      if (Math.abs(dx) < Math.abs(dy) * 1.5) return;

      lightboxNav(dx < 0 ? 1 : -1);
    }, { passive: true });

    // ════════════════════════════════════════════════════════
    // ALBUM DOWNLOAD (ZIP)
    // ════════════════════════════════════════════════════════
    // ZIP downloads try R2 directly first (full-res), then /api/download as fallback.

    function downloadPhotos(photos) {
      const dlBtn    = document.getElementById('download-btn');
      const selDlBtn = document.getElementById('download-selected-btn');
      const progress = document.getElementById('download-progress');
      const label    = document.getElementById('dl-label');
      const bar      = document.getElementById('dl-bar');

      const list = (photos || []).filter(Boolean);
      if (!list.length) return;

      const isAll = photos === allPhotos;
      const keys = list.map(photoUrlToKey);
      const suffix = isAll ? 'photos' : 'selection';
      const filename = `${album.title.replace(/[^a-z0-9]/gi, '-').toLowerCase()}-${suffix}.zip`;

      if (dlBtn)    { dlBtn.disabled = true; }
      if (selDlBtn) { selDlBtn.disabled = true; }
      progress.classList.add('show');
      bar.style.width = '100%';
      label.textContent = `Zipping ${list.length} photo${list.length !== 1 ? 's' : ''}… your device will save it shortly.`;

      // The Worker builds and streams the ZIP; the browser handles the actual
      // download + progress, so memory stays flat even for full-res albums.
      submitWorkerZip(keys, filename);

      setTimeout(() => {
        resetDownloadProgressUI();
        if (dlBtn) {
          dlBtn.disabled = false;
          dlBtn.innerHTML = `
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Download All`;
        }
        if (selDlBtn) { selDlBtn.disabled = selected.size === 0; }
      }, 6000);
    }

    // ════════════════════════════════════════════════════════
    // FAVORITES (D1 voting via Cloudflare Worker)
    // Only enabled when the album's tier is unlocked.
    // ════════════════════════════════════════════════════════

    const FAV_SESSION_KEY = 'fav_session_id';
    let heartedUrls = new Set();  // URLs the current session has hearted
    let favEnabled = false;       // true when tier unlocked for this album

    function getFavSessionId() {
      try {
        let id = localStorage.getItem(FAV_SESSION_KEY);
        if (!id) {
          id = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);
          localStorage.setItem(FAV_SESSION_KEY, id);
        }
        return id;
      } catch { return 'anon'; }
    }

    async function initFavorites(albumId, tierGranted) {
      favEnabled = tierGranted;
      if (!favEnabled) return;

      const sessionId = getFavSessionId();
      const workerBase = (typeof WORKER_BASE_URL !== 'undefined') ? WORKER_BASE_URL : '';
      if (!workerBase) return;

      // Load which photos this session has already hearted
      try {
        const res = await fetch(
          `${workerBase}/favorites?albumId=${encodeURIComponent(albumId)}&sessionId=${encodeURIComponent(sessionId)}`
        );
        if (res.ok) {
          const { heartedUrls: urls } = await res.json();
          heartedUrls = new Set(urls || []);
        }
      } catch { /* Worker not deployed yet — fail silently */ }

      // Mark already-hearted thumbs and enable the fav UI on the grid
      const digitalGrid = document.getElementById('photo-grid');
      if (digitalGrid) {
        digitalGrid.classList.add('favorites-enabled');
        digitalGrid.querySelectorAll('.fav-badge').forEach(badge => {
          if (heartedUrls.has(badge.dataset.favUrl)) badge.classList.add('hearted');
        });
      }

      // Show lightbox fav button
      const favBtn = document.getElementById('lightbox-fav');
      if (favBtn) favBtn.style.display = '';
    }

    async function toggleFav(url) {
      if (!favEnabled) return;
      const sessionId = getFavSessionId();
      const albumId = album?.id;
      const workerBase = (typeof WORKER_BASE_URL !== 'undefined') ? WORKER_BASE_URL : '';
      if (!workerBase || !albumId) return;

      const wasHearted = heartedUrls.has(url);
      // Optimistic update
      if (wasHearted) heartedUrls.delete(url); else heartedUrls.add(url);
      updateFavUI(url);

      try {
        const res = await fetch(`${workerBase}/favorites/toggle`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ albumId, photoUrl: url, sessionId }),
        });
        if (res.ok) {
          const { hearted } = await res.json();
          if (hearted) heartedUrls.add(url); else heartedUrls.delete(url);
          updateFavUI(url);
        } else {
          // Revert on failure
          if (wasHearted) heartedUrls.add(url); else heartedUrls.delete(url);
          updateFavUI(url);
        }
      } catch {
        // Revert on network error
        if (wasHearted) heartedUrls.add(url); else heartedUrls.delete(url);
        updateFavUI(url);
      }
    }

    function updateFavUI(url) {
      // Update all fav badges for this URL in the grid
      document.querySelectorAll(`.fav-badge[data-fav-url="${CSS.escape(url)}"]`).forEach(badge => {
        badge.classList.toggle('hearted', heartedUrls.has(url));
        badge.setAttribute('aria-label', heartedUrls.has(url) ? 'Remove from favorites' : 'Add to favorites');
      });
      // Update lightbox fav button if this is the current photo
      updateLightboxFavButton();
    }

    function updateLightboxFavButton() {
      const favBtn = document.getElementById('lightbox-fav');
      if (!favBtn || favBtn.style.display === 'none') return;
      const url = allPhotos[currentIndex];
      if (!url) return;
      const hearted = heartedUrls.has(url);
      favBtn.classList.toggle('hearted', hearted);
      favBtn.setAttribute('aria-pressed', hearted ? 'true' : 'false');
      favBtn.setAttribute('aria-label', hearted ? 'Remove from favorites' : 'Add to favorites');
    }

    // Wire fav badge clicks (delegated from grids)
    document.getElementById('photo-grid')?.addEventListener('click', (e) => {
      const badge = e.target.closest('.fav-badge');
      if (!badge) return;
      e.stopPropagation();
      toggleFav(badge.dataset.favUrl);
    });

    // Wire lightbox fav button
    const favBtn = document.getElementById('lightbox-fav');
    if (favBtn) {
      favBtn.addEventListener('click', () => {
        const url = allPhotos[currentIndex];
        if (url) toggleFav(url);
      });
    }
  </script>

  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60%  { transform: translateX(-8px); }
      40%, 80%  { transform: translateX(8px); }
    }

    /* ── Selection bar ── */
    #selection-bar {
      position: fixed;
      bottom: 0;
      left: 0; right: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.5rem;
      padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
      background: var(--nav-scrolled-bg);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--color-border);
      transform: translateY(100%);
      visibility: hidden;
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), visibility 0.3s;
      flex-wrap: wrap;
    }
    #selection-bar.show {
      transform: translateY(0);
      visibility: visible;
      pointer-events: auto;
    }
    #selection-count {
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      color: var(--color-muted);
    }
    #select-all-btn, #cancel-select-btn, #clear-selected-btn {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-muted);
      background: transparent;
      border: 1px solid var(--color-border);
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    #select-all-btn:hover, #cancel-select-btn:hover, #clear-selected-btn:hover {
      color: var(--color-text);
      border-color: rgba(255,255,255,0.2);
    }
    #cancel-select-btn { border-color: transparent; }

    #selection-bar #download-selected-btn {
      padding: 0.4rem 0.75rem;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      gap: 0.35rem;
    }

    @media (max-width: 640px) {
      #selection-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 0.5rem;
        padding: 0.6rem 1rem;
        padding-bottom: calc(0.6rem + env(safe-area-inset-bottom, 0px));
      }

      #selection-count {
        font-size: 0.6875rem;
        letter-spacing: 0.06em;
      }

      #selection-bar .flex.items-center {
        gap: 0.35rem;
        flex-wrap: wrap;
      }

      #select-all-btn,
      #cancel-select-btn,
      #clear-selected-btn,
      #selection-bar #download-selected-btn {
        font-size: 0.625rem;
        letter-spacing: 0.08em;
        padding: 0.32rem 0.5rem;
        gap: 0.25rem;
      }

      #selection-bar #download-selected-btn {
        flex: 1 1 auto;
        min-width: 0;
        justify-content: center;
      }

      #selection-bar #download-selected-btn svg {
        width: 11px;
        height: 11px;
      }

      #cancel-select-btn {
        padding-left: 0.35rem;
        padding-right: 0.35rem;
      }

      body.album-select-mode main {
        padding-bottom: calc(6.75rem + env(safe-area-inset-bottom, 0px));
      }
    }

    .clear-selection-btn {
      color: var(--color-muted);
    }

    .clear-selection-btn:hover {
      color: var(--color-text);
    }

    /* ── Selection heart on thumbnails ── */
    .select-mode .photo-thumb { cursor: pointer; }
    .select-mode .photo-thumb-overlay { opacity: 0 !important; }

    .photo-thumb.selected::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(201,169,110,0.15);
      pointer-events: none;
    }

    .photo-thumb-like {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.85);
      opacity: 0;
      transition: opacity 0.15s, color 0.15s;
      pointer-events: none;
    }

    .photo-thumb-like svg {
      fill: none;
      stroke: currentColor;
    }

    .photo-thumb.selected .photo-thumb-like {
      opacity: 1;
      color: var(--color-gold);
    }

    .photo-thumb.selected .photo-thumb-like svg {
      fill: var(--color-gold);
      stroke: var(--color-gold);
    }

    .select-mode .photo-thumb-like {
      opacity: 0.75;
    }

    .select-mode .photo-thumb.selected .photo-thumb-like {
      opacity: 1;
    }

    .liked-count-btn {
      border-color: rgba(201, 169, 110, 0.45);
      color: var(--color-gold);
    }

    .liked-count-btn svg {
      fill: var(--color-gold);
      stroke: var(--color-gold);
    }

    /* ── Favorites hearts (D1 voting, shown when tier unlocked) ── */
    .fav-badge {
      position: absolute;
      bottom: 8px; right: 8px;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: rgba(0,0,0,0.45);
      display: none; /* shown via .favorites-enabled on parent */
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: rgba(255,255,255,0.75);
      transition: color 0.15s, background 0.15s;
      z-index: 4;
    }
    .fav-badge svg { fill: none; stroke: currentColor; transition: fill 0.15s; }
    .fav-badge.hearted { color: #e85d6e; background: rgba(0,0,0,0.55); }
    .fav-badge.hearted svg { fill: #e85d6e; stroke: #e85d6e; }
    .fav-badge:hover { background: rgba(0,0,0,0.7); }
    /* Show all fav badges on tiles when favorites are enabled for this album */
    .favorites-enabled .photo-thumb .fav-badge { display: flex; }
    /* Keep fav badge hidden in select mode (ZIP selection UI takes over) */
    .select-mode .fav-badge { display: none !important; }

    /* Lightbox fav button hearted state */
    #lightbox-fav.hearted svg { fill: #e85d6e; stroke: #e85d6e; }
    #lightbox-fav { color: rgba(255,255,255,0.6); }
    #lightbox-fav.hearted { color: #e85d6e; }

    .liked-download-confirm {
      position: fixed;
      inset: 0;
      z-index: 250;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(8px);
    }

    .liked-download-confirm[hidden] {
      display: none;
    }

    .liked-download-confirm-inner {
      width: min(100%, 22rem);
      padding: 1.75rem;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      text-align: center;
    }

    .liked-download-confirm-actions {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    /* ── Select button active state ── */
    #select-btn.active {
      border-color: var(--color-gold);
      color: var(--color-gold);
    }

    /* Add room for selection bar (main already has pb-24; extend, don't double) */
    body.album-select-mode main {
      padding-bottom: calc(9.5rem + env(safe-area-inset-bottom, 0px));
    }
  </style>
</body>
