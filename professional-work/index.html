  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/portfolio.css" />
</head>
<body class="overflow-x-hidden gallery-catalog gallery-year-chapters">

  <!-- ── Navigation ── -->

    <a href="/" class="nav-logo" aria-label="Raveen Fernando">RF<span class="nav-logo-dot">.</span></a>
    <ul class="nav-links">
      <li><a href="/personal-work/" data-nav-link data-nav="gallery">Personal work</a></li>
      <li><a href="/professional-work/" data-nav-link data-nav="professional">Professional work</a></li>
      <li id="nav-about-item"><a href="/about/" data-nav-link data-nav="about">About</a></li>
      <li><a href="/#contact" data-nav-link data-nav="contact">Contact</a></li>
      <li id="nav-unlock-item" class="nav-dropdown">
        <button type="button" id="nav-unlock-trigger" class="nav-dropdown-trigger" data-nav-link data-nav="unlock" aria-expanded="false" aria-haspopup="true" aria-controls="nav-private-menu">Private Access</button>
        <div id="nav-private-menu" class="nav-dropdown-menu" role="menu" hidden></div>
      </li>
    </ul>
    <button id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </nav>

  <div id="mobile-menu" role="dialog" aria-label="Navigation menu">
    <div class="mobile-menu-sheet">
    <a href="/personal-work/">Personal work</a>
    <a href="/professional-work/" id="mobile-professional-work-link">Professional work</a>
    <a href="/about/" id="mobile-about-link">About</a>
    <a href="/#contact">Contact</a>
    <div id="mobile-private-access" class="mobile-private-access">
      <button type="button" id="mobile-private-trigger" aria-expanded="false" aria-controls="mobile-private-menu">Private Access</button>
      <div id="mobile-private-menu" class="mobile-private-menu" hidden></div>
    </div>
    </div>
  </div>

  <main id="home-chapters" aria-label="Events, engagements, and portraits" style="padding-top: var(--nav-height)"></main>

  <footer>
    <p id="footer-copyright"></p>
  </footer>

  <script src="/js/config.js"></script>
  <script src="/js/portfolio.js"></script>
  <script src="/js/albums/clients.js"></script>
  <script src="/js/albums/family-2025.js"></script>
  <script src="/js/albums/family-2026.js"></script>
  <script src="/js/albums/california-2025.js"></script>
  <script src="/js/albums/misc-2026.js"></script>
  <script src="/js/albums/italy-2026.js"></script>
  <script src="/js/albums/morgan-alden-2026.js"></script>
  <script src="/js/albums.js"></script>
  <script src="/js/portfolio-preview.js"></script>
  <script src="/js/routes.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.getElementById('footer-copyright').textContent =
      `© ${new Date().getFullYear()} ${SITE_CONFIG.photographerName}`;

    const moksha = ALBUMS.find(album => album.id === 'moksha-yoga');
    const chapters = [
      {
        title: 'Events',
        href: '/photos/events/',
        cta: 'View work',
        image: moksha?.coverImage || `${R2_BASE_URL}/Moksha-Yoga/Moksha-Yoga-05.jpg`,
      },
      {
        title: 'Engagements',
        href: '/photos/engagements/',
        cta: portfolioPhotos('engagements').length ? 'View work' : 'Coming soon',
      },
      {
        title: 'Portraits',
        href: '/photos/portraits/',
        cta: portfolioPhotos('portraits').length ? 'View work' : 'Coming soon',
      },
    ];

    const root = document.getElementById('home-chapters');
    chapters.forEach((chapter, index) => {
      const link = document.createElement('a');
      link.className = 'home-banner';
      link.href = chapter.href;

      const media = document.createElement('div');
      media.className = 'home-banner-media';
      if (chapter.image) {
        const img = document.createElement('img');
        img.alt = '';
        img.decoding = 'async';
        img.loading = index === 0 ? 'eager' : 'lazy';
        img.addEventListener('load', () => img.classList.add('loaded'));
        img.src = typeof viewUrl === 'function' ? viewUrl(chapter.image) : chapter.image;
        media.appendChild(img);
      }

      const copy = document.createElement('div');
      copy.className = 'home-banner-copy';
      const title = document.createElement('p');
      title.className = 'home-banner-title';
      title.textContent = chapter.title;
      const cta = document.createElement('span');
      cta.className = 'home-banner-cta';
      cta.textContent = chapter.cta;
      copy.append(title, cta);

      const shade = document.createElement('div');
      shade.className = 'home-banner-shade';
      link.append(media, shade, copy);
      root.appendChild(link);
    });
  </script>
</body>
</html>
