<!DOCTYPE html>
<html lang="en">
<head>
  <script>if(sessionStorage.getItem("site_unlocked")!=="true"){window.location.replace("login.html?return="+encodeURIComponent(window.location.href));}</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Album — Raveen Fernando</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <script>tailwind.config = { theme: { extend: { colors: { gold: '#c9a96e' } } } }</script>

  <!-- JSZip for album download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- FileSaver for triggering the download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <!-- Flickr justified-layout: all images scaled to equal row height -->
  <script src="js/justified-layout.js"></script>
</head>
<body class="overflow-x-hidden">

  <!-- ── Navigation ── -->
  <nav id="main-nav" class="nav-scrolled">
    <a href="index.html" class="nav-logo">RF<span>.</span></a>
    <ul class="nav-links">
      <li><a href="index.html"   data-nav-link>Home</a></li>
      <li><a href="gallery.html" data-nav-link>Gallery</a></li>
    </ul>
    <button id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </nav>

  <div id="mobile-menu" role="dialog" aria-label="Navigation menu">
    <a href="index.html">Home</a>
    <a href="gallery.html">Gallery</a>
  </div>

  <!-- ── Password Modal (shown for protected albums) ── -->
  <div id="password-modal" style="display:none">
    <div class="password-modal-inner">
      <!-- Lock icon -->
      <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>

      <h1 class="font-serif text-3xl font-light mb-2" id="modal-album-title">Private Album</h1>
      <p class="text-sm mb-8" style="color:var(--color-muted)">Enter the password to view this album.</p>

      <form id="password-form" novalidate>
        <div style="position:relative;margin-bottom:0.5rem">
          <input
            type="password"
            id="password-input"
            class="form-field text-center text-lg tracking-widest"
            placeholder="············"
            autocomplete="current-password"
            style="text-align:center;letter-spacing:0.3em"
            aria-label="Album password"
          />
        </div>
        <p class="password-error" id="password-error" role="alert"></p>
        <button type="submit" class="btn-primary mt-6 w-full justify-center"
                style="width:100%;margin-top:1.5rem;justify-content:center">
          Unlock Album
        </button>
      </form>

      <a href="gallery.html" class="block mt-6 text-xs tracking-widest uppercase"
         style="color:var(--color-muted);text-decoration:none;transition:color 0.3s">
        ← Back to Gallery
      </a>
    </div>
  </div>

  <!-- ── Album Content (revealed after auth) ── -->
  <div id="album-content" style="display:none">

    <!-- Album header -->
    <header class="px-6 md:px-12 pt-28 pb-10">
      <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-6">
        <div>
          <a id="back-link" href="gallery.html" class="inline-flex items-center gap-2 text-xs tracking-widest uppercase mb-4"
             style="color:var(--color-muted);text-decoration:none;transition:color 0.3s"
             onmouseover="this.style.color='var(--color-text)'"
             onmouseout="this.style.color='var(--color-muted)'">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            <span id="back-label">All Albums</span>
          </a>
          <h1 class="font-serif text-4xl md:text-5xl font-light" id="album-title" style="letter-spacing:0.04em"></h1>
          <p class="mt-2 text-sm" id="album-description" style="color:var(--color-muted)"></p>
          <p class="mt-1 text-xs tracking-widest uppercase" id="album-count" style="color:rgba(240,237,232,0.3)"></p>
        </div>

        <!-- Download / Select buttons -->
        <div class="flex items-center gap-3 shrink-0">
          <button id="select-btn" class="btn-ghost" onclick="toggleSelectMode()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
              <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
            Select
          </button>
          <button id="download-btn" class="btn-primary" onclick="downloadPhotos(album.photos)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Download All
          </button>
        </div>
      </div>
      <div class="gold-rule" style="margin-left:0;margin-top:2rem"></div>
    </header>

    <!-- Photo grid -->
    <main class="px-6 md:px-8 pb-24">
      <div class="photo-grid" id="photo-grid">
        <!-- Populated by JS -->
      </div>
    </main>

  </div>

  <!-- ── Selection action bar ── -->
  <div id="selection-bar">
    <span id="selection-count">0 selected</span>
    <div class="flex items-center gap-3">
      <button id="select-all-btn" onclick="toggleSelectAll()">Select all</button>
      <button id="download-selected-btn" class="btn-primary" onclick="downloadSelected()" disabled>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download Selected
      </button>
      <button id="cancel-select-btn" onclick="toggleSelectMode()">Cancel</button>
    </div>
  </div>

  <!-- ── Lightbox ── -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button id="lightbox-close" aria-label="Close lightbox" onclick="closeLightbox()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>

    <button class="lightbox-nav" id="lightbox-prev" aria-label="Previous photo" onclick="lightboxNav(-1)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <div id="lightbox-stage">
      <img id="lightbox-img-a" class="lightbox-layer" alt="Photo" />
      <img id="lightbox-img-b" class="lightbox-layer" alt="Photo" />
    </div>

    <button class="lightbox-nav" id="lightbox-next" aria-label="Next photo" onclick="lightboxNav(1)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>

    <p id="lightbox-counter"></p>
  </div>

  <!-- ── Download Progress Toast ── -->
  <div id="download-progress">
    <p id="dl-label" class="font-sans text-sm" style="color:var(--color-text)">Preparing download…</p>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="dl-bar"></div>
    </div>
  </div>

  <!-- ── Footer ── -->
  <footer>
    <p id="footer-copyright"></p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script>SiteAuth.guard();</script>
  <script>
    // ════════════════════════════════════════════════════════
    // ALBUM PAGE LOGIC
    // ════════════════════════════════════════════════════════

    // ── Get album from URL param ──
    const params    = new URLSearchParams(window.location.search);
    const albumId   = params.get('id');
    const album     = ALBUMS.find(a => a.id === albumId);

    if (!album) {
      document.body.innerHTML = `
        <div style="height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.5rem;text-align:center;padding:2rem">
          <p class="font-serif text-3xl font-light">Album not found</p>
          <a href="gallery.html" class="btn-ghost">Back to Gallery</a>
        </div>`;
    } else {
      // Update page title
      document.title = `${album.title} — ${SITE_CONFIG.photographerName}`;
      document.getElementById('footer-copyright').textContent =
        `© ${new Date().getFullYear()} ${SITE_CONFIG.photographerName}`;

      // If this is a sub-album, update back link and enforce parent group lock
      if (album.parentId) {
        const parent = ALBUMS.find(a => a.id === album.parentId);
        if (parent) {
          document.getElementById('back-link').href = `album-group.html?id=${album.parentId}`;
          document.getElementById('back-label').textContent = parent.title;

          // If the parent group is password-protected and not yet unlocked, gate here
          if (parent.protected && !AlbumAuth.isUnlocked(parent.id)) {
            window.location.replace(`album-group.html?id=${album.parentId}`);
          }
        }
      }

      // ── Auth check ──
      if (!album.protected || AlbumAuth.isUnlocked(album.id)) {
        showAlbum();
      } else {
        showPasswordModal();
      }
    }

    // ── Show password modal ──
    function showPasswordModal() {
      document.getElementById('modal-album-title').textContent = album.title;
      document.getElementById('password-modal').style.display = 'flex';

      const form  = document.getElementById('password-form');
      const input = document.getElementById('password-input');
      const error = document.getElementById('password-error');

      input.focus();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        error.textContent = '';
        const btn = form.querySelector('button[type="submit"]');
        btn.textContent = 'Checking…';
        btn.disabled = true;

        const hash = await hashPassword(input.value.trim());

        if (hash === album.passwordHash) {
          AlbumAuth.unlock(album.id);
          document.getElementById('password-modal').style.display = 'none';
          showAlbum();
        } else {
          error.textContent = 'Incorrect password. Please try again.';
          input.value = '';
          input.focus();
          btn.textContent = 'Unlock Album';
          btn.disabled = false;

          // Shake animation
          input.style.animation = 'shake 0.4s ease';
          input.addEventListener('animationend', () => { input.style.animation = ''; }, { once: true });
        }
      });
    }

    // ── Render album grid ──
    let currentIndex = 0;
    let selectMode   = false;
    const selected   = new Set();

    function toggleSelectMode() {
      selectMode = !selectMode;
      selected.clear();

      document.getElementById('selection-bar').classList.toggle('show', selectMode);
      document.getElementById('photo-grid').classList.toggle('select-mode', selectMode);
      document.getElementById('select-btn').classList.toggle('active', selectMode);

      // Reset all thumb selected state
      document.querySelectorAll('.photo-thumb').forEach(t => t.classList.remove('selected'));
      updateSelectionBar();
    }

    function toggleThumb(index, thumb) {
      if (selected.has(index)) {
        selected.delete(index);
        thumb.classList.remove('selected');
      } else {
        selected.add(index);
        thumb.classList.add('selected');
      }
      updateSelectionBar();
    }

    function toggleSelectAll() {
      const thumbs = Array.from(document.querySelectorAll('.photo-thumb'));
      if (selected.size === album.photos.length) {
        // Deselect all
        selected.clear();
        thumbs.forEach(t => t.classList.remove('selected'));
      } else {
        // Select all
        album.photos.forEach((_, i) => selected.add(i));
        thumbs.forEach(t => t.classList.add('selected'));
      }
      updateSelectionBar();
    }

    function updateSelectionBar() {
      const count = selected.size;
      const total = album.photos.length;
      let countText = count === 0 ? 'No photos selected' : `${count} of ${total} selected`;
      if (count > 0 && count <= INDIVIDUAL_THRESHOLD) countText += ' · downloads individually';
      else if (count > INDIVIDUAL_THRESHOLD) countText += ' · downloads as ZIP';
      document.getElementById('selection-count').textContent = countText;
      document.getElementById('download-selected-btn').disabled = count === 0;
      document.getElementById('select-all-btn').textContent =
        count === total ? 'Deselect all' : 'Select all';
    }

    const INDIVIDUAL_THRESHOLD = 5;

    function downloadSelected() {
      const urls = Array.from(selected).sort((a, b) => a - b).map(i => album.photos[i]);
      if (urls.length <= INDIVIDUAL_THRESHOLD) {
        downloadIndividually(urls);
      } else {
        downloadPhotos(urls);
      }
    }

    async function downloadIndividually(photos) {
      const label    = document.getElementById('dl-label');
      const bar      = document.getElementById('dl-bar');
      const progress = document.getElementById('download-progress');
      const selDlBtn = document.getElementById('download-selected-btn');

      selDlBtn.disabled = true;
      progress.classList.add('show');
      label.textContent = `Downloading ${photos.length} photo${photos.length !== 1 ? 's' : ''}…`;

      for (let i = 0; i < photos.length; i++) {
        try {
          // Route through /api/download so no CORS required
          const proxyUrl = `/api/download?url=${encodeURIComponent(photos[i])}`;
          const response = await fetch(proxyUrl);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const blob = await response.blob();
          const filename = photos[i].split('/').pop().split('?')[0];
          saveAs(blob, filename);
        } catch (err) {
          console.warn(`Could not download photo ${i + 1}:`, err.message);
        }
        bar.style.width = Math.round(((i + 1) / photos.length) * 100) + '%';
        label.textContent = `${i + 1} of ${photos.length} downloaded…`;
        if (i < photos.length - 1) await new Promise(r => setTimeout(r, 400));
      }

      label.textContent = 'Done!';
      setTimeout(() => {
        progress.classList.remove('show');
        bar.style.width = '0%';
        selDlBtn.disabled = selected.size === 0;
      }, 1500);
    }

    function showAlbum() {
      document.getElementById('album-content').style.display = 'block';
      document.getElementById('album-title').textContent       = album.title;
      document.getElementById('album-description').textContent = album.description;
      document.getElementById('album-count').textContent       = `${album.photos.length} Photos`;

      const grid = document.getElementById('photo-grid');
      grid.innerHTML = '';

      album.photos.forEach((url, i) => {
        const thumb = document.createElement('div');
        thumb.className = 'photo-thumb';
        thumb.setAttribute('tabindex', '0');
        thumb.setAttribute('role', 'button');
        thumb.setAttribute('aria-label', `Open photo ${i + 1}`);

        const img = document.createElement('img');
        img.alt     = `${album.title} — photo ${i + 1}`;
        img.loading = i < 6 ? 'eager' : 'lazy';
        img.addEventListener('load', () => img.classList.add('loaded'));
        img.addEventListener('error', () => { img.src = url; }, { once: true });
        img.src = gridUrl(url);

        const expandOverlay = document.createElement('div');
        expandOverlay.className = 'photo-thumb-overlay';
        expandOverlay.innerHTML = `
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1">
            <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
          </svg>`;

        // Checkmark overlay for select mode
        const checkOverlay = document.createElement('div');
        checkOverlay.className = 'photo-thumb-check';
        checkOverlay.innerHTML = `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>`;

        thumb.appendChild(img);
        thumb.appendChild(expandOverlay);
        thumb.appendChild(checkOverlay);

        const handleClick = () => {
          if (selectMode) {
            toggleThumb(i, thumb);
          } else {
            openLightbox(i);
          }
        };
        thumb.addEventListener('click', handleClick);
        thumb.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') handleClick(); });

        grid.appendChild(thumb);
      });

      // ── Justified row layout (Flickr-style) ──
      // Every row is scaled to the same height; images fill the full row width.
      function runJustifiedLayout() {
        const items = Array.from(grid.querySelectorAll('.photo-thumb'));
        if (!items.length) return;

        const containerWidth = grid.offsetWidth;
        if (!containerWidth) return;

        const aspectRatios = items.map(item => {
          const img = item.querySelector('img');
          if (img.naturalWidth && img.naturalHeight) {
            return img.naturalWidth / img.naturalHeight;
          }
          return 1.5; // default landscape fallback before images load
        });

        const layout = justifiedLayout(aspectRatios, {
          containerWidth: containerWidth,
          targetRowHeight: 420,
          boxSpacing: 12,
          containerPadding: 0,
        });

        grid.style.height = layout.containerHeight + 'px';

        items.forEach((item, i) => {
          const box = layout.boxes[i];
          item.style.left   = box.left + 'px';
          item.style.top    = box.top  + 'px';
          item.style.width  = box.width + 'px';
          item.style.height = box.height + 'px';
        });
      }

      // Run immediately with fallback aspect ratios, then re-run as each image loads
      runJustifiedLayout();

      const allImgs = grid.querySelectorAll('img');
      allImgs.forEach(img => {
        if (img.complete && img.naturalWidth) { runJustifiedLayout(); }
        else { img.addEventListener('load', runJustifiedLayout); }
      });

      window.addEventListener('resize', runJustifiedLayout);
    }

    // ════════════════════════════════════════════════════════
    // LIGHTBOX
    // ════════════════════════════════════════════════════════
    const lightbox    = document.getElementById('lightbox');
    const lightboxLayers = [
      document.getElementById('lightbox-img-a'),
      document.getElementById('lightbox-img-b'),
    ];
    let activeLayer = 0;
    const counter     = document.getElementById('lightbox-counter');

    async function showLightboxPhoto(fullResUrl, index) {
      const grid = gridUrl(fullResUrl);
      const nextLayer = 1 - activeLayer;
      const nextImg = lightboxLayers[nextLayer];
      const currentImg = lightboxLayers[activeLayer];
      let isFull = false;

      try {
        await ImagePreload.load(fullResUrl);
        await ImagePreload.apply(nextImg, fullResUrl);
        isFull = true;
      } catch {
        await ImagePreload.apply(nextImg, grid);
      }

      if (!lightbox.classList.contains('open') || currentIndex !== index) return;

      nextImg.classList.add('active');
      currentImg.classList.remove('active');
      activeLayer = nextLayer;

      if (!isFull) {
        ImagePreload.load(fullResUrl).then(async () => {
          if (!lightbox.classList.contains('open') || currentIndex !== index) return;
          await ImagePreload.apply(lightboxLayers[activeLayer], fullResUrl);
        }).catch(() => {});
      }
    }

    function openLightbox(index) {
      currentIndex = index;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
      loadLightboxImage(index);
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
      lightboxLayers.forEach(layer => {
        layer.classList.remove('active');
        layer.src = '';
      });
      activeLayer = 0;
    }

    function loadLightboxImage(index) {
      const url = album.photos[index];

      counter.textContent = `${index + 1} / ${album.photos.length}`;
      document.getElementById('lightbox-prev').style.visibility = index === 0 ? 'hidden' : 'visible';
      document.getElementById('lightbox-next').style.visibility = index === album.photos.length - 1 ? 'hidden' : 'visible';

      showLightboxPhoto(url, index);
      ImagePreload.preloadAdjacent(album.photos, index);
    }

    function lightboxNav(dir) {
      const newIndex = currentIndex + dir;
      if (newIndex >= 0 && newIndex < album.photos.length) {
        currentIndex = newIndex;
        loadLightboxImage(currentIndex);
      }
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape')     closeLightbox();
      if (e.key === 'ArrowLeft')  lightboxNav(-1);
      if (e.key === 'ArrowRight') lightboxNav(1);
    });

    // Click backdrop to close
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    // Touch swipe support
    let touchStartX = 0;
    lightbox.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].clientX; }, { passive: true });
    lightbox.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 50) lightboxNav(dx < 0 ? 1 : -1);
    });

    // ════════════════════════════════════════════════════════
    // ALBUM DOWNLOAD (ZIP)
    // ════════════════════════════════════════════════════════
    // ⚠️  R2 CORS: Your R2 bucket must allow cross-origin GET
    //     requests from this domain. Add a CORS rule in the
    //     Cloudflare R2 dashboard under Settings → CORS.
    //     Example rule:
    //       AllowedOrigins: ["https://yourdomain.com"]
    //       AllowedMethods: ["GET"]

    async function downloadPhotos(photos) {
      const dlBtn    = document.getElementById('download-btn');
      const selDlBtn = document.getElementById('download-selected-btn');
      const progress = document.getElementById('download-progress');
      const label    = document.getElementById('dl-label');
      const bar      = document.getElementById('dl-bar');

      const isAll = photos === album.photos;
      if (dlBtn)    { dlBtn.disabled = true; }
      if (selDlBtn) { selDlBtn.disabled = true; }
      progress.classList.add('show');
      label.textContent = `Downloading ${photos.length} photo${photos.length !== 1 ? 's' : ''}…`;

      const zip    = new JSZip();
      const folder = zip.folder(album.title);
      const total  = photos.length;
      let completed = 0;

      const fetchPhoto = async (url, index) => {
        try {
          const response = await fetch(url, { mode: 'cors' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const blob = await response.blob();
          const ext = url.split('.').pop().split('?')[0] || 'jpg';
          folder.file(String(index + 1).padStart(3, '0') + '.' + ext, blob);
        } catch (err) {
          console.warn(`Could not fetch photo ${index + 1}:`, err.message);
        }
        completed++;
        bar.style.width   = Math.round((completed / total) * 100) + '%';
        label.textContent = `${completed} of ${total} photos…`;
      };

      const BATCH = 4;
      for (let i = 0; i < total; i += BATCH) {
        await Promise.all(photos.slice(i, i + BATCH).map((url, j) => fetchPhoto(url, i + j)));
      }

      label.textContent = 'Creating ZIP file…';
      try {
        const blob     = await zip.generateAsync({ type: 'blob' });
        const suffix   = isAll ? 'photos' : 'selection';
        const filename = `${album.title.replace(/[^a-z0-9]/gi, '-').toLowerCase()}-${suffix}.zip`;
        saveAs(blob, filename);
        label.textContent = 'Download started!';
      } catch (err) {
        label.textContent = 'Error creating ZIP. Try again.';
        console.error(err);
      }

      setTimeout(() => {
        progress.classList.remove('show');
        bar.style.width = '0%';
        if (dlBtn) {
          dlBtn.disabled = false;
          dlBtn.innerHTML = `
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Download All`;
        }
        if (selDlBtn) { selDlBtn.disabled = selected.size === 0; }
      }, 2500);
    }
  </script>

  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60%  { transform: translateX(-8px); }
      40%, 80%  { transform: translateX(8px); }
    }

    /* ── Selection bar ── */
    #selection-bar {
      position: fixed;
      bottom: -80px;
      left: 0; right: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.5rem;
      background: var(--nav-scrolled-bg);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--color-border);
      transition: bottom 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      flex-wrap: wrap;
    }
    #selection-bar.show { bottom: 0; }
    #selection-count {
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      color: var(--color-muted);
    }
    #select-all-btn, #cancel-select-btn {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-muted);
      background: transparent;
      border: 1px solid var(--color-border);
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    #select-all-btn:hover, #cancel-select-btn:hover {
      color: var(--color-text);
      border-color: rgba(255,255,255,0.2);
    }
    #cancel-select-btn { border-color: transparent; }

    /* ── Select mode thumbnail states ── */
    .photo-thumb-check {
      position: absolute;
      top: 8px; right: 8px;
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.5);
      background: rgba(0,0,0,0.3);
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s, border-color 0.15s;
      pointer-events: none;
    }
    .select-mode .photo-thumb-check { opacity: 1; }
    .select-mode .photo-thumb { cursor: pointer; }
    .select-mode .photo-thumb-overlay { opacity: 0 !important; }
    .select-mode .photo-thumb:hover .photo-thumb-check {
      border-color: rgba(255,255,255,0.8);
      background: rgba(0,0,0,0.5);
    }
    .photo-thumb.selected .photo-thumb-check {
      background: var(--color-gold) !important;
      border-color: var(--color-gold) !important;
      opacity: 1;
    }
    .photo-thumb.selected::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(201,169,110,0.15);
      pointer-events: none;
    }

    /* ── Select button active state ── */
    #select-btn.active {
      border-color: var(--color-gold);
      color: var(--color-gold);
    }

    /* Add padding to grid when selection bar is visible */
    .select-mode ~ * { padding-bottom: 80px; }
  </style>
</body>
</html>
