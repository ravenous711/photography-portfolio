<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Raveen Fernando — Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/config.js"></script>
  <script src="/js/routes.js"></script>
  <style>
    body { background: #f8f7f5; color: #1a1a1a; }
    @media (prefers-color-scheme: dark) {
      body { background: #0c0c0c; color: #f0ede8; }
      input { background: rgba(255,255,255,0.05) !important; border-color: rgba(255,255,255,0.1) !important; color: #f0ede8 !important; }
      input::placeholder { color: rgba(240,237,232,0.3) !important; }
      button[type=submit] { background: #f0ede8 !important; color: #0c0c0c !important; }
      p.text-black\/30 { color: rgba(240,237,232,0.3) !important; }
    }
    input:focus { outline: none; }
    .shake { animation: shake 0.4s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm text-center">
    <p class="text-black/30 text-xs tracking-[0.2em] uppercase mb-3">Preview Access</p>
    <h1 class="text-black text-2xl font-light tracking-widest mb-10" id="site-name">–</h1>

    <form id="login-form" class="space-y-4" novalidate>
      <input
        id="password-input"
        type="password"
        placeholder="Enter password"
        autocomplete="current-password"
        class="w-full bg-black/5 border border-black/10 text-black placeholder-black/30 rounded px-4 py-3 text-center tracking-widest focus:border-black/40 transition-colors"
      />
      <button
        type="submit"
        class="w-full bg-black text-white font-medium py-3 rounded hover:bg-black/80 active:scale-95 transition-all"
      >
        Enter
      </button>
      <p id="error-msg" class="text-red-500/80 text-sm hidden">Incorrect password</p>
    </form>
  </div>

  <script>
    window.location.replace(Routes.home);
  </script>
</body>
</html>
