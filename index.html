<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preload" as="image" href="/images/hero.jpg" />
  <title>Raveen Fernando — Photography</title>
  <meta name="description" content="Photography portfolio of Raveen Fernando — landscapes, street, travel, and beyond." />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom styles -->
  <link rel="stylesheet" href="/css/style.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { gold: '#c9a96e' }
        }
      }
    }
  </script>
  <style>
    #feat-col-left,
    #feat-col-right { gap: 56px !important; }
    #featured-photos-grid { gap: 56px !important; }
    @media (max-width: 640px) {
      #feat-col-left,
      #feat-col-right { gap: 28px !important; }
      #featured-photos-grid { gap: 28px !important; }
    }
  </style>
</head>
<body class="overflow-x-hidden">

  <!-- ── Navigation ── -->
  <nav id="main-nav">
    <a href="/" class="nav-logo">RF<span>.</span></a>

    <!-- Desktop links -->
    <ul class="nav-links">
      <li><a href="/"   data-nav-link data-nav="home">Home</a></li>
      <li><a href="/gallery/" data-nav-link data-nav="gallery">Gallery</a></li>
      <li><a href="/about/" data-nav-link data-nav="about">About</a></li>
    </ul>

    <!-- Hamburger -->
    <button id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </nav>

  <!-- Mobile menu overlay -->
  <div id="mobile-menu" role="dialog" aria-label="Navigation menu">
    <a href="/">Home</a>
    <a href="/gallery/">Gallery</a>
    <a href="/about/">About</a>
  </div>

  <!-- ── Hero ── -->
  <section class="hero">
    <!-- R2: Set background-image to your R2 hero URL in config.js — injected below -->
    <div class="hero-bg" id="hero-bg"></div>
    <div class="hero-overlay"></div>

    <div class="hero-content">
      <h1 class="hero-name" id="hero-name"></h1>
      <a href="/gallery/" class="btn-primary mt-8 inline-flex" style="margin-top:2rem">
        View Gallery
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-left:0.5rem">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>
    </div>

    <!-- Scroll indicator -->
    <div class="scroll-indicator">
      <span>Scroll</span>
      <div class="scroll-arrow"></div>
    </div>
  </section>

  <!-- ── A few shots ── -->
  <section id="selected-work">
    <div class="text-center py-16 px-6 fade-in">
      <p class="text-xs tracking-widest uppercase mb-4" style="color:var(--color-muted)">some favorites</p>
      <div class="gold-rule"></div>
    </div>

    <!-- Featured photos: 2-col grid, random subset each load -->
    <div id="featured-photos-wrap" style="display:none">
      <div class="fade-in fade-in-delay-1" style="max-width:640px;margin:0 auto;padding:0 2.5rem 2.5rem">
        <div id="featured-photos-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start">
          <div id="feat-col-left"  style="display:flex;flex-direction:column;gap:56px"></div>
          <div id="feat-col-right" style="display:flex;flex-direction:column;gap:56px"></div>
        </div>
      </div>
    </div>

    <!-- Fallback: album cards (shown when featuredPhotos is empty) -->
    <div id="featured-albums-wrap" class="fade-in fade-in-delay-1" style="display:none">
      <div id="featured-grid" class="editorial-grid">
        <!-- Populated by JS -->
      </div>
    </div>

    <div class="text-center py-14 fade-in fade-in-delay-2">
      <a href="/gallery/" class="btn-ghost">Browse Gallery</a>
    </div>
  </section>

  <!-- ── Footer ── -->
  <footer>
    <p id="footer-name"></p>
    <p class="mt-1">
      <a href="/gallery/">Gallery</a>
    </p>
  </footer>

  <!-- Scripts -->
  <script src="/js/config.js"></script>
  <script src="/js/routes.js"></script>
  <script src="/js/main.js"></script>
  <script>
    // ── Hero ──────────────────────────────────────────────────────────────────
    const heroBg = document.getElementById('hero-bg');
    const heroImg = document.createElement('img');
    heroImg.src = SITE_CONFIG.heroImage;
    heroImg.alt = '';
    heroImg.decoding = 'async';
    heroImg.fetchPriority = 'high';
    const isMobileHero = window.matchMedia('(max-width: 768px)').matches;
    const heroPos = isMobileHero && SITE_CONFIG.heroPositionMobile
      ? SITE_CONFIG.heroPositionMobile
      : SITE_CONFIG.heroPosition;
    if (heroPos) heroImg.style.objectPosition = heroPos;
    heroBg.appendChild(heroImg);
    document.getElementById('hero-name').textContent = SITE_CONFIG.photographerName;
    document.getElementById('footer-name').textContent = `© ${new Date().getFullYear()} ${SITE_CONFIG.photographerName}`;
    document.title = `${SITE_CONFIG.photographerName} — Photography`;

    // ── Featured photos grid ──────────────────────────────────────────────────
    const featuredPhotos = SITE_CONFIG.featuredPhotos || [];
    const featShown = [...featuredPhotos].sort(() => Math.random() - 0.5).slice(0, 6);

    // Find which album a photo URL belongs to
    function findAlbumForPhoto(url) {
      return ALBUMS.find(a => a.type !== 'group' && getAlbumAllPhotos(a).includes(url));
    }

    if (featuredPhotos.length > 0) {
      document.getElementById('featured-photos-wrap').style.display = '';

      const colLeft  = document.getElementById('feat-col-left');
      const colRight = document.getElementById('feat-col-right');

      featShown.forEach((url, i) => {
        const album = findAlbumForPhoto(url);
        const href  = album ? albumPhotoUrl(album, url) : '/gallery/';

        const link = document.createElement('a');
        link.href  = href;
        link.style.cssText = 'display:block;position:relative;overflow:hidden;background:var(--color-surface)';

        const img = document.createElement('img');
        img.alt     = album ? album.title : '';
        img.loading = i < 2 ? 'eager' : 'lazy';
        img.style.cssText = 'width:100%;height:auto;display:block;opacity:0;transition:opacity 0.4s ease,transform 0.5s ease';
        img.addEventListener('load',  () => { img.style.opacity = '1'; });
        img.addEventListener('error', () => { img.src = url; }, { once: true });
        img.src = gridUrl(url);

        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:absolute;inset:0;background:rgba(0,0,0,0.18);opacity:0;transition:opacity 0.25s;pointer-events:none';

        link.appendChild(img);
        link.appendChild(overlay);
        link.addEventListener('mouseenter', () => { overlay.style.opacity = '1'; img.style.transform = 'scale(1.025)'; });
        link.addEventListener('mouseleave', () => { overlay.style.opacity = '0'; img.style.transform = ''; });

        (i % 2 === 0 ? colLeft : colRight).appendChild(link);
      });

    } else {
      // Fallback: show recent album cards
      document.getElementById('featured-albums-wrap').style.display = '';

      const publicAlbums = ALBUMS.filter(a => !a.protected && !a.hidden && !a.parentId && isCompleteAlbum(a)).slice(0, 3);
      const grid = document.getElementById('featured-grid');
      if (publicAlbums.length > 0 && publicAlbums.length < 3) {
        grid.classList.add(`editorial-grid--count-${publicAlbums.length}`);
      }
      publicAlbums.forEach((album, i) => {
        const isGroup = album.type === 'group';
        const card = document.createElement('a');
        card.href = albumPageUrl(album);
        card.className = 'album-card block';
        card.style.animationDelay = `${i * 0.1}s`;
        const posStyle = album.coverPosition ? ` style="object-position:${album.coverPosition}"` : '';
        const dateline = albumDateline(album, { withDesc: !isGroup });
        const desc = albumCardDesc(album);
        card.innerHTML = `
          <img class="album-card-img" src="${albumCoverUrl(album)}" alt="${album.title}" loading="${i === 0 ? 'eager' : 'lazy'}"${posStyle} />
          <div class="album-card-overlay">
            ${dateline ? `<p class="album-card-dateline">${dateline}</p>` : ''}
            <h3 class="album-card-title">${album.title}</h3>
            ${desc ? `<p class="album-card-desc${isEmptyAlbum(album) ? ' album-card-desc--tbd' : ''}">${desc}</p>` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
