<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preload" as="image" href="/images/hero.jpg" />
  <title>Raveen Fernando</title>
  <meta name="description" content="Photography portfolio of Raveen Fernando — landscapes, street, travel, and beyond." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://raveenfernando.com/" />
  <meta property="og:title" content="Raveen Fernando" />
  <meta property="og:description" content="Photography portfolio of Raveen Fernando — landscapes, street, travel, and beyond." />
  <meta property="og:image" content="https://raveenfernando.com/images/hero.jpg" />
  <meta property="og:image:width" content="1920" />
  <meta property="og:image:height" content="1280" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Raveen Fernando" />
  <meta name="twitter:description" content="Photography portfolio of Raveen Fernando — landscapes, street, travel, and beyond." />
  <meta name="twitter:image" content="https://raveenfernando.com/images/hero.jpg" />

  <!-- Custom styles -->
  <link rel="stylesheet" href="/css/style.css" />
  <!-- Tailwind preflight + used utilities, precompiled (replaces the dev CDN) -->
  <link rel="stylesheet" href="/css/base.css" />

  <style>
    /* Home = photographs. Albums live in Gallery. */
    #selected-work {
      position: relative;
      padding: clamp(5rem, 9vw, 8rem) 0 clamp(4rem, 8vw, 7rem);
      background: #0c0c0b;
      color: #f3f0e9;
    }
    #selected-work .feat-preview-inner {
      width: min(100% - 3rem, 100rem);
      margin: 0 auto;
    }
    #featured-photos-grid {
      display: flex;
      flex-direction: column;
      gap: clamp(4.5rem, 9vw, 9rem);
    }
    #featured-photos-wrap .feat-card {
      display: block;
      position: relative;
      color: inherit;
      text-decoration: none;
    }
    #featured-photos-wrap .feat-card:nth-child(1) { width: 64%; }
    #featured-photos-wrap .feat-card:nth-child(2) { width: 48%; margin-left: auto; }
    #featured-photos-wrap .feat-card:nth-child(3) { width: 42%; margin-left: 9%; }
    #featured-photos-wrap .feat-card:nth-child(4) { width: 62%; margin-left: auto; }
    #featured-photos-wrap .feat-card:nth-child(5) { width: 70%; }
    #featured-photos-wrap .feat-card:nth-child(6) { width: 42%; margin-left: auto; margin-right: 7%; }
    #featured-photos-wrap .feat-image-wrap {
      overflow: hidden;
      background: #161615;
    }
    #featured-photos-wrap img {
      width: 100%;
      height: auto;
      display: block;
      opacity: 0;
      transition: opacity 0.6s ease, transform 0.8s cubic-bezier(0.2, 0.7, 0.2, 1);
    }
    #featured-photos-wrap img.loaded {
      opacity: 1;
    }
    #featured-photos-wrap .feat-card:hover img.loaded {
      transform: scale(1.015);
    }
    #featured-photos-wrap .feat-caption {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 0.75rem;
      font-size: 0.65rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    #featured-photos-wrap .feat-place {
      color: rgba(243,240,233,0.78);
    }
    #featured-photos-wrap .feat-date {
      color: rgba(243,240,233,0.38);
      text-align: right;
    }
    #selected-work .feat-end {
      width: min(100% - 3rem, 100rem);
      margin: clamp(5rem, 10vw, 9rem) auto 0;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(243,240,233,0.12);
      display: flex;
      justify-content: flex-end;
    }
    #selected-work .feat-end a {
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(243,240,233,0.55);
      text-decoration: none;
      border-bottom: 1px solid rgba(243,240,233,0.22);
      padding-bottom: 0.15rem;
      transition: color var(--transition), border-color var(--transition);
    }
    #selected-work .feat-end a:hover {
      color: #f3f0e9;
      border-bottom-color: rgba(243,240,233,0.7);
    }
    body:has(.hero) footer {
      background: #0c0c0b;
      border-top-color: rgba(243,240,233,0.12);
      color: rgba(243,240,233,0.45);
    }
    body:has(.hero) footer a {
      color: rgba(243,240,233,0.45);
    }
    @media (max-width: 640px) {
      #selected-work .feat-preview-inner,
      #selected-work .feat-end {
        width: calc(100% - 2.5rem);
      }
      #featured-photos-grid { display: block; }
      #featured-photos-wrap .feat-card:nth-child(n) {
        width: 100%;
        margin: 0 0 4rem;
      }
      #featured-photos-wrap .feat-card:nth-child(even) {
        width: 78%;
        margin-left: auto;
      }
      #featured-photos-wrap .feat-card:nth-child(3) { width: 84%; }
      #featured-photos-wrap .feat-card:nth-child(n+6) { display: none; }
    }
  </style>
</head>
<body class="overflow-x-hidden">

  <!-- ── Navigation ── -->
  <nav id="main-nav">
    <a href="/" class="nav-logo">RF<span>.</span></a>

    <!-- Desktop links -->
    <ul class="nav-links">
      <li><a href="/"   data-nav-link data-nav="home">Home</a></li>
      <li><a href="/gallery/" data-nav-link data-nav="gallery">Gallery</a></li>
      <li id="nav-family-gallery-item" style="display:none"><a href="/familyalbums/" data-nav-link data-nav="family">Family Gallery</a></li>
      <li id="nav-about-item"><a href="/about/" data-nav-link data-nav="about">About</a></li>
      <li id="nav-unlock-item"><a href="/unlock/" id="nav-unlock-link" data-nav-link data-nav="unlock">Private Access</a></li>
      <li id="nav-signout-item" style="display:none"><a href="#" onclick="signOut();return false;" data-nav="signout">Sign out</a></li>
    </ul>

    <!-- Hamburger -->
    <button id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </nav>

  <!-- Mobile menu overlay -->
  <div id="mobile-menu" role="dialog" aria-label="Navigation menu">
    <a href="/">Home</a>
    <a href="/gallery/">Gallery</a>
    <a href="/familyalbums/" id="mobile-family-gallery-link" style="display:none">Family Gallery</a>
    <a href="/about/" id="mobile-about-link">About</a>
    <a href="/unlock/" id="mobile-unlock-link">Private Access</a>
    <a href="#" id="mobile-signout-link" onclick="signOut();return false;" style="display:none">Sign out</a>
  </div>

  <!-- ── Hero ── -->
  <section class="hero">
    <!-- R2: Set background-image to your R2 hero URL in config.js — injected below -->
    <div class="hero-bg" id="hero-bg"></div>
    <div class="hero-overlay"></div>

    <div class="hero-content">
      <h1 class="hero-name" id="hero-name"></h1>
      <a href="/gallery/" class="btn-primary mt-8 inline-flex" style="margin-top:2rem">
        View Gallery
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-left:0.5rem">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>
    </div>

  </section>

  <!-- ── Photographs ── -->
  <section id="selected-work" aria-label="Selected photographs">
    <div id="featured-photos-wrap" style="display:none">
      <div class="feat-preview-inner">
        <div id="featured-photos-grid"></div>
      </div>
      <div class="feat-end fade-in fade-in-delay-1">
        <a href="/gallery/">All albums</a>
      </div>
    </div>
  </section>

  <!-- ── Footer ── -->
  <footer>
    <p id="footer-name"></p>
    <p class="mt-1">
      <a href="/gallery/">Gallery</a>
    <a href="/about/">About</a>
    </p>
  </footer>

  <!-- Scripts -->
  <script src="/js/config.js"></script>
  <script src="/js/albums/clients.js"></script>
  <script src="/js/albums/family-2025.js"></script>
  <script src="/js/albums/family-2026.js"></script>
  <script src="/js/albums/california-2025.js"></script>
  <script src="/js/albums/misc-2026.js"></script>
  <script src="/js/albums/italy-2026.js"></script>
  <script src="/js/albums.js"></script>
  <script src="/js/routes.js"></script>
  <script src="/js/main.js"></script>
  <script>
    // ── Hero ──────────────────────────────────────────────────────────────────
    const heroBg = document.getElementById('hero-bg');
    const heroImg = document.createElement('img');
    heroImg.src = SITE_CONFIG.heroImage;
    heroImg.alt = '';
    heroImg.decoding = 'async';
    heroImg.fetchPriority = 'high';
    const isMobileHero = window.matchMedia('(max-width: 768px)').matches;
    const heroPos = isMobileHero && SITE_CONFIG.heroPositionMobile
      ? SITE_CONFIG.heroPositionMobile
      : SITE_CONFIG.heroPosition;
    if (heroPos) heroImg.style.objectPosition = heroPos;
    heroBg.appendChild(heroImg);
    document.getElementById('hero-name').textContent = SITE_CONFIG.photographerName;
    document.getElementById('footer-name').textContent = `© ${new Date().getFullYear()} ${SITE_CONFIG.photographerName}`;
    document.title = SITE_CONFIG.photographerName;

    // ── Selected photographs (albums live in Gallery) ─────────────────────────
    const featuredPhotos = (SITE_CONFIG.featuredPhotos || []).slice(0, 6);
    const wrap = document.getElementById('featured-photos-wrap');
    const grid = document.getElementById('featured-photos-grid');

    function findAlbumForPhoto(url) {
      return ALBUMS.find(a => a.type !== 'group' && getAlbumAllPhotos(a).includes(url));
    }

    if (featuredPhotos.length) {
      wrap.style.display = '';

      featuredPhotos.forEach((url, i) => {
        const album = findAlbumForPhoto(url);
        const link = document.createElement('a');
        link.href = album ? Routes.albumPageUrl(album) : '/gallery/';
        link.className = 'feat-card';

        const imageWrap = document.createElement('div');
        imageWrap.className = 'feat-image-wrap';

        const img = document.createElement('img');
        img.alt = album ? (album.location || album.title) : '';
        img.loading = i < 2 ? 'eager' : 'lazy';
        img.addEventListener('load', () => img.classList.add('loaded'));
        img.addEventListener('error', () => { img.src = url; }, { once: true });
        img.src = gridUrl(url);

        imageWrap.appendChild(img);
        link.appendChild(imageWrap);

        if (album) {
          const caption = document.createElement('div');
          caption.className = 'feat-caption';
          caption.innerHTML = `
            <span class="feat-place">${album.location || album.title}</span>
            <span class="feat-date">${album.date || ''}</span>
          `;
          link.appendChild(caption);
        }

        grid.appendChild(link);
      });
    }
  </script>
</body>
</html>
