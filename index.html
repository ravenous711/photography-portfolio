</head>
<body class="overflow-x-hidden portfolio-page dark-page">

  <nav id="main-nav">
    <a href="/" class="nav-logo" aria-label="Raveen Fernando">RF<span class="nav-logo-dot">.</span></a>
    <ul class="nav-links">
      <li id="nav-work-item" class="nav-dropdown">
        <button type="button" id="nav-work-trigger" class="nav-dropdown-trigger" data-nav-link data-nav="work" aria-expanded="false" aria-haspopup="true" aria-controls="nav-work-menu">Photos</button>
        <div id="nav-work-menu" class="nav-dropdown-menu" role="menu" hidden>
          <a class="nav-dropdown-item" role="menuitem" href="/photos/travel/">Travel</a>
          <a class="nav-dropdown-item" role="menuitem" href="/photos/life/">Life</a>
          <a class="nav-dropdown-item" role="menuitem" href="/photos/events/">Events</a>
          <a class="nav-dropdown-item" role="menuitem" href="/photos/couples/">Couples</a>
        </div>
      </li>
      <li id="nav-about-item"><a href="/about/" data-nav-link data-nav="about">About</a></li>
      <li><a href="/#contact" data-nav-link data-nav="contact">Contact</a></li>
      <li id="nav-unlock-item" class="nav-dropdown">
        <button type="button" id="nav-unlock-trigger" class="nav-dropdown-trigger" data-nav-link data-nav="unlock" aria-expanded="false" aria-haspopup="true" aria-controls="nav-private-menu">Private Access</button>
        <div id="nav-private-menu" class="nav-dropdown-menu" role="menu" hidden></div>
      </li>
    </ul>
    <button id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </nav>

  <div id="mobile-menu" role="dialog" aria-label="Navigation menu">
    <div class="mobile-menu-sheet">
      <button type="button" id="mobile-work-trigger" aria-expanded="false" aria-controls="mobile-work-menu">Photos</button>
      <div id="mobile-work-menu" class="mobile-work-menu" hidden>
        <a href="/photos/travel/">Travel</a>
        <a href="/photos/life/">Life</a>
        <a href="/photos/events/">Events</a>
        <a href="/photos/couples/">Couples</a>
      </div>
      <a href="/about/" id="mobile-about-link">About</a>
      <a href="/#contact">Contact</a>
      <div id="mobile-private-access" class="mobile-private-access">
        <button type="button" id="mobile-private-trigger" aria-expanded="false" aria-controls="mobile-private-menu">Private Access</button>
        <div id="mobile-private-menu" class="mobile-private-menu" hidden></div>
      </div>
    </div>
  </div>

  <section class="hero hero--photo-only" aria-label="Yosemite">
    <div class="hero-bg" id="hero-bg"></div>
    <div class="hero-overlay"></div>
  </section>

  <section id="home-chapters" aria-label="Photos"></section>

  <section class="portfolio-inquiry" id="contact" aria-label="Reach out">
    <h2>Reach out</h2>
    <div class="portfolio-inquiry-links">
      <a id="contact-email" href="mailto:hello@raveenfernando.com">hello@raveenfernando.com</a>
      <a id="contact-instagram" href="https://www.instagram.com/ravenous711/" target="_blank" rel="noopener">Instagram</a>
    </div>
  </section>

  <footer>
    <p id="footer-name"></p>
  </footer>

  <script src="/js/config.js"></script>
  <script src="/js/portfolio.js"></script>
  <script src="/js/albums/clients.js"></script>
  <script src="/js/albums/family-2025.js"></script>
  <script src="/js/albums/family-2026.js"></script>
  <script src="/js/albums/california-2025.js"></script>
  <script src="/js/albums/misc-2026.js"></script>
  <script src="/js/albums/italy-2026.js"></script>
  <script src="/js/albums/morgan-alden-2026.js"></script>
  <script src="/js/albums.js"></script>
  <script src="/js/portfolio-preview.js"></script>
  <script src="/js/routes.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.getElementById('footer-name').textContent =
      `© ${new Date().getFullYear()} ${SITE_CONFIG.photographerName}`;
    document.title = `${SITE_CONFIG.photographerName} — Photography`;

    const heroBg = document.getElementById('hero-bg');
    const heroImg = document.createElement('img');
    heroImg.src = SITE_CONFIG.heroImage;
    heroImg.alt = 'Yosemite';
    heroImg.decoding = 'async';
    heroImg.fetchPriority = 'high';
    const isMobileHero = window.matchMedia('(max-width: 768px)').matches;
    const heroPos = isMobileHero && SITE_CONFIG.heroPositionMobile
      ? SITE_CONFIG.heroPositionMobile
      : SITE_CONFIG.heroPosition;
    if (heroPos) heroImg.style.objectPosition = heroPos;
    heroBg.appendChild(heroImg);

    const emailLink = document.getElementById('contact-email');
    if (SITE_CONFIG.email) {
      emailLink.href = `mailto:${SITE_CONFIG.email}`;
      emailLink.textContent = SITE_CONFIG.email;
    }
    const instagram = document.getElementById('contact-instagram');
    if (SITE_CONFIG.instagram) instagram.href = SITE_CONFIG.instagram;
    instagram.textContent = SITE_CONFIG.instagramHandle || 'Instagram';

    const italy = ALBUMS.find(album => album.id === 'italy-2026');
    const bannerImages = {
      travel: italy?.coverImage || `${R2_BASE_URL}/Italy/Venice/Digital/venice_284.jpg`,
      life: `${R2_BASE_URL}/Misc-Film-Rolls-2026/Ultramax-0314/ultramax_0314_24.jpg`,
    };

    const chapters = document.getElementById('home-chapters');
    PORTFOLIO_CATEGORIES.forEach((category, index) => {
      const photos = portfolioPhotos(category.id);
      const placeholder = portfolioPlaceholder(category.id);
      const cover = bannerImages[category.id] || photos[0];
      const link = document.createElement('a');
      link.className = 'home-banner';
      link.href = category.path;

      const media = document.createElement('div');
      media.className = 'home-banner-media';
      if (cover) {
        const img = document.createElement('img');
        img.alt = '';
        img.decoding = 'async';
        img.loading = index === 0 ? 'eager' : 'lazy';
        img.addEventListener('load', () => img.classList.add('loaded'));
        img.src = typeof viewUrl === 'function' ? viewUrl(cover) : cover;
        media.appendChild(img);
      }

      const copy = document.createElement('div');
      copy.className = 'home-banner-copy';
      const title = document.createElement('p');
      title.className = 'home-banner-title';
      title.textContent = category.title;
      const cta = document.createElement('span');
      cta.className = 'home-banner-cta';
      cta.textContent = placeholder ? 'Coming soon' : 'View';
      copy.append(title, cta);

      const shade = document.createElement('div');
      shade.className = 'home-banner-shade';
      link.append(media, shade, copy);
      chapters.appendChild(link);
    });
  </script>
</body>
</html>
