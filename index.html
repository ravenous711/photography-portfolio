<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preload" as="image" href="/images/hero.jpg" />
  <title>Raveen Fernando</title>
  <meta name="description" content="Photography portfolio of Raveen Fernando — landscapes, street, travel, and beyond." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://raveenfernando.com/" />
  <meta property="og:title" content="Raveen Fernando" />
  <meta property="og:description" content="Photography portfolio of Raveen Fernando — landscapes, street, travel, and beyond." />
  <meta property="og:image" content="https://raveenfernando.com/images/hero.jpg" />
  <meta property="og:image:width" content="1920" />
  <meta property="og:image:height" content="1280" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Raveen Fernando" />
  <meta name="twitter:description" content="Photography portfolio of Raveen Fernando — landscapes, street, travel, and beyond." />
  <meta name="twitter:image" content="https://raveenfernando.com/images/hero.jpg" />

  <!-- Custom styles -->
  <link rel="stylesheet" href="/css/style.css" />
  <!-- Tailwind preflight + used utilities, precompiled (replaces the dev CDN) -->
  <link rel="stylesheet" href="/css/base.css" />

  <style>
    #selected-work {
      background: #0c0c0b;
      color: #f3f0e9;
    }
    #selected-work .chapters {
      display: flex;
      flex-direction: column;
    }
    #selected-work .chapter {
      position: relative;
      display: block;
      min-height: 88svh;
      overflow: hidden;
      color: inherit;
      text-decoration: none;
    }
    #selected-work .chapter-media {
      position: absolute;
      inset: 0;
      background: #161615;
    }
    #selected-work .chapter-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transform: scale(1.03);
      transition: opacity 0.8s ease, transform 1.1s cubic-bezier(0.2, 0.7, 0.2, 1);
    }
    #selected-work .chapter-media img.loaded {
      opacity: 1;
      transform: scale(1);
    }
    #selected-work .chapter:hover .chapter-media img.loaded {
      transform: scale(1.03);
    }
    #selected-work .chapter-shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.72) 0%,
        rgba(0,0,0,0.18) 42%,
        rgba(0,0,0,0.08) 100%
      );
      pointer-events: none;
    }
    #selected-work .chapter-copy {
      position: absolute;
      left: clamp(1.25rem, 4vw, 4rem);
      right: clamp(1.25rem, 4vw, 4rem);
      bottom: clamp(2rem, 5vw, 4rem);
      z-index: 1;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1.5rem;
    }
    #selected-work .chapter-meta {
      min-width: 0;
    }
    #selected-work .chapter-date {
      margin: 0 0 0.55rem;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(243,240,233,0.55);
    }
    #selected-work .chapter-title {
      margin: 0;
      font-family: var(--font-serif);
      font-size: clamp(2.5rem, 6vw, 5.5rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 0.95;
      color: #fff;
    }
    #selected-work .chapter-go {
      flex-shrink: 0;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(243,240,233,0.72);
      border-bottom: 1px solid rgba(243,240,233,0.28);
      padding-bottom: 0.2rem;
      transition: color var(--transition), border-color var(--transition);
    }
    #selected-work .chapter:hover .chapter-go {
      color: #fff;
      border-bottom-color: rgba(255,255,255,0.7);
    }
    #selected-work .chapters-foot {
      padding: clamp(3.5rem, 7vw, 5.5rem) 1.5rem;
      text-align: center;
    }
    #selected-work .chapters-foot a {
      color: #f3f0e9;
      background: transparent;
      border-color: rgba(243,240,233,0.28);
    }
    #selected-work .chapters-foot a:hover {
      background: rgba(243,240,233,0.08);
      border-color: rgba(243,240,233,0.55);
    }
    body:has(.hero) footer {
      background: #0c0c0b;
      border-top-color: rgba(243,240,233,0.12);
      color: rgba(243,240,233,0.45);
    }
    body:has(.hero) footer a {
      color: rgba(243,240,233,0.45);
    }
    @media (max-width: 640px) {
      #selected-work .chapter {
        min-height: 78svh;
      }
      #selected-work .chapter-copy {
        flex-direction: column;
        align-items: flex-start;
        gap: 1.25rem;
      }
    }
  </style>
</head>
<body class="overflow-x-hidden">

  <!-- ── Navigation ── -->
  <nav id="main-nav">
    <a href="/" class="nav-logo">RF<span>.</span></a>

    <!-- Desktop links -->
    <ul class="nav-links">
      <li><a href="/"   data-nav-link data-nav="home">Home</a></li>
      <li><a href="/gallery/" data-nav-link data-nav="gallery">Gallery</a></li>
      <li id="nav-family-gallery-item" style="display:none"><a href="/familyalbums/" data-nav-link data-nav="family">Family Gallery</a></li>
      <li id="nav-about-item"><a href="/about/" data-nav-link data-nav="about">About</a></li>
      <li id="nav-unlock-item"><a href="/unlock/" id="nav-unlock-link" data-nav-link data-nav="unlock">Private Access</a></li>
      <li id="nav-signout-item" style="display:none"><a href="#" onclick="signOut();return false;" data-nav="signout">Sign out</a></li>
    </ul>

    <!-- Hamburger -->
    <button id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </nav>

  <!-- Mobile menu overlay -->
  <div id="mobile-menu" role="dialog" aria-label="Navigation menu">
    <a href="/">Home</a>
    <a href="/gallery/">Gallery</a>
    <a href="/familyalbums/" id="mobile-family-gallery-link" style="display:none">Family Gallery</a>
    <a href="/about/" id="mobile-about-link">About</a>
    <a href="/unlock/" id="mobile-unlock-link">Private Access</a>
    <a href="#" id="mobile-signout-link" onclick="signOut();return false;" style="display:none">Sign out</a>
  </div>

  <!-- ── Hero ── -->
  <section class="hero">
    <!-- R2: Set background-image to your R2 hero URL in config.js — injected below -->
    <div class="hero-bg" id="hero-bg"></div>
    <div class="hero-overlay"></div>

    <div class="hero-content">
      <h1 class="hero-name" id="hero-name"></h1>
      <a href="/gallery/" class="btn-primary mt-8 inline-flex" style="margin-top:2rem">
        View Gallery
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-left:0.5rem">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>
    </div>

  </section>

  <!-- ── Album chapters ── -->
  <section id="selected-work">
    <div id="home-chapters" class="chapters"></div>
    <div class="chapters-foot fade-in">
      <a href="/gallery/" class="btn-ghost">Browse Gallery</a>
    </div>
  </section>

  <!-- ── Footer ── -->
  <footer>
    <p id="footer-name"></p>
    <p class="mt-1">
      <a href="/gallery/">Gallery</a>
    <a href="/about/">About</a>
    </p>
  </footer>

  <!-- Scripts -->
  <script src="/js/config.js"></script>
  <script src="/js/albums/clients.js"></script>
  <script src="/js/albums/family-2025.js"></script>
  <script src="/js/albums/family-2026.js"></script>
  <script src="/js/albums/california-2025.js"></script>
  <script src="/js/albums/misc-2026.js"></script>
  <script src="/js/albums/italy-2026.js"></script>
  <script src="/js/albums.js"></script>
  <script src="/js/routes.js"></script>
  <script src="/js/main.js"></script>
  <script>
    // ── Hero ──────────────────────────────────────────────────────────────────
    const heroBg = document.getElementById('hero-bg');
    const heroImg = document.createElement('img');
    heroImg.src = SITE_CONFIG.heroImage;
    heroImg.alt = '';
    heroImg.decoding = 'async';
    heroImg.fetchPriority = 'high';
    const isMobileHero = window.matchMedia('(max-width: 768px)').matches;
    const heroPos = isMobileHero && SITE_CONFIG.heroPositionMobile
      ? SITE_CONFIG.heroPositionMobile
      : SITE_CONFIG.heroPosition;
    if (heroPos) heroImg.style.objectPosition = heroPos;
    heroBg.appendChild(heroImg);
    document.getElementById('hero-name').textContent = SITE_CONFIG.photographerName;
    document.getElementById('footer-name').textContent = `© ${new Date().getFullYear()} ${SITE_CONFIG.photographerName}`;
    document.title = SITE_CONFIG.photographerName;

    // ── Album chapters (Italy / California / Red Rock) ─────────────────────────
    const chapterIds = ['italy-2026', 'california', 'red-rock-canyon-2026'];
    const chaptersEl = document.getElementById('home-chapters');

    chapterIds.forEach((id, i) => {
      const album = ALBUMS.find(a => a.id === id);
      if (!album || !isCompleteAlbum(album)) return;

      const link = document.createElement('a');
      link.href = Routes.albumPageUrl(album);
      link.className = 'chapter fade-in';
      if (i > 0) link.classList.add(`fade-in-delay-${Math.min(i, 2)}`);

      const media = document.createElement('div');
      media.className = 'chapter-media';

      const img = document.createElement('img');
      img.alt = album.title;
      img.loading = i === 0 ? 'eager' : 'lazy';
      img.fetchPriority = i === 0 ? 'high' : 'auto';
      if (album.coverPosition) img.style.objectPosition = album.coverPosition;
      img.addEventListener('load', () => img.classList.add('loaded'));
      img.src = albumCoverUrl(album);
      media.appendChild(img);

      const shade = document.createElement('div');
      shade.className = 'chapter-shade';

      const copy = document.createElement('div');
      copy.className = 'chapter-copy';
      copy.innerHTML = `
        <div class="chapter-meta">
          ${album.date ? `<p class="chapter-date">${album.date}</p>` : ''}
          <h2 class="chapter-title">${album.location || album.title}</h2>
        </div>
        <span class="chapter-go">View album</span>
      `;

      link.append(media, shade, copy);
      chaptersEl.appendChild(link);
    });
  </script>
</body>
</html>
