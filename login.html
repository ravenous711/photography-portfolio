<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raveen Fernando — Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/config.js"></script>
  <style>
    body { background: #f8f7f5; }
    input:focus { outline: none; }
    .shake { animation: shake 0.4s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm text-center">
    <p class="text-black/30 text-xs tracking-[0.2em] uppercase mb-3">Preview Access</p>
    <h1 class="text-black text-2xl font-light tracking-widest mb-10" id="site-name">–</h1>

    <form id="login-form" class="space-y-4" novalidate>
      <input
        id="password-input"
        type="password"
        placeholder="Enter password"
        autocomplete="current-password"
        class="w-full bg-black/5 border border-black/10 text-black placeholder-black/30 rounded px-4 py-3 text-center tracking-widest focus:border-black/40 transition-colors"
      />
      <button
        type="submit"
        class="w-full bg-black text-white font-medium py-3 rounded hover:bg-black/80 active:scale-95 transition-all"
      >
        Enter
      </button>
      <p id="error-msg" class="text-red-500/80 text-sm hidden">Incorrect password</p>
    </form>
  </div>

  <script>
    document.getElementById('site-name').textContent = SITE_CONFIG.photographerName;

    const params = new URLSearchParams(window.location.search);
    const returnTo = params.get('return') || 'index.html';

    // Already unlocked? Go straight through
    if (sessionStorage.getItem('site_unlocked') === 'true') {
      window.location.replace(returnTo);
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('password-input').value.trim();
      if (!pw) return;

      const encoder = new TextEncoder();
      const data = encoder.encode(pw);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hash = Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');

      if (hash === SITE_CONFIG.sitePasswordHash) {
        sessionStorage.setItem('site_unlocked', 'true');
        window.location.replace(returnTo);
      } else {
        const input = document.getElementById('password-input');
        const err = document.getElementById('error-msg');
        input.classList.add('shake', 'border-red-500/50');
        err.classList.remove('hidden');
        input.value = '';
        setTimeout(() => {
          input.classList.remove('shake', 'border-red-500/50');
        }, 500);
      }
    });
  </script>
</body>
</html>
